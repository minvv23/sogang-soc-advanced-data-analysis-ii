### LLM 이타성의 메커니즘 (1) 설계 (arXiv 2604.19260)

Zhang 외 (Tsinghua / CUFE / HKUST).

<strong>이 연구가 던지는 질문</strong>
- LLM이 보이는 친사회적(이타적) 행동을 만들어내는 <strong>내부 계산</strong>은 무엇인가.
- 겉으로 드러난 행동을 관찰하는 데서 한 걸음 더 들어가, 모델 내부의 특징(feature) 수준에서 그 작동 원리를 기계적으로 해석한다.

```mermaid
flowchart TD
    A["독재자게임 $100<br/>minimal-pair<br/>generous vs selfish"] --> B["잔차스트림 차이<br/>delta = h_gen - h_self"]
    B --> C["SAE 분해<br/>h ≈ Σ f_i·d_i"]
    C --> D["K=8 변형 검증셋<br/>활성+부호일관만 유지"]
    D --> E["<b>2048 후보특징</b><br/>전체 0.024%<br/>중간층 집중"]
    E --> F["System1/System2 분류<br/>6 벤치마크<br/>logit lens 의미"]
    classDef blue fill:#bbdefb,stroke:#0d47a1,color:#000
    classDef green fill:#c8e6c9,stroke:#2e7d32,color:#000
    class A,B,C blue
    class D,E,F green
```

<strong>왜 중요한가</strong>
- 겉으로 똑같아 보이는 행동도 내부에서는 전혀 다른 과정을 거쳐 나올 수 있다.
- 만약 LLM의 "이타성"이 그저 훈련 데이터 속 패턴의 메아리일 뿐이라면, 표현을 조금만 바꿔도 깨질 것이고 신뢰할 수 없다.
- 내부 변수를 이해해야 모델이 얼마나 견고한지(robustness) 평가하고, 결과를 예측할 수 있는 개입을 설계할 수 있다.
- 이 논문은 친사회적 의사결정을 특징(feature) 수준에서 기계적으로 분석한 첫 연구 중 하나다.

<strong>4단계 파이프라인</strong> (모두 Llama-3.1-8B-Instruct + OpenSAE 사용)
- <strong>(1) 특징 식별</strong> - 독재자 게임($100을 나눠 갖는 게임)에서, 페르소나 단어 하나만 다른 최소대조쌍(minimal-pair, "generous(관대한)" vs "selfish(이기적)")으로 행동 차이를 유도한다.
- 모델 내부의 잔차스트림(residual stream, 층을 타고 흐르는 내부 표현) 차이를 SAE(희소 오토하인코더, 신경망 내부의 뒤섞인 활성값을 사람이 해석할 수 있는 개별 특징들로 분해하는 장치)로 쪼갠다.
- <strong>(2) 특징 분류</strong> - 이중처리 이론(빠르고 직관적인 System 1 vs 느리고 숙고적인 System 2)에 따라, 여러 벤치마크에서의 활성 패턴을 기준으로 특징을 분류한다.
- logit lens(특정 층의 내부 표현을 출력 단어 공간에 비춰 의미를 읽어내는 기법)로 의미를 해석한다.
- <strong>(3) 인과 검증</strong> - 활성화 패칭(activation patching, 특정 내부 특징의 활성값을 인위로 바꿔 넣어 행동이 달라지는지 보는 개입 실험)과 연속적인 스티어링(steering, 원하는 방향으로 출력을 밀어주는 내부 벡터를 더하는 기법)을 쓴다.
- <strong>(4) 외적 타당도</strong> - 같은 스티어링을 다른 사회선호 게임에도 적용해 일반화되는지 보고, CRT(인지반영검사) 문제로 위약(placebo) 검정을 한다.

<strong>독재자 게임과 최소대조쌍</strong>
- 100 단위를 모델에 주고, 익명의 수령자에게 얼마를 줄지 고르게 한다.
- <strong>평가 방식</strong> - 다음 토큰 확률 분포로 한다. 상위 10개 토큰의 확률 가중 평균을 그 모델이 암묵적으로 주려는 평균 분배액(implied mean allocation)으로 본다.
- <strong>행동 대조</strong> - 아무 페르소나 없는 중립 조건 46.4%, generous 49.1%, selfish 22.1%.
- 최소대조쌍은 페르소나 단어 하나만 다르다($100을 generous 결정자 또는 selfish 결정자로 나눠 표현).

<strong>특징을 식별하는 수식</strong>
- 마지막 토큰의 잔차스트림에서 generous와 selfish의 차이 delta = h(x_gen) - h(x_self)를 구하고, 이를 SAE로 h ≈ Σ f_i·d_i + b 형태로 분해한다(여기서 f_i는 특징의 활성값, d_i는 그 특징의 방향).
- 각 특징이 이 차이 방향과 얼마나 정렬됐는지 정렬도 A_i = delta^T·d_i로 잰다.
- <strong>안정화</strong> - 표현 하나에 너무 휘둘리지 않으려고, K=8개의 변형 최소대조쌍 검증셋($20/$70/$128 예산, 능동/수동태, 친사회/이기 동의어 등)에서 (1) 모든 쌍에서 활성화되고 (2) 부호가 일관된(sign이 같은) 특징만 남겼다.
- 평균 절대 정렬도로 순위를 매겨 <strong>2,048개 후보 특징</strong>을 골랐다(32개 층 전체 SAE 특징의 0.024%에 불과). 이 특징들은 중간층(Layer 20 부근)에 몰려 있었다.

### LLM 이타성의 메커니즘 (2) 분류·인과개입과 결과

<strong>System 1/System 2 분류</strong>
- 빠른 직관(휴리스틱) 벤치마크 3개(TruthfulQA, CrowS-Pairs, SST-2)와 느린 숙고 벤치마크 3개(GSM8K, Big-Bench Hard, StrategyQA)를 쓰고, 각각 N=30문항이다.
- 특징 i마다 D_i = (S_i,S2 - S_i,S1)/(S_i,S2 + S_i,S1)로 두 종류 벤치마크에서의 활성 차이를 정규화한 뒤, 삼분위로 잘랐다 - 아래쪽을 System 1 특징(327개), 위쪽을 System 2 특징(328개)으로 봤다.
- <strong>적합도 지표</strong> 두 가지를 썼다 - 코사인 유사도 theta(고른 특징이 한 층 안의 내부 변화를 얼마나 설명하는지), 그리고 Logit Difference Recovery(LDR, 최종 출력 차이를 얼마나 설명하는지).

<strong>인과 개입</strong>
- <strong>(1) 활성화 패칭</strong> - 프롬프트는 그대로 두고, 식별한 특징의 활성값만 반대 페르소나 조건의 값으로 덮어쓴다(generous 실행에 selfish 값을 끼워넣거나, 그 반대로).
- 이렇게 했을 때 행동이 바뀌면 그 특징이 행동을 인과적으로 만든다는 뜻이다.
- <strong>(2) 양방향 스티어링</strong> - 중립 프롬프트에서, 스티어링 벡터 f = alpha·Σ(Δf_i·d_i)를 층 상태에 더한다. alpha로 세기와 부호(관대 쪽/이기 쪽)를 조절한다.
- 첫 층과 마지막 층은 입력 처리와 출력 투영에 쓰이므로 빼고, 중간층에 집중했다.

<strong>핵심 발견</strong>
- <strong>(1) 층별 구조</strong> - System 1 특징은 Layer 13-21에, System 2 특징은 Layer 21-26에 더 우세했다(Δ^(l)의 부호가 뒤집힌다). 직관이 먼저, 숙고가 나중이라는 인간 이중처리의 순서와 일치한다.
- <strong>(2) 의미</strong> - 공정 분배 토큰(split/half/equal)은 주로 System 2에 속했고, 자기 이익 토큰(zero/nothing/minimal)은 양쪽 모두에 걸쳤다.
- 정서 특징은 부정 정서(sorry/reluctant/refuse) 쪽으로 치우쳤다(부정 89.9%, 긍정 10.1%). 이는 적극적으로 도덕적 만족을 추구하기보다 죄책감을 피하려는 동기가 더 강함을 시사한다.
- <strong>(3) 활성화 패칭으로 인과성 확인</strong> - 2,048개 특징 전부를 패칭하니 분배가 크게 움직였다. generous 조건의 평균이 49.1%인데, 전체 패칭 시 30.5%로(18.6%포인트 감소), System 2 특징만 패칭하면 38.8%로(10.3%포인트 감소), System 1만 패칭하면 1.0%포인트밖에 안 바뀌었다.
- 즉 <strong>System 2 특징이 출력에 더 가깝게(근위적으로) 작용한다</strong>. 전략(strategy) 특징은 효과가 컸고, 정서(sentiment) 특징은 거의 효과가 없었다.
- <strong>(4) 스티어링이 일반화</strong> - 독재자 게임에서 뽑아낸 벡터 f를 최후통첩(Ultimatum)/공공재(Public Goods)/신뢰(Trust) 게임에 그대로 적용해도 효과가 일관됐다(Trust 게임 투자가 기본 16.4%였는데, 관대 쪽 스티어링 시 43.2%, 이기 쪽 스티어링 시 2.8%).
- CRT 위약 검정에서는 효과가 미미했다 - 단순히 "숫자만 밀어내는" 인공물이 아니라는 뜻이다.

<strong>한계, 그리고 거울인가 인공물인가</strong>
- <strong>미해결</strong> - 특징들 사이의 회로 구조(아래쪽 특징들이 어떻게 결합하거나 경쟁하는지)는 아직 밝히지 못했고, 이 특징들이 어디서 생겼는지(데이터의 규칙성인지, 모델 규모인지, 구조적 편향인지)도 미해결이다.
- System 1/System 2 라벨은 인간 인지 메커니즘의 증거가 아니라, 벤치마크 활성 패턴으로 정의한 <strong>조작적(operational)</strong> 라벨임을 분명히 밝힌다.
- <strong>정면 돌파</strong> - 이 논문은 거울 vs 인공물 문제를 가장 정면으로 푼다. 패칭과 스티어링으로 인과성을 보이고, 위약 검정으로 일반적인 인공물 가능성을 배제하며, 게임을 넘나드는(cross-game) 일반화로 이게 표면 패턴이 아니라 공유된 내부 표현임을 증명한다.
- <strong>그러나</strong> - 동시에, 이 "이타성"이 인간의 신경 메커니즘을 비추는 거울이 아니라 모델의 표현 수준 구조(부정 정서 회피로 기운 희소한 특징 집합)일 뿐이라는 점도 분명히 한다 - 인과적으로 실재하지만, 인간적 의미의 이타성은 아니다.

### 인지적 오프로딩과 속도 착각 (1) 설계와 사전등록 (arXiv 2605.23177)

Yu, Cheng, Jabbar, Sucholutsky, Collins, Jurafsky, Hawkins (Stanford 외).

<strong>이 연구가 던지는 질문</strong>
- 사람들은 AI를 쓰면 시간이 얼마나 절약되는지에 대해 잘 보정(calibrated)되어 있는가. 즉 자기 기대와 실제가 잘 맞는가.
- 특히 단순한 인지 과제에서는 AI가 시간을 별로 못 줄인다는 사실을 사람들이 알아채는가, 아니면 AI의 효율 이득을 과대평가하는가.
- <strong>측정 대상</strong> - 이 논문이 재는 것은 LLM 자체가 아니라 LLM에 대한 인간의 메타인지(자기 사고를 들여다보고 판단하는 능력)다. 인간-AI 상호작용 속에서 모델이 연구 대상이 되는 또 다른 각도다.

```mermaid
flowchart TD
    A["사전등록 N=1237<br/>24과제 x 2난이도<br/>between-subject"] --> B["<b>예측표본 N=401</b><br/>수행 안 함<br/>독립/AI/타인 시간 예측<br/>+ NFC 척도"]
    A --> C["<b>완료표본 N=836</b><br/>실제 수행<br/>독립 또는 AI(GPT-4o)<br/>숨은 타이머 + NASA-TLX"]
    B --> D{"예측 vs 실제<br/>비교"}
    C --> D
    D --> E["혼합효과모형<br/>time ~ condition*type<br/>+difficulty + (1|PID)+(1|task)"]

    classDef green fill:#c8e6c9,stroke:#2e7d32,color:#000
    classDef yellow fill:#fff9c4,stroke:#f57f17,color:#000
    class A blue
    class B,C green
    class D,E yellow
```

<strong>핵심 가설</strong>
- 메타인지 접근 논변에 근거한 <strong>비대칭적 오보정(miscalibration)</strong>을 예측한다.
- 그 논변은 이렇다 - 우리는 자기 인지에는 불완전하게나마 접근할 수 있지만, LLM 내부에는 그런 접근 통로가 없다.
- 그래서 사람은 자기가 혼자 일을 끝내는 시간은 잘 맞히지만, AI의 도움을 받을 때의 완료 시간은 체계적으로 너무 짧게 잡는다 = <strong>속도 착각(speedup illusion)</strong>.

<strong>사전등록 설계, N=1237</strong>
- Stanford IRB 승인(protocol 83204)을 받고, 분석 계획을 OSF에 미리 등록(사전등록)했다.
- <strong>과제</strong> - 24개를 썼다(Shelby et al.의 4범주 분류 - C1 정보 탐색, C2 정보 처리/종합, C3 절차 안내/실행, C4 콘텐츠 생성/변환, 각 6과제), 난이도는 2단계("올림픽 메달리스트 1명 찾기" vs "10명 찾기").
- <strong>표본</strong> - 미국 성인 대표표본(Prolific 플랫폼), 여성 48%/남성 47%, 백인 58%.
- <strong>설계</strong> - 참가자 간 설계(between-subject)로 했다. 참가자 내 설계(within)로 하면 같은 사람이 과제에 익숙해지면서 완료 시간과 노력이 편향되기 때문이다.

<strong>두 표본을 나눠 운영</strong>
- <strong>(1) 예측 표본(prediction sample, N=401)</strong> - 과제를 실제로 하지 않고 상세 설명만 본 뒤, 혼자 할 때/AI 도움받을 때/다른 사람 도움받을 때의 완료 시간을 예측하게 했다.
- AI와 사람 중 무엇을 쓰고 싶은지 선호도 물었다. 이후 인지 욕구 척도(Need for Cognition, 사고하기를 즐기는 정도)를 쟀다. 이 표본은 AI 사용과 복붙을 막았다.
- <strong>(2) 완료 표본(completion sample, N=836)</strong> - 혼자 또는 AI 도움으로 과제를 실제 수행했다. AI 조건에서는 과제 페이지에 GPT-4o 채팅이 끼워져 있었다. 조건당 과제별로 약 68명이 참여했다.
- 숨은 타이머로 완료 시간을 쟀다. 각 과제가 끝날 때마다 5문항짜리 <strong>NASA-TLX</strong>(과제의 주관적 부담, 즉 노력을 재는 설문 척도 - 정신적 요구/서두름/성공감/노력 강도/불안)를 작성했다.
- 정답인 응답만 분석에 썼다(저품질 응답은 독립 조건 6.3%, AI 조건 4.0%를 제외).

### 인지적 오프로딩과 속도 착각 (2) 모형·결과와 함의

<strong>혼합효과모형</strong>
- 혼합효과모형이란 참가자 개인차나 과제 차이 같은 무작위 효과를 함께 넣어 추정하는 회귀를 말한다.
- 핵심 모형: time ~ condition * type + difficulty + (1|participantID) + (1|taskID). 여기서 condition은 예측 단계인지 완료 단계인지, type은 혼자 하는지 AI 보조인지를 뜻하고, (1|participantID)와 (1|taskID)는 참가자별·과제별 무작위 절편을 의미한다.
- 예측 단계에서는 예측 대상(혼자 vs 보조)과 도움의 출처(AI vs 타인)를 고정효과로, 참가자와 과제를 무작위 절편으로 넣었다.

```mermaid
flowchart LR
    A["혼합효과모형<br/>time ~ condition*type"] --> B["AI 기대단축 68.5초<br/>(z=20.34)"]

<strong>핵심 발견</strong>
- <strong>(1) AI 기대 단축</strong> - 사람들은 AI가 평균 68.5초를 줄여줄 거라 기대했다(beta=68.5, SE=3.37, z=20.34, p&lt;0.001). AI에 기대하는 효율은 다른 사람의 도움보다 컸다(타인 대비 beta=-51.4, z=-10.80).
- 과제 수준에서 보면 24과제 중 AI는 18과제, 타인은 5과제에서 시간 단축을 기대받았다.
- <strong>(2) 실제와 예측의 비대칭</strong> - AI 보조에서 실제 완료 시간이 예측보다 거의 1분 더 길었다(beta=57.8, SE=8.79, z=6.57, p&lt;0.001).
- 반면 혼자 하는 조건은 예측과 실제가 차이가 없었다(beta=-2.52, p=0.775) - 자기 자신에 대한 보정은 정확했다는 뜻이다. 속도 착각은 4개 범주와 2개 난이도 모두에서 나타났다.
- <strong>(3) 어려운 과제만 단축</strong> - AI는 어려운 과제에서만 시간을 줄였고(26.14초, p&lt;0.05), 쉬운 과제는 차이가 없었다. 24과제 중 유의하게 빨라진 건 단 3과제뿐이었다("enjoy 동의어 10개 찾기", 긴 기사 요약, 긴 텍스트 편집).
- <strong>(4) 시간과 노력의 해리</strong> - AI는 완료 시간은 거의 못 줄였지만, NASA-TLX로 잰 주관적 노력은 모든 과제에서 줄였다(평균 7점 만점 중 0.61점 감소, p&lt;0.001, 24과제 중 15과제에서 유의). 시간과 노력의 상관은 약했다(r=0.26).
- <strong>(5) 인지 욕구(Need for Cognition)</strong> - "사고하기를 즐기지 않는" 사람일수록 속도 착각에 더 취약했다(문항 3/4에서 음의 계수). AI 사용 빈도나 AI 태도 척도(AIAS)는 보정 오차를 예측하지 못했다.
- <strong>(6) 프롬프트 분석</strong> - 70%가 한 번만 주고받았고, 18.5%는 과제 지시문을 그대로 복붙했다. 복붙은 시간은 못 줄였지만 노력은 줄였다.
- 논리 문제에서는 GPT-4o가 장황하게 답해 그걸 정리하는 후처리에 113.9초가 더 걸렸다 - AI가 오히려 일을 지연시킨 것이다.

<strong>한계, 그리고 거울 vs 인공물 함의</strong>
- <strong>한계</strong> - 5분 이내 과제로 한정했고, 동기나 인센티브를 통제하지 못했으며(크라우드워크 특성), AI를 쓰는 방식에 개인차가 컸고, 예측 표본과 완료 표본이 완전히 분리된 건 아니다(일부 중복).
- <strong>흥미로운 위치</strong> - 측정 대상이 LLM의 행동이 아니라 LLM에 대한 인간의 왜곡된 정신모형이다. 사람들은 노력이 줄어든 것을 시간이 줄어든 것으로 착각하고, AI의 효율을 과대평가한다.
- <strong>피드백 루프</strong> - 함의가 무거운 이유는, 오보정이 AI 사용을 부추기고 -&gt; 노력이 줄어든 경험이 다시 오보정을 강화하는 루프가 돌고, 과도하게 인지를 떠넘기면(오프로딩) 능력이 퇴화하는(deskilling) 위험이 있기 때문이다.
- AI 생산성 담론은 단지 시간 단축만이 아니라 주관적 경험까지 포함하는, 더 넓은 의미의 오프로딩 개념을 다뤄야 한다.

![AI 속도 착각 - 예측 vs 실제 소요시간](images/speedup_illusion.svg)
### 무엇이 함정인가 - 거울 vs artifact

- <strong>매력</strong> - 이 역할은 행동경제학·사회심리학 개념을 LLM 내부에서 검증할 수 있다는 데 매력이 있다.
- <strong>한계</strong> - LLM의 행동이 인간 사회의 거울인지, 아니면 학습·정렬 과정이 만든 모델 특유의 artifact인지 구분하기 어렵다.
- 밀그램 복종이 도덕의 부재가 아니라 토큰 패턴 지속일 수 있다는 해석, 사람이 AI의 시간 절감을 과대평가한다는 인지 오프로딩 연구가 이를 보여준다.
- <strong>교훈</strong> - 측정값을 인간 사회로 곧장 옮겨 읽는 것은 위험하다. 위험도는 낮지만 해석에 신중함이 필요하다.

## 6. ④ 연구자 보조로서의 LLM

### 파이프라인 자동화

- 네 번째는 연구 활동 자체의 자동화다.
- 가설 생성, 실험 설계, 실행, 분석을 LLM 에이전트가 돌린다.
- 아래 여섯 편이 다루는 범위:
  - 가설 자동 생성 - MOOSE, HypoGeniC, 인과그래프
  - 완전 자동 파이프라인 - Automated Social Science, HLER
  - 개념적 프레임 - Third Ambition

### MOOSE - TOMATO 과제와 파이프라인 (1/3)

arXiv 2309.02726. Yang, Du, Li, Zheng, Poria, Cambria (NTU 외).

<strong>이 논문이 묻는 것</strong>

- 가공되지 않은 웹 문서 덩어리(raw 웹 코퍼스)만 던져 줬을 때, LLM이 스스로 연구가설을 만들 수 있는가.
- 사람이 미리 정리해 둔 자료가 아니라는 점이 핵심이다.
- 그 가설이 사람이 보기에 <strong>새롭고(novel)</strong> <strong>타당한(valid)</strong> 사회과학 연구가설인가.

```mermaid
flowchart LR
  C["Raw Web Corpus<br/>(+ Related Survey)"]:::blue
  BF["Background Finder<br/><b>B</b> 배경 탐색"]:::blue
  ITF["Inspiration Title<br/>Finder"]:::blue
  IF["Inspiration Finder<br/><b>I</b> 영감 추출"]:::blue
  HS["Hypothesis<br/>Suggestor (M-0.5)"]:::green
  HP["Hypothesis Proposer<br/><b>H</b> 가설 제안"]:::green
  CK["Clarity Checker"]:::yellow
  RK["Reality Checker"]:::yellow
  NK["Novelty Checker"]:::yellow
  OUT["Ranked<br/>가설 목록"]:::green
  C --> BF --> ITF --> IF --> HS --> HP
  HP --> CK --> RK --> NK --> OUT
  classDef blue fill:#bbdefb,stroke:#0d47a1,color:#000;
  classDef green fill:#c8e6c9,stroke:#2e7d32,color:#000;
  classDef yellow fill:#fff9c4,stroke:#f57f17,color:#000;
  classDef red fill:#ffcdd2,stroke:#c62828,color:#000;
```

<strong>기존 연구의 한계 두 가지</strong>

- 가설을 만드는 과제를 가설귀납(hypothetical induction)이라 부른다. 관측 사실에서 거꾸로 그럴듯한 가설을 지어내는 추론이다.
- <strong>한계 1 - 너무 친절한 설정</strong>: 기존 데이터셋은 어떤 관찰 문장을 볼지 사람이 직접 골라 주는 닫힌 설정(close-domain)이었다. LLM에게 떠먹여 주는 셈이다.
- <strong>한계 2 - 외운 걸 다시 뱉기</strong>: 정답(ground truth) 가설이 대부분 상식 수준(예: 뉴턴 법칙)이라, LLM이 사전학습 때 이미 본 내용이었다. 새로 지어낸 게 아닐 수 있다.

<strong>새 과제 정의 - TOMATO</strong>

- MOOSE는 이 문제를 <strong>TOMATO</strong>(auTOmated open-doMAin hypoThetical inductiOn) 과제로 다시 정의한다.
- 열린 설정(open-domain)이란, 사람이 관찰 문장을 골라 주지 않고 가공 안 된 웹 코퍼스만 통째로 준다는 뜻이다.

<strong>데이터셋</strong>

- 2023년 1월 이후 상위 사회과학 저널 논문 <strong>50편</strong>으로 TOMATO 벤치마크를 만들었다.
- 7개 분과 - 커뮤니케이션, 심리학, 인사관리(HRM), 정보시스템, 국제경영, 경영, 마케팅.
- 사회과학 박사과정생이 각 논문에서 핵심 가설, 연구 배경, 영감(inspiration, 배경과 가설을 잇는 이론적 다리)을 직접 표시했다.
- <strong>데이터 오염 방지</strong>: 논문 원문을 그대로 베끼지 않고, 웹에서 의미가 비슷한 문장을 찾아 raw 코퍼스로 삼았다. 모델이 정답 문장을 보고 베끼는 일을 피하려는 것이다.
- 새로움(노벨티) 검증용 서베이 논문 14편도 따로 모았다.
- 기본(base) 모델은 GPT-3.5-turbo, 평가는 GPT-4와 전문가 3인이 맡았다.

<strong>파이프라인을 직관적으로 보면</strong>

- 기본 틀(MOOSE-base)은 인간 연구자가 가설을 짜는 순서를 그대로 모듈로 옮긴 것이다. 한 번에 가설을 뱉지 않고 단계를 나눈다.
- <strong>1단계</strong>: 연구 배경을 찾는다(Background Finder).
- <strong>2단계</strong>: 코퍼스의 제목(title)에서만 영감 후보 제목을 빠르게 추린다(Inspiration Title Finder). 본문을 다 뒤지면 계산비용이 폭발하므로 제목으로 1차 거른다.
- <strong>3단계</strong>: 추려진 제목의 본문에서 실제 영감 문장을 뽑는다(Inspiration Finder).
- <strong>4단계</strong>: 배경과 영감을 합쳐 가설을 제안한다(Hypothesis Proposer).

<strong>핵심 가정</strong>

- 좋은 가설은 독립변수와 종속변수를 잇는 새로운 연결을 담아야 한다.
- 영감(inspiration)이 그 연결에 들어갈 한 변수, 또는 둘을 매개하는 역할을 한다는 것이 이 시스템의 핵심 가정이다.

### MOOSE - 세 가지 피드백 기제 (2/3)

- MOOSE의 진짜 기여는 기본 틀 위에 얹는 <strong>세 가지 피드백</strong>이다.
- 강화학습의 보상 구조에서 빌려온 발상이다. "보상을 지금 바로 받는가, 나중에야 받는가"로 나뉜다.

```mermaid
flowchart TD
  subgraph PAST["past-feedback"]
    direction LR
    ITF2["Inspiration Title Finder<br/>(과거 모듈)"]:::blue
  end
  subgraph PRESENT["present-feedback (반복)"]
    direction LR
    HP2["Hypothesis Proposer"]:::green
    CHK["Clarity / Reality /<br/>Novelty Checker"]:::yellow
    HP2 -->|"가설 H"| CHK
    CHK -->|"f_i 피드백"| HP2
  end
  subgraph FUTURE["future-feedback"]
    direction LR
    BF2["Background Finder<br/>+ reason"]:::blue
    HSUG["Hypothesis Suggestor<br/>(M-0.5, 초안 제시)"]:::green
  end
  FUTURE --> PAST --> PRESENT
  CHK -.->|"가설 결과로 영감 재평가"| ITF2
  classDef blue fill:#bbdefb,stroke:#0d47a1,color:#000;
  classDef green fill:#c8e6c9,stroke:#2e7d32,color:#000;
  classDef yellow fill:#fff9c4,stroke:#f57f17,color:#000;
```

<strong>현재 피드백(present-feedback)</strong>

- 모듈이 출력 $o_i$를 내면 그 자리에서 바로 평가해 피드백 $f_i$를 준다. $o_i$와 $f_i$를 다시 입력으로 넣어 출력을 다시 만든다. 즉석에서 평가하고 고치는 방식이다.
- 가설 제안 모듈(Hypothesis Proposer)에 적용한다.
- 평가 기준은 가설귀납의 철학적 정의(Norton 2003)에서 재구성했다 - reality(현실 반영), novelty(새로움), clarity(명확성).
- 그래서 Reality / Novelty / Clarity Checker 세 모듈이 붙는다.

<strong>과거 피드백(past-feedback)</strong>

- 어떤 모듈의 출력은 그 자체만 보고는 잘했는지 판단하기 어렵다. 그 출력이 낳은 뒤 단계 결과를 봐야 평가가 된다.
- 예컨대 영감 선택이 좋았는지는, 그 영감이 결국 어떤 가설을 낳았는지 본 뒤에야 알 수 있다.
- 그래서 뒤 단계의 피드백을 앞쪽 과거 모듈(Inspiration Title Finder)로 되돌려 보낸다.

<strong>미래 피드백(future-feedback)</strong>

- 지금 단계의 모듈이 자기 출력에 대한 근거(reason/justification)를 함께 만들어 둔다. 다음 단계 모듈이 그걸 받아 더 쉽게 일한다.
- FF1은 Background Finder와 Inspiration Title Finder가 결과와 함께 그 이유도 같이 만들게 한다.
- FF2는 부담이 큰 Hypothesis Proposer 앞에 Hypothesis Suggestor를 둬서, 무거운 추론을 둘로 나눠 진다.

<strong>생성도 LLM, 평가도 LLM</strong>

- 세 피드백 모두 LLM(또는 전문가)이 평가자 역할을 맡는다. 만드는 쪽과 채점하는 쪽이 같은 LLM인 구조다.
- 흥미롭게도 과거 피드백의 영감 평가(Inspiration Feedback)는 ChatGPT가 충분히 잘 못 해서, 사람이 만든 경험 규칙(휴리스틱)으로 대체했다 - "영감 제목이 배경과 덜 관련될수록 더 새로운 가설이 나올 수 있다"는 규칙이다(부록 A.10).
- 즉 핵심 평가 한 곳에서 자동화가 막혔고, 거기에 사람이 들어가야 했다.

### MOOSE - 평가, 발견, 함의 (3/3)

<strong>무엇으로 평가했나</strong>

- validness(현실 반영, 5점 척도), novelty(기존 문헌에 없는가), helpfulness(연구자에게 도움이 되는가).
- BLEU / ROUGE 같은 표면 일치 지표(정답 문장과 단어가 얼마나 겹치는지만 보는 지표)는 정답이 하나로 정해지지 않는 열린(open-ended) 과제에 안 맞아서 일부러 쓰지 않았다.
- TOMATO의 목표는 연구자에게 영감을 주는 것이므로, novelty와 helpfulness를 validness보다 더 중요하게 본다.

<strong>핵심 발견</strong>

- <strong>baseline 대비</strong>: MOOSE-base는 단순 비교군(코퍼스 조각을 넣고 곧바로 가설을 뽑는 방식)보다 novelty와 helpfulness에서 크게 앞선다. baseline 가설은 코퍼스 문장을 거의 그대로 바꿔 쓴 수준이라 새로움이 없었다.
- <strong>피드백 효과</strong>: 세 피드백을 더할수록 점진적으로 좋아진다. 현재 피드백은 반복 3-4회까지 validness와 novelty가 꾸준히 오른다.
- <strong>GPT-4 평가 신뢰도</strong>: GPT-4 평가와 전문가 평가의 <strong>느슨한 일치도(soft consistency)가 0.77 이상</strong>이다(부록 A.8). soft consistency는 둘의 순위나 방향이 대체로 맞느냐를 보는 지표다.
  - 이걸 근거로, GPT-4가 기계 생성 가설을 어느 정도 믿을 만하게 평가할 수 있다고 주장한다.
  - 다만 정확히 같은 점수를 매겼는지 보는 엄격한 일치도(hard consistency)는 0.3-0.5로 낮다.
- <strong>모델 교체</strong>: 기본 모델을 Claude3-Opus로 바꿔도 효과가 유지되고 절대 점수가 올라간다. 더 강한 모델일수록 잠재력이 크다는 뜻이다.

<strong>한계와 의의</strong>

- <strong>트레이드오프</strong>: 저자도 인정하듯, "흥미롭고 직관에 반하는(counter-intuitive) 가설은 오히려 validness 점수가 낮게 나오는 경향"이 있다(부록 A.13). 즉 새로움과 타당성 사이에 맞교환이 있다.
- <strong>식별(identification) 관점</strong>: MOOSE가 내놓는 것은 "X가 Y에 영향을 준다"는 <strong>가설 진술</strong>일 뿐이다. 그 가설이 왜 인과적으로 옳은지에 대한 논증은 아니다.
- 변수 사이의 새 연결을 제안하는 일(추정(estimation)할 후보를 늘리는 일)은 자동화한다. 그러나 그 연결이 진짜 인과인지 아니면 교란(혼동) 때문인지를 가려내는 식별 전략은 전혀 다루지 않는다.
- <strong>재귀 문제</strong>: novelty와 validness의 정답 기준이 GPT-4 자신이다. 만드는 쪽도 채점하는 쪽도 같은 분포에서 나온 셈이라, 검증이 자기 자신에게 되돌아가는 재귀의 전형이다.

### causal-graph (LLMCG) - 논문에서 인과 그래프로

arXiv 2402.14424. Tong, Mao, Huang, Zhao, Peng (Tsinghua). Humanities & Social Sciences Communications 게재.

<strong>이 논문이 묻는 것</strong>

- 대규모 심리학 문헌에서 인과 관계를 뽑아 인과 지식 그래프(개념을 점, 인과관계를 화살표로 그린 큰 연결망)를 만들 수 있는가.
- 그 그래프에서 아직 연결되지 않은 점들을 이어 새 심리학 가설을 만들 수 있는가. 빈 연결을 예측하는 작업을 링크 예측(link prediction)이라 한다.
- LLM의 의미·개념 추출 능력과, 인과 그래프의 체계적 사고를 결합하자는 발상이다(LLMCG, LLM-based Causal Graph algorithm).

```mermaid
flowchart LR
  P["심리학 논문<br/><b>43,312</b>편<br/>(PMC)"]:::blue
  EX["GPT-4 인과쌍 추출<br/>(causality/correlation,<br/>+/-)"]:::green
  G["Neo4j 인과 그래프<br/>19.7만 개념<br/>23.5만 연결"]:::blue
  LP["Link Prediction<br/>node2vec + Jaccard"]:::yellow
  H["GPT-4 가설 생성<br/>(미연결 개념쌍 연결)<br/>well-being 130개"]:::green
  EVAL["평가: 전문가 + LLM-only +<br/>BERT t-SNE 의미분석"]:::red
  P --> EX --> G --> LP --> H --> EVAL
  classDef blue fill:#bbdefb,stroke:#0d47a1,color:#000;
  classDef green fill:#c8e6c9,stroke:#2e7d32,color:#000;
  classDef yellow fill:#fff9c4,stroke:#f57f17,color:#000;
  classDef red fill:#ffcdd2,stroke:#c62828,color:#000;
```

<strong>데이터</strong>

- PMC(공개 의학·생명과학 논문 저장소) 무료 공개분에서 "Psychol" 같은 키워드로 걸러 낸 심리학·신경과학 논문 약 14만 편 중, 최종적으로 <strong>43,312편</strong>을 분석했다.
- Frontiers in Psychology(3.5만), BMC Psychology 등이 포함된다.

<strong>방법 세 단계</strong>

1. <strong>문헌 수집(Literature retrieval)</strong>: PMC에서 논문 본문(제목+초록+본문)을 가져온다. 단 참고문헌 섹션은 정규식으로 잘라낸다.
2. <strong>인과쌍 추출(Causal pair extraction)</strong>:
   - GPT-4에 4000토큰 단위로 본문을 잘라 넣고, 텍스트에 직접 서술된 인과·상관 관계만 JSON으로 뽑게 한다. 그 논문이 다른 연구를 인용하며 언급한 관계는 제외한다.
   - 각 쌍에는 개념쌍(원인, 결과), 관계 종류(인과 causality / 상관 correlation), 방향(양positive / 음negative)을 붙인다.
   - 추출 검증 결과, GPT-4가 분류한 289개 관계 중 87.54%가 검증을 통과했다. 인과로 분류한 것 중 13%만 사실 관계가 없다고 판정되어, 인과와 상관을 가르는 데 쓸 만하다고 본다.
   - 결과 그래프는 Neo4j(그래프 전용 DB)에 저장했고, 개념 19.7만 개와 연결 23.5만 개가 모였다.
3. <strong>가설 생성 = 링크 예측</strong>:
   - 개념을 node2vec로 임베딩한다(연결망 위 위치를 벡터 좌표로 바꾸는 방법으로, 이웃이 비슷한 점은 좌표도 가까워진다).
   - 두 점의 이웃이 얼마나 겹치는지를 자카드(Jaccard) 유사도로 재서, 아직 연결 안 된 쌍이 앞으로 이어질 가능성을 점수화한다.
   - 점수가 높은 쌍을 골라 GPT-4에게 그 둘을 잇는 새 인과 가설을 쓰게 한다. "행복(well-being)"에 초점을 둔 가설 130개를 만들었다.

<strong>평가 설계</strong>

네 집단을 비교한다.

- (a) Random-selected LLMCG: 시스템이 만든 가설 중 무작위로 뽑은 30개.
- (b) Expert-selected LLMCG: 긍정심리학 박사후연구원 2인이 골라낸 30개.
- (c) Control-Human: Tsinghua 긍정심리 박사과정생 16인이 직접 만든 가설.
- (d) Control-Claude: Claude-2 혼자 만든 가설.

평가 방식:

- 심리학 교수 3인이 출처를 모른 채(블라인드) 순서를 섞어 novelty와 usefulness를 평가했다.
- 더해서 BERT 임베딩과 t-SNE(고차원 벡터를 2차원에 펼쳐 보여 주는 시각화)로 가설들 사이 의미 거리도 분석했다.

<strong>핵심 발견</strong>

- <strong>novelty</strong>: LLMCG 집단이 Control-Claude를 뚜렷이 앞선다(Random vs Claude: t(59)=3.34, p=0.007). 그리고 <strong>박사과정생(Control-Human) 수준에 맞먹는다</strong>.
- <strong>usefulness</strong>: 집단 간 유의한 차이가 없다(F=5.25, p=0.553). 인과 그래프를 쓰면 새로움은 끌어올리지만, 유용성은 어느 집단이나 비슷하다.
- <strong>ablation</strong>: GPT-4 단독과 LLMCG를 떼어 비교한 실험에서도 LLMCG가 novelty에서 앞선다(효과크기 Cohen's d=1.2 수준). usefulness는 역시 차이가 없다.
- <strong>t-SNE</strong>: Control-Human은 의미 공간에서 유독 멀찍이 떨어져 있고(고유한 학문 배경이 반영된 것), LLMCG는 더 넓게 흩어져 있다.

<strong>한계와 의의</strong>

- 저자도 인정하듯, 인과쌍 추출의 13%가 전문가 판단과 어긋난다.
- 더 근본적으로, <strong>여기서 "인과"란 논문 저자가 텍스트에 "인과"라고 적어 놨다는 뜻</strong>일 뿐이다. 데이터로 식별된 인과효과가 아니다.
- 그래프의 화살표는 "문헌이 인과라고 주장한 것"을 모아 놓은 집계다. 링크 예측이 새로 만드는 화살표는 "기존 인과 주장들과 연결망상 위치가 가까운, 아직 안 이어진 쌍"일 뿐이다.
- 이건 추정 후보(어떤 X-Y를 들여다볼지)를 늘리는 데는 강력하지만, 식별과는 무관하다.
- 그래프 이름이 "인과 그래프"여도, 그 안의 화살표는 데이터로 식별한 게 아니라 텍스트에서 긁어모은 주장이다.

### HypoGeniC - 데이터 기반 가설 은행과 UCB 보상

arXiv 2404.04326. Zhou, Liu, Srivastava, Mei, Tan (UChicago, TTIC).

<strong>이 논문이 묻는 것</strong>

- 라벨이 붙은 예시 데이터(관측 데이터, observed data)에서 출발해, LLM이 분류 성능을 끌어올리는 고품질 가설을 반복해서 만들고 갱신할 수 있는가.

<strong>앞 두 논문과의 차이</strong>

- MOOSE와 LLMCG가 문헌에서 출발했다면, HypoGeniC은 <strong>데이터에서 출발</strong>한다.
- 입력-출력 쌍 $\{(x_i, y_i)\}$가 주어졌을 때, $x$와 $y$의 관계를 설명하는 가설 묶음 $\mathcal{H}=\{h_1,...,h_m\}$을 학습한다.

```mermaid
flowchart TD
  INIT["초기 예시로<br/>가설 은행 H 생성"]:::green
  TOP["각 훈련예시마다<br/>top-k 고보상 가설 선택"]:::blue
  INF["가설로 예측<br/>(hypothesis-based inference)"]:::blue
  REW["보상 갱신<br/>r_i = 정확도 +<br/>alpha*sqrt(log t / |S_i|)"]:::yellow
  WRONG{"틀린 가설 수<br/>>= w_hyp?"}:::red
  BANK["wrong example bank<br/>(지식 공백 포착)"]:::red
  GEN["공백에서<br/>새 가설 생성"]:::green
  H2["가설 은행 H 갱신"]:::green
  INIT --> TOP --> INF --> REW --> WRONG
  WRONG -->|"예: 예시 추가"| BANK
  BANK -->|"가득 차면"| GEN --> H2 --> TOP
  WRONG -->|"아니오"| TOP
  classDef blue fill:#bbdefb,stroke:#0d47a1,color:#000;
  classDef green fill:#c8e6c9,stroke:#2e7d32,color:#000;
  classDef yellow fill:#fff9c4,stroke:#f57f17,color:#000;
  classDef red fill:#ffcdd2,stroke:#c62828,color:#000;
```

<strong>데이터와 과제</strong>

합성 데이터 1개에 실세계 데이터 3개를 쓴다.

- (1) <strong>Shoe sales</strong>: 합성 데이터로, 참 가설이 딱 하나 존재한다 - 손님은 자기 셔츠 색과 맞는 신발을 산다.
- (2) <strong>Deceptive reviews</strong>: 가짜 호텔 리뷰를 가려내기.
- (3) <strong>Headline popularity</strong>: Upworthy 헤드라인 15만 개 중 어느 쪽이 클릭을 더 많이 받는지.
- (4) <strong>Tweet popularity</strong>: 어느 트윗이 리트윗을 더 많이 받는지.

모델은 Mixtral, GPT-3.5-turbo, Claude-2.1을 쓰고, 비교 기준(오라클)으로는 미세조정(fine-tuned)한 RoBERTa와 Llama-2-7B를 둔다.

<strong>알고리즘의 핵심</strong>

- 여러 선택지 중 어디를 더 시도할지 고르는 문제를 다중 슬롯머신(multi-armed bandit)이라 한다.
- HypoGeniC은 그중 <strong>UCB</strong>(upper confidence bound) 방식을 가설 갱신에 옮겼다.
- UCB는 여러 후보 가운데 어디를 더 탐색할지를 "지금까지의 평균 성과 + 불확실성"을 함께 보고 고르는 점수다.
- 여기서 각 가설을 슬롯머신의 "팔(arm)", 각 훈련 예시를 그 팔을 "당기는 것(pull)"으로 본다.

<strong>보상 구조</strong>

- 보상은 $r_i = \frac{\sum I(y_j=\hat y_j)}{|\mathcal{S}_i|} + \alpha\sqrt{\frac{\log t}{|\mathcal{S}_i|}}$ 로 준다.
- <strong>앞항(활용)</strong>: 그 가설의 정확도다. 잘 맞히는 가설을 계속 쓰는 활용(exploitation)에 해당한다.
- <strong>뒷항(탐색)</strong>: 아직 덜 써 본 가설일수록 점수를 더 얹는다. 새 후보를 시도해 보는 탐색(exploration)에 해당한다.
- 이 두 항을 합친 UCB식 탐색-활용 균형으로 가설 은행을 굴린다.
- <strong>wrong example bank</strong>: 지금 가설들이 못 맞히는 예시를 모아 둔 통이다. "현재 가설 풀이 모르는 빈틈"을 나타내며, 이 통이 가득 차면 그 빈틈을 메우는 새 가설을 생성한다.
- <strong>추론 전략</strong>: 정확도가 가장 높은 가설 하나만 쓰기, 골라서 가중 투표하기(filter-and-weighted-vote), 한 단계 또는 두 단계로 상황에 맞춰 추론하기(single/two-step adaptive inference) 등.

<strong>핵심 발견</strong>

- <strong>정확도 향상</strong>: HypoGeniC 가설로 추론하면 무학습(zero-shot)이나 예시 몇 개만 준 경우(few-shot) 대비 정확도가 오른다 - Shoe 31.7%p, Deceptive 13.9%p, Headline 3.3%p, Tweet 24.9%p. 일부 데이터셋에서는 미세조정한 RoBERTa / Llama-2-7B 오라클까지 넘어선다.
- <strong>모델 간 일반화</strong>: 가설이 모델 사이를 넘어 일반화된다. GPT-3.5가 만든 가설을 Mixtral이나 Claude가 써도 성능이 유지된다. 훈련 때 못 본 분포의 가짜 리뷰(OOD deceptive reviews)에서도 견고하다.
- <strong>새 통찰</strong>: 만들어진 가설이 기존 문헌을 다시 확인해 주면서 새 통찰도 준다. 예를 들어 "생일·기념일 같은 특별한 날을 언급하는 리뷰가 더 진실되다"는 새 가설이 나왔다. 또 Ott et al.(2011)의 "미래 시제(future)가 가짜 리뷰와 연관된다"는 결과를 반박하는 가설도 나왔다.

<strong>한계와 의의</strong>

- <strong>저자가 밝힌 한계</strong>: LLM의 추론이 완벽하지 않아서, 가설로 예측하는 단계(hypothesis-based inference)가 가설의 실제 품질을 그대로 반영하지 못할 수 있다. 또 데이터에 박힌 고정관념이나 편향을 가설이 그대로 확증해 버릴 위험이 있어, 사람과 AI가 함께 보는 협업을 권한다.
- <strong>식별 관점</strong>: HypoGeniC의 "가설"은 분류를 더 잘하게 해 주는 <strong>예측 패턴</strong>이다. "이런 특징이 있으면 y일 가능성이 높다"는 상관 규칙이지, 인과 주장이 아니다.
- 보상 함수가 정확도이므로, 이 시스템은 대놓고 <strong>예측력만 최적화</strong>한다.
- 데이터의 편향을 확증한다는 저자 자신의 경고가, 곧 식별이 빠져 있다는 증상이다.

### Automated Social Science - SCM을 청사진으로 한 완전 자동화 (1/2)

arXiv 2404.11794. Manning, Zhu, Horton (MIT, Harvard, MIT&NBER).

<strong>이 논문이 묻는 것</strong>

- 가설 생성과 그 가설을 컴퓨터 안에서(in silico) 검증하는 일을, LLM 하나로 모두 자동화할 수 있는가.
- 그리고 시뮬레이션이, LLM에게 직접 물어서는 안 나오는 정보를 끌어낼 수 있는가.
- 이 묶음 여섯 편 중 자동화를 가장 끝까지 밀어붙인 시스템이다.

<strong>핵심 혁신 - SCM을 청사진으로 쓴다</strong>

- <strong>구조적 인과모형(SCM, Structural Causal Model)</strong>은 변수들 사이 인과관계를 화살표로 적어 둔 설계도다. 이 논문은 SCM을 연구 과정 전체의 청사진으로 쓴다.

```mermaid
flowchart TD
  S["1. 사회 시나리오 입력<br/>('머그컵 흥정' 한 줄)"]:::blue
  HG["2. 가설 생성<br/>SCM 구축<br/>(종속변수 + 원인 후보)"]:::green
  AB["3. 에이전트 구축<br/>SCM 외생차원으로<br/>속성 부여"]:::green
  DI["4. 상호작용 설계<br/>발화 순서 결정"]:::yellow
  ER["5. 실험 실행<br/>조건별 병렬<br/>LLM 에이전트 대화"]:::yellow
  DC["6. 데이터 수집<br/>에이전트에 설문<br/>('거래 성사됐나?')"]:::blue
  ME["7. 모형 추정<br/>선형 SCM 적합<br/>(path estimate)"]:::red
  S --> HG --> AB --> DI --> ER --> DC --> ME
  ME -.->|"새 인과변수로<br/>후속 실험"| HG
  classDef blue fill:#bbdefb,stroke:#0d47a1,color:#000;
  classDef green fill:#c8e6c9,stroke:#2e7d32,color:#000;
  classDef yellow fill:#fff9c4,stroke:#f57f17,color:#000;
  classDef red fill:#ffcdd2,stroke:#c62828,color:#000;
```

- <strong>SCM 하나가 네 가지를 동시에 준다</strong> - (1) 가설을 적는 언어, (2) LLM 에이전트를 어떻게 만들지의 설계도, (3) 실험을 어떻게 짤지, (4) 분석을 어떻게 할지의 계획(사전등록 비슷한 것).
- 각 설명변수는 "사람이나 상황의 어떤 차원을 바꿔야 효과가 식별되는가"를 못박아 준다. 그래서 시스템은 무엇을 바깥에서 인위적으로(외생적으로) 조작해야 하는지를 "안다".
- 이것이 자동화를 가능케 하는 비결이다. SCM이 없으면 다음 단계에서 고를 선택지가 끝없이 폭발한다.

<strong>시스템 7단계</strong> (모두 GPT-4와 Python으로 돌고, 매 단계 사람이 끼어들어 고칠 수 있다)

<strong>네 가지 시나리오</strong>

- (1) <strong>머그컵 흥정</strong>:
  - "두 사람이 머그컵을 흥정한다"는 한 줄만 넣으면, 시스템이 알아서 구매자(Buyer)와 판매자(Seller)를 뽑는다.
  - 종속변수(거래 성사 여부, 0/1)와 원인 후보(구매자 예산, 판매자 최저가, 판매자가 컵에 갖는 애착)를 만들고 조작한다. 9x9x5=405회 시뮬레이션.
  - 결과 - 예산이 1달러 늘면 성사확률이 3.7%p 올라가고(추정계수 $\hat\beta^*$=0.51), 최저가와 애착은 음(-)의 효과이며, 세 변수 모두 유의했다.
- (2) <strong>탈세 보석심리</strong>: 판사·피고·변호사·검사가 등장한다. 전과가 있으면 보석금이 올라가고(유의), 판사가 그날 처리한 사건 수는 효과가 없었다.
- (3) <strong>변호사 채용 면접</strong>: 변호사시험 합격만이 유일하게 유의했고(채용확률 75%p 상승), 키나 면접관의 친절함은 효과가 없었다.
- (4) <strong>미술품 경매</strong>: 입찰자 3인의 예산이 모두 낙찰가에 정(+)의 방향으로 유의하게 작용했고, 낙찰가는 늘 2등 입찰자의 평가액(valuation) 근처에 형성됐다. 경매이론(Maskin & Riley 1985)과 정확히 들어맞는다.

<strong>가장 중요한 점</strong>

- 이 결과들은 LLM에게 직접 물어서 나온 게 아니라, <strong>실험(경험적 관측, empiricism)</strong>으로 나왔다.
- 직관에 반할 정도로 놀랍지는 않지만, 모델이 자기 안을 들여다본 내성(introspection)이 아니라 실제로 돌려 본 실증의 산물이라는 점이 핵심이다.

### Automated Social Science - 시뮬은 왜 필요한가, 그리고 식별 논변 (2/2)

<strong>4절 - 시뮬레이션이 정말 필요한가</strong>

LLM에게 그냥 "머릿속 사고실험(thought experiment)으로 결과를 예측해 봐"라고 시키면 안 되나. 세 가지 과제로 확인했다.

- <strong>predict-$y_i$</strong> (SCM 없이 결과를 바로 예측): 경매 청산가 예측이 형편없다. MSE=8628이다. MSE는 예측이 정답에서 얼마나 빗나갔는지를 제곱해 평균한 오차로, 작을수록 좋다. 이건 경매이론으로 푼 값(MSE=128)보다 자릿수 단위로 나쁘고, 실제 실험으로 얻은 값보다도 더 멀다.
- <strong>predict-$\hat\beta$</strong> (경로계수를 바로 예측): 평균적으로 실제값보다 13.2배 크게 과대추정했다. 12개 경로 중 10개를 과대추정했고, 부호(방향)는 10/12를 맞혔다.
- <strong>predict-$y_i \mid \hat\beta_{-i}$</strong> (이미 적합한 SCM을 쥐여 주고 결과를 예측): MSE=1505로, 6배나 좋아진다. <strong>적합된 SCM을 조건으로 깔아 주면 예측이 극적으로 좋아진다.</strong>

저자가 한 줄로 요약한다 - <strong>"LLM은 자기가 (당장) 말할 수 있는 것보다 더 많이 알고 있다(the LLM knows more than it can immediately tell)"</strong>. LLM 안에는 인간 행동에 관한 잠재 정보가 있지만, 직접 물어보는(elicitation) 것만으로는 못 꺼낸다. SCM에 기반한 실험이 그걸 끄집어낸다.

<strong>5절 - 왜 SCM인가, 식별을 미리(ex-ante) 보장한다</strong>

이 수업에서 가장 중요한 식별 논변이다. 두 대안과 비교한다.

<strong>대안 1 - 데이터에서 인과구조를 가정(assume)하기</strong>

```mermaid
flowchart LR
  subgraph TRUE["올바른 SCM (랜덤화 실험)"]
    BB["Buyer Budget"]:::green --> CL["Convo Length"]:::green
    SM["Seller Min"]:::green --> CL
    SL["Seller Love"]:::blue --> CL
  end
  subgraph BAD["오설정 SCM (bad control)"]
    BB2["Buyer Budget<br/>(p=0.189 비유의)"]:::red --> CL2["Convo Length"]:::red
    SM2["Seller Min<br/>(p=0.755 비유의)"]:::red --> CL2
    DO["Deal Occurs<br/>(나쁜 통제!)"]:::red --> CL2
  end
  TRUE -->|"거래성사를 통제하면<br/>효과가 0으로 죽는다"| BAD
  classDef blue fill:#bbdefb,stroke:#0d47a1,color:#000;
  classDef green fill:#c8e6c9,stroke:#2e7d32,color:#000;
  classDef red fill:#ffcdd2,stroke:#c62828,color:#000;
```

- <strong>참 구조</strong>: 흥정 데이터에서 "대화 길이"를 종속변수로 둬 보자. 랜덤화 실험에서는 예산과 최저가가 대화 길이에 유의한 영향을 준다(p<0.001, p=0.026).
- <strong>오설정</strong>: "거래 성사 여부"를 통제변수로 잘못 끼워 넣으면(잘못 설정된 SCM, misspecified SCM), 예산과 최저가의 효과가 비유의(p=0.189, 0.755)로 0 가까이 죽어 버린다.
- <strong>왜 죽나</strong>: 거래 성사가 <strong>나쁜 통제(bad control)</strong>이기 때문이다. bad control은 넣으면 오히려 인과효과를 왜곡하는 통제변수다. 여기서는 거래 성사가 대화 길이와 함께 결정되는 변수라, 통제하면 안 되는 걸 통제하는 셈이 된다.
- <strong>저자 각주</strong>: "정통 계량경제학자라면 이런 실수를 안 한다고 하겠지만, 많은 연구자는 그렇지 못하다. 우리조차도 랜덤화 실험에서 나온 비편향 추정치를 기준으로 손에 쥐기 전에는 확신하지 못했다. LLM은 아직 이 실수를 피할 만큼 똑똑하지 않다."

<strong>대안 2 - 데이터에서 인과구조를 탐색(search)하기</strong>

- GES(Greedy Equivalence Search)는 데이터에서 인과그래프의 화살표 방향을 탐욕적으로 찾아 나가는 알고리즘이다.
- 이걸 탈세 데이터에 돌리면, 전과와 보석금 사이에 관계가 있다는 건 찾지만 <strong>화살표 방향은 못 정한다</strong>(양쪽 방향이 통계적으로 똑같이 그럴듯하기 때문).
- 실험에서는 우리가 전과 -> 보석금임을 알지만, 관측 데이터만 놓고 탐색하면 보석금 -> 전과와 구분하지 못한다.
- 게다가 GES는 돌릴 때마다 결과가 달라진다.

저자의 결론 - SCM 기반 접근은 데이터를 <strong>인과구조에 근거해서 생성</strong>하므로 식별이 미리 보장된다. 바깥에서 변동을 명시적으로 주입하니, bad control 문제도 search 문제도 생기지 않는다.

<strong>이 수업의 핵심 비판과의 연결</strong>

- 이 논문은 역설적이게도 우리 비판을 가르치는 데 가장 좋은 교재다. 저자들의 메시지는 "LLM 자동화가 식별을 해 주는 게 아니라, <strong>인간이 설계한 SCM이 식별을 해 준다</strong>"는 것이다.
- LLM은 SCM이라는 식별 틀 안에서 추정(estimation, 에이전트 시뮬레이션으로 데이터를 만들고 계수를 추정하는 일)만 자동화할 뿐이다.
- SCM 없이 LLM에게 인과를 통째로 맡기면(데이터에서 가정하거나 탐색하면) 곧장 bad control과 방향 미결정에 빠진다.
- <strong>실리콘 표집 문제</strong>: 동시에 이 시스템은 실리콘 표집(silicon sampling) 위에 서 있다. 피험자가 사람이 아니라 LLM 에이전트라는 뜻이다.
  - 가설도 LLM, 피험자도 LLM이라면, "거래는 예산에 달렸다"는 발견이 인간 세계의 인과인지, 아니면 GPT-4가 흥정 텍스트에서 학습한 통계적 규칙성을 그대로 재현한 것인지 알 수 없다.
- 식별은 SCM이 보장하지만, 식별된 그 효과가 <strong>인간에 관한 것인지</strong>는 시뮬레이션에서 실세계로 건너뛰는 도약(저자도 "근본적 도약, fundamental jump"이라 부른다)을 넘어야만 답할 수 있다. 그리고 그 도약은 자동화 바깥에 있다.

### HLER - 인간 결정 게이트가 남은 경제학 파이프라인

arXiv 2603.07444. Chen Zhu, Xiaolu Wang (China Agricultural University). 2026년 봄 공개.

<strong>이 논문이 묻는 것</strong>

- 경제학 실증연구의 작업 흐름(데이터 점검 -> 가설 -> 계량분석 -> 논문 작성 -> 심사)을 여러 에이전트로 자동화하되, 핵심 판단은 사람에게 남기는 설계(human-in-the-loop, 사람을 회로 안에 끼워 넣는 방식)가 가능한가.
- Automated Social Science가 완전 자동을 지향했다면, HLER은 일부러 사람을 끼워 넣는다.

```mermaid
flowchart TD
  PI["Human PI<br/>게이트1: 연구질문 선택<br/>게이트2: 출판 결정"]:::red
  ORC["Orchestrator<br/>(RunState 소유, 작업 분배)"]:::yellow
  DA["Data Audit Agent<br/>변수 인벤토리"]:::blue
  DP["Data Profiling Agent<br/>통계·결측·내생성 진단"]:::blue
  Q["Question Agent<br/>데이터인지 가설 생성"]:::green
  DG["Data Agent<br/>(World Bank, FRED)"]:::blue
  EC["Econometrics Agent<br/>OLS/FE/DiD/event-study"]:::green
  PA["Paper Agent<br/>논문 초안 (draft_v1,v2)"]:::green
  RV["Reviewer Agent<br/>1-10점 심사"]:::yellow
  PI --> ORC
  ORC --> DA --> DP --> Q --> DG --> EC --> PA --> RV
  Q -.->|"question quality loop<br/>재생성"| DA
  RV -.->|"research revision loop<br/>재분석·재작성"| EC
  RV --> PI
  classDef blue fill:#bbdefb,stroke:#0d47a1,color:#000;
  classDef green fill:#c8e6c9,stroke:#2e7d32,color:#000;
  classDef yellow fill:#fff9c4,stroke:#f57f17,color:#000;
  classDef red fill:#ffcdd2,stroke:#c62828,color:#000;
```

<strong>설계의 핵심 두 가지</strong>

- <strong>데이터 인지 가설 생성(dataset-aware hypothesis generation)</strong>: 가설을 아무 제약 없이 마구 떠올리는 게 아니라, 데이터셋의 구조·변수 가용성·결측·분포 진단에 <strong>맞춰서(조건부로)</strong> 만든다. 데이터에 없는 변수를 요구하는 실행 불가능한 가설(없는 걸 지어내는 hallucinated hypothesis)을 막는다.
- <strong>두 개의 순환 구조(two-loop)</strong>:
  - (1) 질문 품질 순환(question quality loop) - 후보 가설을 만들고, 실행 가능한지 걸러내고, 사람이 고른다.
  - (2) 연구 수정 순환(research revision loop) - 자동 심사 결과가 재분석과 논문 수정을 끌어낸다.

7개의 전문 에이전트가 지휘자(orchestrator) 아래에서 순서대로 돈다. 모델은 Claude Sonnet 4.6을 쓰지만, 특정 모델에 매이지 않는 설계다(모델 불가지론적).

<strong>무엇으로 평가했나</strong>

- 실증 데이터셋 3개를 썼다 - China Health and Nutrition Survey(285변수, 5.7만 관측), CMGPD-Liaoning, UK Biobank.
- 파이프라인을 총 14회 돌렸다.

<strong>핵심 발견</strong>

- <strong>실행 가능 비율</strong>: 데이터 인지 방식이 실행 가능한 가설 비율을 41%에서 87%로 끌어올렸다. 제약 없이 생성할 때의 주된 실패 원인은 "데이터에 없는 변수를 요구"(42%)와 "데이터 구조와 안 맞는 설계"(35%)였다.
- <strong>완주율</strong>: 14회 중 12회(86%)가 사람 개입 없이 처음부터 끝까지(end-to-end) 완주했다.
- <strong>수정 순환 효과</strong>: reviewer 점수를 4.8에서 6.3으로 끌어올렸다(평균 2-3회 반복). 가장 크게 오른 항목은 명확성(clarity, +2.1)과 <strong>식별 신뢰성(identification credibility, +1.4)</strong>이다. 새로움(novelty)은 거의 안 변했다(+0.3). 즉 이 순환은 연구의 기여 자체가 아니라 서술과 견고함을 다듬는다.
- <strong>비용</strong>: API 비용은 회당 0.8-1.5달러다(AI Scientist의 6-15달러보다 싸다). 통계 계산은 statsmodels 같은 프로그램에 맡기고, LLM에는 추론과 작성만 시키기 때문이다.
- <strong>사례연구</strong>: 중국 농촌 여성 노동을 다뤘다 - "고등교육이 농촌 여성의 직업 성별격차를 줄이는가?" 고정효과(fixed-effects) 모형을 썼는데, reviewer가 역인과(reverse causality)와 식별 신뢰성 우려를 지적하자 사건연구(event-study)와 민감도 분석을 덧붙였다.

<strong>한계와 의의</strong>

저자가 직접 밝힌 한계가 있다.

- (1) <strong>다중검정(multiple testing) 문제를 못 푼다</strong>: 한 데이터셋에서 수십 개 가설을 찍어 내고 유의하게 나온 것만 보고하면, 자동화된 p-해킹(통계적으로 유의해 보일 때까지 골라 보고하는 것)이 된다. 질문 선택 게이트가 생성된 모든 가설을 기록으로 남겨 사전등록 비슷한 투명성을 주지만, 근본 해결은 아니다.
- (2) 지금은 IV(도구변수)·RDD(회귀불연속)·구조모형을 지원하지 않는다. 즉 <strong>식별 전략이 필요한 설계는 아직 못 한다</strong>.
- (3) Reviewer가 논문을 쓴 것과 같은 LLM이라, 평가에 순환성이 있다.

<strong>이 수업 관점</strong>

- HLER의 식별 신뢰성(identification credibility) 점수는 결국 reviewer 역할 LLM이 매긴 채점일 뿐이다. 시스템이 자동화하는 것은 OLS/FE/DiD의 <strong>실행(추정, estimation)</strong>이지, 그 설계가 왜 인과를 식별하는지에 대한 논증이 아니다.
- 그래서 IV/RDD를 "앞으로 할 일(future work)"로 미뤘다는 사실 자체가, 식별의 핵심부는 자동화가 안 된다는 것을 저자가 인정한 셈이다.
- 그나마 사람 게이트를 둔 것은, 이 한계에 대한 가장 정직한 대응이다.

### The Third Ambition - LLM을 관측 도구로 보는 메타 논변

arXiv 2603.07329. W. Russell Neuman, Chad Coleman (NYU). 2026.

<strong>이 논문이 묻는 것</strong> (서술적 논의)

- AI 연구의 세 번째 야망, 즉 LLM을 인간의 행동·문화·도덕추론을 연구하는 과학적 도구로 쓰자는 입장을 어떻게 정당하게 세울 것인가.
- 그리고 그 입장의 인식론적 한계를 어디에 그을 것인가.
- 앞의 다섯 편을 하나로 묶는 이론 틀이다.

<strong>세 가지 야망</strong>

- (1) <strong>생산성(productivity)</strong>: AI를 일을 빨리하는 도구로 본다.
- (2) <strong>정렬(alignment)</strong>: AI를 안전하게 인간 가치에 맞추는 대상으로 본다.
- (3) <strong>세 번째 야망(third ambition)</strong>: LLM을 인간 상징행동을 들여다보는 과학적 관측 도구로 본다.

<strong>관측 인프라로서의 LLM</strong>

- 수십조 토큰의 인간 텍스트로 학습한 LLM은, 사람들이 어떻게 논증하고 정당화하고 이야기를 짜고 규범을 협상하는지에 대한 대규모 규칙성을 담은 <strong>응축물(condensate)</strong>이다. 응축물이란 그 규칙성을 압축해 담은 생성적 표상을 말한다.
- 저자는 LLM을 인간 피험자의 대체물이나 인과를 설명해 주는 장치로 보지 않는다. 대신 <strong>유전체학이나 천문학의 거대 데이터셋에 비유되는 관측 인프라</strong>로 본다.
- LHC(대형강입자충돌기)에 빗댄다 - 사회과학이 40억 달러를 달라고 하면 회의적인 반응이 돌아오겠지만, 생산성과 정렬을 위해 만들어진 LLM이 우연히도 인간 상징행동을 들여다보는 사실상의 관측소가 됐다는 것이다.

<strong>핵심 개념 구분</strong>

- <strong>응축물(Condensate)</strong>: 모델 그 자체. 학습된 인간 상징행동의 분포이며, 직접 들여다볼 수는 없다.
- <strong>생성 출력(Generative Output, GO)</strong>: 프롬프트에 대해 실제로 나온 출력 표본. 전통 사회과학의 인터뷰·설문·실험 결과물에 대응한다.
- 이 어휘가 세 가지를 분명히 해 준다 - 모델은 수학적으로 학습됐고, 특정한(따라서 편향된) 데이터셋에 기반하며, 분포적이라 프롬프트를 조금만 바꿔도 다른 GO를 낸다.

<strong>방법론적 혁신을 전통 사회과학 설계에 짝지어 보면</strong>

- 프롬프트 실험: 실험 전통을 이어받은 것이다.
- 합성 페르소나 표집(synthetic persona sampling): 설문 전통을 이어받은 것이다(Park et al.이 1052명을 시뮬레이션, Argyle 등).
- 비교역사 분석: 시대별 코퍼스로 따로 학습한 역사적 언어모델(historical LM)을 쓴다(Coleman et al. 2026이 5개 종교를 각각 1억 토큰씩 따로 학습).
- 절제 연구(ablation): 데이터·정렬·표상을 하나씩 제거해 가며 문화적 의존성을 확인한다. 뇌의 일부를 손상시켜 기능을 알아보는 신경과학의 병변(lesion) 연구에 빗댄 것이다.

<strong>fine-tuning(미세조정) 문제</strong>

이 논문의 칼날 같은 대목이다.

- 배포되는 모델은 RLHF(인간 피드백 강화학습)와 헌법적 제약(constitutional 규칙)으로, 금기·정치 극단·도덕 갈등을 억누르거나 다시 다듬는다.
- 그런데 사회과학이 정작 보고 싶은 것은 바로 그 억눌린 긴장·모호함·규범 위반이다.
- <strong>"정렬된 모델을 문화를 비추는 투명한 거울로 다루면, 가공된 예의(curated civility)를 진짜 합의로 착각하게 된다."</strong>
- 그래서 저자는 기본(base) 모델(불안정하고 접근도 어렵다)과 강하게 정렬된(heavily-aligned) 모델 사이의 절충으로, <strong>지시만 따르게 한 미세조정(instruct-only tuning)</strong>을 권한다. 강한 정렬은 배포에는 꼭 필요하지만, 사회과학 연구에는 걸림돌이다.

<strong>회의론 정리</strong>

- 중국어 방 / 확률적 앵무새(stochastic parrot, 언어가 유창한 것을 인지능력으로 착각하는 오류), 학습 데이터의 비대표성(서구·영어·온라인이 과다 표집됨), 의인화 위험을 짚는다.
- 인간의 학습과 기계의 학습 사이의 근본적 차이(몸으로 겪는 체화, 정서, 발달 단계가 기계에는 없다)도 인정한다.
- 그래서 결론은 <strong>신중한 실험주의(cautious experimentalism)</strong>다 - LLM과 인간 담화가 비교 가능하다고 미리 가정하지 말고, 검증 가능한 경험적 질문으로 다루며, 인간 데이터와 <strong>삼각측량(triangulation)</strong>하라는 것이다. 삼각측량은 여러 독립적 방법으로 같은 결론에 닿는지 맞대 보는 것이다.
- 검증의 기준은 수치가 정확히 일치하는지가 아니라, 방향과 순서가 같은 쪽으로 수렴하는지다. 불일치는 기각 사유가 아니라 새 가설을 떠올리게 하는 신호로 본다.

<strong>이 수업 관점</strong>

- 이 논문은 우리 비판을 저자 스스로 분명히 적어 둔다. 본문에 못박은 문장 - <strong>"AI 모델은 형식 심리학·사회학 이론이 하는 방식의 인과 설명을 제공하지 않는다. 설명과 상관, 의도와 모방을 구분하지 못한다."</strong>
- 즉 LLM은 인간의 판단·신념·규범이 가진 통계적 구조를 전례 없는 규모로 드러내 주지만(추정에 가까운 관측), 인과는 주지 못한다(식별의 부재).
- 그래서 저자는 "인간 피험자·민족지·실험·이론 기반 설명을 대체하는 게 아니라 보완하는 것"이라는 위치로 한발 물러선다.
- 동시에 실리콘 표집의 재귀 문제를 정면으로 다룬다 - GO를 인간의 응답으로 볼 수 없고, 정렬이 분포를 왜곡하며, 검증에는 반드시 인간 데이터와의 삼각측량이 필요하다는 것이다.
- 이 묶음 전체(MOOSE의 가설, Automated Social Science의 LLM 피험자, HLER의 자동분석)를 향해, "이것들은 인간에 관한 발견이 아니라 응축물에 관한 관측이다. 인간에 관한 주장이 되려면 삼각측량이라는, 자동화할 수 없는 단계를 반드시 거쳐야 한다"는 메타 차원의 경고다.

### 자동화는 estimation을 돕지 identification을 대신 못 한다

- 여기서 ②와 같은 문제가 재귀적으로 나타난다.
- LLM이 가설을 만들고 LLM 피험자로 실험을 돌리면, 그 결과는 진짜 사람이 아니라 LLM에 관한 것이므로 silicon sampling의 한계를 그대로 안는다.
- 인과추론의 언어로 정리하면, 자동화는 가설 탐색과 추정의 속도를 올려도 "왜 이것이 인과인가"라는 식별의 논증은 대신하지 못한다.
- Automated Social Science에서 식별을 보장하는 것은 LLM이 아니라 인간이 설계한 구조적 인과모형이고, HLER이 도구변수·회귀불연속을 future work로 미룬 것도 같은 이유다.
- <strong>가설 생성이 값싸질수록 인간의 검증과 식별 논증의 가치는 오히려 올라간다.</strong>

## 7. 종합 - trend와 noise를 가르기

### 네 역할 종합 매트릭스

| 역할 | LLM이 대신하는 것 | 대표 기법 | 핵심 위험 | 판정 |
|------|------------------|----------|----------|------|
| <strong>① 측정 도구</strong> | 인간 코더 | zero-shot 분류, DSL/PPI/SRI, text-as-treatment | 비무작위 측정 오차 | 가장 단단. 추론 보정 필수 |
| <strong>③ 연구 대상</strong> | (대신 안 함) | 편향 감사, 심리측정, 해석가능성 | 거울 vs artifact 구분 | 안전하나 해석 신중 |
| <strong>④ 연구자 보조</strong> | 연구자 | 가설 생성, 자동화 사회과학 | identification 공백 | 보조는 가능, 대체는 불가 |
| <strong>② 시뮬레이션</strong> | 피험자·응답자 | silicon sampling, 페르소나 | 충격 시점·ABM 회귀 | 거시 사안엔 회의적 |

### 두 가지 메시지

1. 보정이 필요하다는 사실 자체는 trend다. 다만 "사람이 루프에 상주해야 한다"는 noise에 가깝다 - 보정은 데이터(소량의 정답 라벨)나 모델로 하는 것이고, 사람의 자리는 상시 개입이 아니라 무엇을 물을지·무엇이 타당한지를 정하는 데 있다. 캡스톤에서 "LLM 썼습니다"는 시작이지 결론이 아니다.
2. 위계의 기준은 변하지 않았다 - 가정의 투명성과 검증 가능성이다. ①이 단단한 건 측정 오차를 명시적으로 모델링해 데이터로 보정할 수 있어서고, ②가 위험한 건 "이 시뮬레이션이 현실과 같다"는 가정이 불투명하고 검증 불가능해서다. 인과추론에서 위계를 매긴 잣대와 같다.

### 다음 주로

다음 시간은 이 수업의 결론이다 - "왜 데이터 분석이 사실 그리 중요하지 않을까". 오늘 본 네 역할 중 어느 것도 분석가의 판단을 대체하지 못한다는 점이 그 역설의 출발점이 된다. 도구가 싸지고 흔해질수록, 무엇을 물을지와 어떻게 식별할지를 아는 사람의 값어치는 올라간다.

        currentSection = sectionMatch[2];

        continue;

        buf.push(line);
        continue;

    for (const { key, val } of mermaidStore) {
      html = html.split(key).join('<pre class="mermaid">' + val + '</pre>');
    }
    return html;
  }

  function renderMarkdown(content) {
    const m1 = protectMath(content);
    const m2 = protectMermaid(m1.md);
    let html = marked.parse(m2.md);
    html = restoreAll(html, m1.store, m2.store);
    return html;
  }

  // ===== 4. BUILD SLIDE ELEMENTS =====
  const container = document.getElementById('presentation');
  const slideEls = [];

  slides.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'slide';
    el.dataset.section = s.section || '';
    el.dataset.sectionNum = s.sectionNum || '';

    if (s.type === 'title') {
      el.classList.add('slide-title');
      // Parse title content
      const tlines = s.content.split('\n');
      let h1 = '', h2 = '', meta = '';
      for (const tl of tlines) {
        if (tl.startsWith('# ') && !tl.startsWith('## ')) h1 = tl.replace(/^# /, '');
        else if (tl.startsWith('## ')) h2 = tl.replace(/^## /, '');
        else if (tl.startsWith('> ')) meta = tl.replace(/^>\s*/, '').replace(/\*\*/g, '');
      }
      el.innerHTML = '<div class="slide-inner">' +
        '<h1>' + h1 + '</h1>' +
        '<h2>' + h2 + '</h2>' +
        '<div class="meta">' + meta + '</div></div>';
    } else if (s.type === 'divider') {
      el.classList.add('slide-divider');
      el.innerHTML = '<div class="slide-inner">' +
        '<div class="section-number">' + s.sectionNum + '</div>' +
        '<div class="section-title">' + s.section + '</div></div>';
    } else {
      el.classList.add('slide-content');
      const inner = document.createElement('div');
      inner.className = 'slide-inner';
      inner.innerHTML = renderMarkdown(s.content);
      el.appendChild(inner);
    }

    if (i !== 0) el.style.display = 'none';
    else el.classList.add('active');

    container.appendChild(el);
    slideEls.push(el);
  });

  // ===== 5. RENDER KATEX & MERMAID =====
  async function renderSpecial() {
    // KaTeX
    slideEls.forEach(el => {
      if (el.classList.contains('slide-content')) {
        renderMathInElement(el, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false }
          ],
          throwOnError: false,
          trust: true
        });
      }
    });

    // Mermaid
    const mermaidEls = document.querySelectorAll('.mermaid');
    if (mermaidEls.length > 0) {
      // Temporarily show all slides so mermaid can measure
      slideEls.forEach(el => { el.style.display = 'flex'; el.style.visibility = 'hidden'; });
      try { await mermaid.run({ nodes: mermaidEls }); } catch(e) { console.warn('Mermaid error:', e); }
      slideEls.forEach((el, i) => {
        el.style.visibility = '';
        if (i !== currentSlide) { el.style.display = 'none'; el.classList.remove('active'); }
        else { el.style.display = 'flex'; el.classList.add('active'); }
      });
    }
  }

  // ===== 6. NAVIGATION =====
  let currentSlide = 0;
  const total = slideEls.length;

  const counterEl = document.getElementById('slide-counter');
  const progressEl = document.getElementById('progress-fill');
  const sectionEl = document.getElementById('section-indicator');

  function updateUI() {
    counterEl.textContent = (currentSlide + 1) + ' / ' + total;
    progressEl.style.width = ((currentSlide + 1) / total * 100) + '%';
    const sec = slideEls[currentSlide].dataset.sectionNum;
    const secName = slideEls[currentSlide].dataset.section;
    if (sec) sectionEl.textContent = sec + '. ' + secName;

    // White counter on dark divider slides
    const isDivider = slideEls[currentSlide].classList.contains('slide-divider');
    counterEl.style.color = isDivider ? 'rgba(255,255,255,0.5)' : '';
    sectionEl.style.color = isDivider ? 'rgba(255,255,255,0.4)' : '';
  }

  function goTo(n) {
    if (n < 0 || n >= total || n === currentSlide) return;
    slideEls[currentSlide].style.display = 'none';
    slideEls[currentSlide].classList.remove('active');
    currentSlide = n;
    slideEls[currentSlide].style.display = 'flex';
    slideEls[currentSlide].classList.add('active');
    slideEls[currentSlide].scrollTop = 0;
    updateUI();
  }

  window.nextSlide = function() { goTo(currentSlide + 1); };
  window.prevSlide = function() { goTo(currentSlide - 1); };

  // Keyboard
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ' || e.key === 'PageDown') {
      e.preventDefault(); nextSlide();
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'Backspace' || e.key === 'PageUp') {
      e.preventDefault(); prevSlide();
    } else if (e.key === 'Home') {
      e.preventDefault(); goTo(0);
    } else if (e.key === 'End') {
      e.preventDefault(); goTo(total - 1);
    }
  });

  // Click navigation removed - use keyboard arrows or nav buttons only

  // Touch swipe
  let touchStartX = 0;
  container.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
  container.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].screenX - touchStartX;
    if (Math.abs(dx) > 50) {
      if (dx < 0) nextSlide();
      else prevSlide();
    }
  }, { passive: true });

  // ===== 7. PAGE JUMP =====
  const pageJumpEl = document.getElementById('page-jump');
  const pageJumpInput = document.getElementById('page-jump-input');
  const pageJumpTotal = document.getElementById('page-jump-total');
  const pageJumpBtn = document.getElementById('page-jump-btn');

  pageJumpTotal.textContent = '/ ' + total;

  counterEl.addEventListener('click', (e) => {
    e.stopPropagation();
    counterEl.style.display = 'none';
    pageJumpEl.style.display = 'flex';
    pageJumpInput.value = '';
    pageJumpInput.focus();
  });

  function doJump() {
    const n = parseInt(pageJumpInput.value, 10);
    if (!isNaN(n) && n >= 1 && n <= total) {
      goTo(n - 1);
    }
    pageJumpEl.style.display = 'none';
    counterEl.style.display = '';
  }

  pageJumpBtn.addEventListener('click', doJump);
  pageJumpInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); doJump(); }
    if (e.key === 'Escape') { pageJumpEl.style.display = 'none'; counterEl.style.display = ''; }
    e.stopPropagation(); // prevent slide navigation while typing
  });
  pageJumpInput.addEventListener('keyup', (e) => e.stopPropagation());

  // Close jump box when clicking outside
  document.addEventListener('click', (e) => {
    if (pageJumpEl.style.display === 'flex' && !pageJumpEl.contains(e.target)) {
      pageJumpEl.style.display = 'none';
      counterEl.style.display = '';
    }
  });

  // ===== 8. INIT =====
  updateUI();
  renderSpecial();

})();
</script>
</body>
</html>
