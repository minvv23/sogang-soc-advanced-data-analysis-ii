# 5월 22일 - 텍스트 분석
## 모든 것은 분류(classification) 아니면 군집화(clustering)다 - 사전, 임베딩, 그리고 LLM

> <strong>SOC4013-01 고급데이터분석 Ⅱ(캡스톤디자인)</strong> | 2026년 봄학기 12주차
>
> 인터랙티브 프레젠테이션: https://minvv23.github.io/sogang-soc-advanced-data-analysis-ii/20260522-presentation.html

## 1. 텍스트 분석을 큰 그림에서 다시 보기

### 왜 이번 주에 텍스트인가

지금까지 우리는 정형(structured) 데이터만 다뤘다. 설문 응답 1,070명 × 변수 수십 개, 서울시 도로 139개 × 주차별 교통량. 행과 열이 정해진 표.

그런데 사회과학에서 가장 빠르게 늘어나는 데이터는 정형이 아니다. <strong>댓글, 게시글, 인터뷰 녹취, 기사 본문, SNS 포스트</strong> 같은 비정형 텍스트다.

이 데이터로 무엇을 묻고 싶은가? 보통 다음과 같다.

- "이 댓글들은 어떤 토픽으로 구성되어 있는가?"
- "각 플랫폼별로 정치적 정서가 어떻게 다른가?"
- "특정 사건 전후로 담론이 어떻게 변했는가?"
- "어떤 댓글이 빈정거림(sarcasm)이고 어떤 게 진심인가?"

이런 질문에 답하려고 만들어진 도구들이 텍스트 분석 기법이다. 그런데 학부 교과서를 펼치면 갑자기 <strong>한 무더기의 알고리즘 이름</strong>이 쏟아진다. TF-IDF, LDA, word2vec, BERT, BERTopic, Latent Semantic Analysis, Naive Bayes, SVM, summarization, QA, NER ··· 학생 입장에서는 어디서부터 손대야 할지 막막하다.

이번 수업의 출발점은 이 무더기를 <strong>두 가지 작업</strong>으로 환원하는 데 있다.

### 모든 텍스트 분석은 두 가지 작업 중 하나다 - Top-down vs Bottom-up

표면적으로 텍스트 분석은 수십 가지로 보이지만, <strong>실제로는 두 가지 작업의 변주</strong>다. 두 작업을 가르는 가장 직관적인 축은 <strong>분석의 방향성</strong>이다.

- <strong>Classification (분류) = Top-down</strong>. 라벨 후보가 <strong>위에서 먼저 정해진다</strong>. 분석가가 "긍정/부정/중립"이라는 라벨 체계를 미리 들고 들어와서, 각 문서를 그 중 하나로 떨어뜨린다. 라벨이 분석을 이끈다.
- <strong>Clustering (군집화) = Bottom-up</strong>. 라벨이 <strong>없는 상태에서 데이터 자체에서 구조가 솟아오른다</strong>. "이 댓글들을 자연스럽게 묶으면 어떤 군집이 나오는가"를 데이터에 묻는 것. 군집을 발견한 뒤에야 그 군집이 무엇인지 분석가가 라벨을 붙인다.

```mermaid
flowchart TD
    A["<b>텍스트 분석 task</b>"] --> B["<b>Classification (분류)</b><br/>Top-down<br/>라벨 → 데이터<br/>supervised"]
    A --> C["<b>Clustering (군집화)</b><br/>Bottom-up<br/>데이터 → 라벨<br/>unsupervised"]
    B --> B1["감성 분석 (긍정/부정)"]
    B --> B2["스팸 필터"]
    B --> B3["정치 성향 추정"]
    B --> B4["빈정거림 탐지"]
    B --> B5["토픽 라벨링<br/>(라벨 후보 주어짐)"]
    C --> C1["토픽 발견"]
    C --> C2["담론 그룹화"]
    C --> C3["유사 문서 검색"]
    C --> C4["이상치/노이즈 탐지"]

    classDef cls fill:#e3f2fd,stroke:#1565c0,color:#000
    classDef clu fill:#fff3e0,stroke:#e65100,color:#000
    class B,B1,B2,B3,B4,B5 cls
    class C,C1,C2,C3,C4 clu
```

이 두 축 (top-down vs bottom-up, 라벨 있음 vs 없음)은 본질적으로 같은 구분이고, 사회과학 연구 설계의 익숙한 두 모드와도 대응된다.

- Top-down = <strong>가설 검증(hypothesis-testing)</strong> 모드. "내가 정의한 카테고리가 데이터에 어떻게 분포하는가"를 묻는다.
- Bottom-up = <strong>탐색적(exploratory) 분석</strong> 모드. "데이터 안에 어떤 구조가 있는지부터 보자"는 자세.

이 차이가 사소해 보이지만, 뒤에서 보겠지만 <strong>"왜 LLM이 분류는 혁신했는데 군집화는 혁신하지 못했는가"</strong>의 핵심 이유가 된다. 같은 텍스트를 다루는 일처럼 보여도 두 작업은 <strong>계산 복잡도의 구조가 다르다</strong>.

### 텍스트 분석의 세 시대

내용으로 들어가기 전에 시대 구분을 박아둔다. 어떤 기법이 왜 등장하고 왜 사라졌는지의 흐름을 보여 준다.

```mermaid
flowchart LR
    A["<b>1세대: 사전·빈도 기반</b><br/>(~2010s)<br/>워드클라우드, 텍스트 네트워크,<br/>LDA, 감성사전"] --> B["<b>2세대: 임베딩 기반</b><br/>(2013~)<br/>word2vec, GloVe,<br/>BERT, Sentence-BERT<br/>+ UMAP/HDBSCAN 군집화"]
    B --> C["<b>3세대: LLM 기반</b><br/>(2022~)<br/>zero-shot 분류, NER, 요약, QA<br/>대부분의 분류 작업을 흡수"]

    classDef old fill:#ffcdd2,stroke:#c62828,color:#000
    classDef mid fill:#fff9c4,stroke:#f57f17,color:#000
    classDef new fill:#c8e6c9,stroke:#2e7d32,color:#000
    class A old
    class B mid
    class C new
```

세 시대의 분업을 미리 말해두면 - <strong>분류 작업은 3세대(LLM)가 거의 대체했고, 군집화 작업은 2세대(임베딩 기반)가 여전히 표준</strong>이다. 이 분업이 왜 그렇게 되는지가 이번 수업의 핵심 메시지다.

이 수업의 입장은 명확하다 - <strong>1세대 기법은 "지금은 거의 쓰지 말아야 할 것들"이다</strong>. 사전 기반 감성분석, LDA, 워드클라우드, 텍스트 네트워크 분석은 학부 교과서와 일부 대학원 수업에서 여전히 가르치지만, 실제 응용 연구에서는 자취를 감추고 있다. 이유가 있다. 이번 수업의 절반은 그 이유를 정확히 짚는 데 쓴다.

## 2. 분류·군집화·생성 - NLP 작업의 세 유형

### 양분에서 삼분으로

지금까지 분류와 군집화를 양분론으로 다뤘다. 학생들이 자주 묻는 반론이 있다 - "요약(summarization), 질의응답(QA), 개체명 인식(NER) 같은 것들은 분류도 군집화도 아니지 않은가?" 좋은 질문이다.

답은 두 갈래다. 어떤 작업은 사실 분류·군집화의 변형이고, 어떤 작업은 진짜로 다른 유형이다. 그 다른 유형이 <strong>생성(generation)</strong>이다. 따라서 NLP 작업의 큰 분류는 결국 <strong>분류·군집화·생성</strong> 세 가지다.

### 주요 NLP 작업들의 유형

| 작업 | 무엇을 하는가 | 본질 |
|------|-------------|------|
| <strong>감성 분석 (Sentiment Analysis)</strong> | 문서를 긍정/부정/중립으로 라벨링 | <strong>분류</strong> |
| <strong>토픽 분류 (Topic Classification)</strong> | 정치/경제/스포츠 등 미리 정의된 토픽에 배정 | <strong>분류</strong> |
| <strong>NER (Named Entity Recognition)</strong> | 문서 안의 토큰을 인명/지명/기관/날짜로 라벨링 | <strong>토큰 단위 분류</strong> |
| <strong>품사 태깅 (POS Tagging)</strong> | 각 토큰을 명사/동사/형용사로 라벨링 | <strong>토큰 단위 분류</strong> |
| <strong>스팸 필터</strong> | 메일을 스팸/정상으로 라벨링 | <strong>분류</strong> |
| <strong>토픽 모델링 (Topic Modeling)</strong> | 라벨 없이 코퍼스에서 토픽 발견 | <strong>군집화</strong> |
| <strong>문서 군집화 (Document Clustering)</strong> | 유사한 문서끼리 묶기 | <strong>군집화</strong> |
| <strong>유사 문서 검색 (Semantic Search)</strong> | 쿼리와 가까운 문서 찾기 | <strong>군집화의 변형</strong> |
| <strong>요약 (Summarization)</strong> | 긴 문서를 짧게 압축 | <strong>생성</strong> |
| <strong>QA (Question Answering)</strong> | 질문에 대한 답 생성 또는 추출 | <strong>생성</strong> (또는 추출) |
| <strong>번역 (Machine Translation)</strong> | 한 언어를 다른 언어로 변환 | <strong>생성</strong> |

표에서 보이는 패턴은 명확하다. <strong>대부분의 NLP 작업은 분류 또는 군집화로 환원되고, 그 밖이 생성</strong>이다.

### 세 유형의 결정적 차이 - 출력의 종류

세 유형을 가르는 기준은 <strong>출력의 종류</strong>다.

- <strong>분류</strong>: 출력 = 라벨 하나 (이산적, 미리 정해진 라벨 집합에서 선택). 입력 한 개 → 출력 한 개.
- <strong>군집화</strong>: 출력 = 군집 ID (이산적, 데이터에서 학습된 라벨). 입력 여러 개 → 출력 여러 개 (관계 구조).
- <strong>생성</strong>: 출력 = 가변 길이 토큰 시퀀스 (자연어 문장 그 자체).

생성 작업은 2세대 임베딩 기반 도구로는 사실상 다루기 어려웠다. <strong>3세대 LLM의 등장이 결정적으로 바꿔놓은 것은 바로 이 생성 영역</strong>이다. ChatGPT 류 LLM이 충격적이었던 것은 분류 성능이 좋아져서가 아니라, 사람이 읽을 만한 길이와 품질의 텍스트를 만들 수 있게 됐기 때문이다.

이번 수업은 생성 작업을 깊이 다루지 않는다. 사회과학 텍스트 분석의 핵심 작업이 여전히 <strong>분류와 군집화</strong>이기 때문이다. 다만 NER이나 요약 같은 도구를 <strong>분석의 전처리</strong>로 쓰는 건 흔하다 - 댓글에서 사람 이름을 NER로 뽑아낸 뒤 그 이름들의 빈도 분포를 보거나, 긴 인터뷰 녹취를 요약한 뒤 그 요약문을 분류·군집화에 넣는 식.

## 3. 1세대 (1) - 워드클라우드는 분석이 아닌 장식이다

### 워드클라우드의 작동 방식과 한계

워드클라우드는 빈도 높은 단어를 크게, 적은 단어를 작게 그리는 시각화다. 알고리즘은 (1) stopword 제거, (2) 단어 빈도 카운트, (3) 빈도에 비례한 크기로 배치, 가 전부다. <strong>분석이라기보다 빈도 시각화의 한 형식</strong>일 뿐이다.

![워드클라우드의 네 가지 한계](images/word_cloud_critique.svg)

위 그림에 정리된 네 가지 한계를 풀어보자.

<strong>한계 1 - 빈도 1위 단어는 거의 항상 도메인의 자명한 단어다.</strong>

정치 댓글 데이터의 워드클라우드 1위가 "대통령"이라는 사실이 무엇을 알려주는가? 아무것도. 정치 댓글이니 정치인 이름이 많이 나오는 건 데이터를 보지 않아도 안다.

<strong>한계 2 - 단어 사이 관계를 표현하지 못한다.</strong>

"대통령"과 "잘한다"가 함께 나오는 댓글과 "대통령"과 "개판"이 함께 나오는 댓글은 정반대의 정서다. 그러나 워드클라우드에서는 둘 다 똑같이 "대통령"이라는 단어의 빈도로만 기여한다. 정서를 합쳐서 평균낸 무의미한 그림이 나온다.

<strong>한계 3 - 시간·집단 변화를 표현 못한다.</strong>

용산 이전 전후로 댓글 담론이 어떻게 변했는지, 네이버와 디시인사이드가 어떻게 다른지 - 워드클라우드는 답할 수 없다. 한 장의 정적 그림으로 모든 차이를 압축해 버린다.

<strong>한계 4 - 부정어·반어·맥락 무시.</strong>

"안 좋다"의 "좋다", "행복하긴 개뿔"의 "행복", "잘한다 잘한다 ㅋㅋ"의 "잘한다" - 모두 빈도로 카운트되며 원래 의미와 정반대의 빈도 기여를 한다.

## 4. 1세대 (2) - 텍스트 네트워크 분석은 "워드클라우드 + α"에 불과하다

### 텍스트 네트워크 분석이란

단어를 노드(node), 같은 문서에 함께 등장하는 단어 쌍을 엣지(edge)로 잇는 그래프 분석이다. 노드 크기는 보통 단어 빈도, 엣지 굵기는 공출현(co-occurrence) 빈도. <strong>사회연결망분석(SNA)의 단어 버전 흉내</strong>다.

사회학 학부 보고서·일부 학술 논문에 종종 등장한다. "중심성(centrality)이 높은 단어", "커뮤니티 검출(community detection)으로 발견한 단어 클러스터" 같은 분석을 한다.

![텍스트 네트워크 분석의 한계](images/text_network_critique.svg)

### 왜 이게 워드클라우드의 변형에 불과한가

겉으로 보면 워드클라우드보다 정교해 보인다. 빈도뿐 아니라 단어 사이 "관계"까지 표현하는 것처럼. 그러나 자세히 보면 워드클라우드의 모든 결함이 그대로 남아 있고, 새로운 결함이 추가된다.

<strong>비판 1 - "공출현" 자체는 의미가 아니다.</strong>

같은 댓글에 등장한다고 두 단어가 의미적으로 연결됐다고 볼 근거가 약하다. 부정어와 그 뒤의 단어, 인용과 본문, 무관한 두 화제가 한 댓글에 섞인 경우 - 모두 동일한 "공출현"으로 처리된다. SNA에서 사람 A와 B가 친구라는 사실은 명확한 사회적 의미를 가지지만, 단어 A와 B가 같은 문장에 있다는 사실은 의미가 매우 약하다.

<strong>비판 2 - 결국 빈도의 시각화 변형.</strong>

노드 크기 = 단어 빈도(= 워드클라우드)이고, 엣지 굵기 = 두 단어의 곱빈도(= 워드클라우드의 2차 함수). <strong>새로운 정보가 거의 없다</strong>. 그래프 형태로 그려진다는 점만 다르다.

<strong>비판 3 - 임의적 컷오프에 결과가 휘둘린다.</strong>

상위 100개 단어? 200개? 컷오프를 바꾸면 그래프가 완전히 달라진다. "중심성이 높은 단어"라는 발견도 결국 컷오프와 가중치 정의에 의존하는데, 그 기준에 객관적 근거가 없다.

<strong>비판 4 - 단어를 노드로 잡는 발상 자체가 1세대의 한계.</strong>

"사과(과일)"와 "사과(사죄)"가 한 노드. 동음이의어를 구별하지 못한다는 1세대의 근본 문제를 그대로 안고 있다. 이 문제를 해결한 것이 2세대 임베딩이다 - 텍스트 네트워크 분석은 그 한 단계 전에 머물러 있다.

### 텍스트 네트워크 분석이 의미 있는 경우

예외는 있다. <strong>단어가 아니라 사람·기관 같은 실체(entity)를 노드</strong>로 잡고, 그 실체들이 같은 문서에 등장하는 관계를 추적하는 분석. 예: 뉴스 기사에서 등장하는 정치인들의 공동 출현 네트워크, 학술 논문의 공저자 네트워크. 이건 진짜 SNA고 의미가 있다. 그러나 일반적인 "단어 노드 + 단어 노드" 그래프는 위의 네 가지 비판을 피하기 어렵다.

## 5. 1세대 (3) - LDA (Latent Dirichlet Allocation, 잠재 디리클레 할당)

### LDA의 작동 원리

LDA는 2003년 Blei가 제안한 이후 한동안 사회과학에서 가장 인기 있는 토픽 모델이었다. "수만 건의 문서에서 자동으로 토픽을 발견한다"는 약속이 매력적이었다. 작동 원리는 다음과 같다.

- 각 문서는 <strong>토픽들의 혼합(mixture of topics)</strong>이라고 가정한다. 어떤 댓글이 "정치 토픽 60% + 경제 토픽 30% + 연예 토픽 10%"의 혼합일 수 있다.
- 각 토픽은 <strong>단어들의 확률 분포</strong>라고 가정한다. "정치 토픽"은 "대통령(0.05), 국회(0.04), 정책(0.03), ···"의 분포.
- 분석가는 <strong>토픽 수 $K$를 미리 정한다</strong>.
- 알고리즘은 문서별 토픽 분포와 토픽별 단어 분포를 베이지안 추론으로 동시에 추정한다.

### LDA의 생성 모형 수식

LDA를 진짜로 이해하려면 그 <strong>생성 모형(generative model)</strong>의 식을 한 번 정면으로 보는 게 좋다. 식은 다음과 같다.

$$\theta_d \sim \text{Dirichlet}(\alpha)$$

$$\phi_k \sim \text{Dirichlet}(\beta)$$

$$z_{d,n} \sim \text{Categorical}(\theta_d)$$

$$w_{d,n} \sim \text{Categorical}(\phi_{z_{d,n}})$$

기호가 빽빽하다. 천천히 하나씩 풀어 읽자.

- $\theta_d$: <strong>문서 $d$의 토픽 혼합 비율</strong>. $K$차원 확률 벡터. 예: $K=3$이고 $\theta_d = (0.6, 0.3, 0.1)$이면 "이 댓글은 토픽 1이 60%, 토픽 2가 30%, 토픽 3이 10%". 합쳐서 1이 되는 비율.
- $\text{Dirichlet}(\alpha)$: 확률 벡터 자체의 분포(분포의 분포). <strong>"문서마다 토픽 혼합 비율을 어떻게 뽑을지를 정하는 사전 분포"</strong>다. $\alpha$가 작으면 각 문서가 소수의 토픽에 집중되고, 크면 여러 토픽이 골고루 섞인다.
- $\phi_k$: <strong>토픽 $k$가 쓰는 단어들의 확률 분포</strong>. 어휘 크기 $V$차원 벡터. 예: "정치 토픽"의 $\phi_1$은 "대통령(0.05), 국회(0.04), 정책(0.03), ··· , 케이크(0.0001)" 같은 분포.
- $z_{d,n}$: <strong>문서 $d$의 $n$번째 단어가 어느 토픽에서 뽑혔는가</strong>를 나타내는 잠재 변수. 1부터 $K$ 사이의 정수. 데이터에서 직접 보이지 않는다.
- $w_{d,n}$: <strong>관측되는 단어 자체</strong>. 우리가 데이터에서 보는 유일한 양.

생성 과정을 한국어 시나리오로 옮기면 이렇다.

1. 각 토픽 $k$마다 단어 분포 $\phi_k$를 디리클레로 한 번 뽑는다 (모든 문서에 공통).
2. 새 문서 $d$를 만들 때마다 그 문서의 토픽 혼합 $\theta_d$를 디리클레로 뽑는다.
3. 그 문서의 각 단어 슬롯 $n$마다:
   - 토픽 $z_{d,n}$을 $\theta_d$에서 뽑는다 (예: "이 슬롯은 정치 토픽").
   - 단어 $w_{d,n}$을 $\phi_{z_{d,n}}$에서 뽑는다 (예: 정치 토픽의 단어 분포에서 "대통령"이 뽑힘).

<strong>학습이란 이 과정의 역방향 추론이다.</strong> 우리는 $w_{d,n}$만 관측한다. $\theta_d$, $\phi_k$, $z_{d,n}$은 모두 잠재 변수(latent)다. 베이지안 추론(보통 Gibbs sampling이나 variational inference)으로 이 잠재 변수들의 사후 분포를 추정한다.

![LDA의 생성 과정과 다섯 가지 한계](images/lda_structure.svg)

### LDA의 다섯 가지 한계

수식이 우아함에도 불구하고 사회과학 응용에서 LDA가 자취를 감춘 데에는 분명한 이유가 있다.

<strong>한계 1 - 토픽 수 $K$를 미리 정해야 한다.</strong>

$K = 10$으로 돌리면 토픽 10개가, $K = 50$으로 돌리면 토픽 50개가 나온다. 어느 게 "맞는" 답인가? 결정할 객관적 기준이 없다. Perplexity나 coherence score 같은 지표가 있지만, 실제 연구에서는 <strong>"해석 가능한 결과가 나올 때까지 $K$를 바꿔 본다"</strong>는 식이 흔하다. 사실상 결과에 맞춰 분석을 조정하는 것이고, 재현 가능성을 심각하게 훼손한다.

<strong>한계 2 - Bag-of-Words 가정: 어순 무시.</strong>

LDA의 생성 모형에서 $w_{d,n}$들은 <strong>교환 가능(exchangeable)</strong>하다고 가정된다. "개가 사람을 물었다"와 "사람이 개를 물었다"는 LDA에게 완전히 같은 문서다. 부정어, 인용, 비유, 반어가 모두 무시된다.

<strong>한계 3 - 토픽이 사람이 해석 가능하다는 보장이 없다.</strong>

LDA의 출력은 각 토픽마다 "상위 단어 10개" 같은 형태다. 토픽 7과 13의 상위 단어가 비슷해 보일 수도, 한 토픽이 두 의미를 섞고 있을 수도 있다. <strong>해석 가능한 토픽만 보고하고 나머지는 표에 안 쓴다</strong>는 cherry-picking이 LDA 논문의 공공연한 관행이었다.

<strong>한계 4 - 시드/하이퍼파라미터 민감성.</strong>

같은 데이터, 같은 $K$, 같은 $\alpha$/$\beta$로 두 번 돌려도 (시드만 바꾸면) 토픽이 미묘하게 달라진다. 학술 논문에서 독립적으로 재현되기 매우 어렵다.

<strong>한계 5 - 의미 표현 불가.</strong>

가장 결정적이다. LDA에서 단어는 그저 "어휘의 한 위치"이고, 토픽은 그 위치들의 확률 분포다. "민주주의"와 "선거"가 의미적으로 가까운지, "사과(과일)"와 "사과(사죄)"가 다른지 - LDA는 답할 수 없다. <strong>의미를 표현하지 못하는 도구로 의미를 분석하려 했다</strong>는 게 LDA의 근본 문제다.

이 다섯 가지를 한 방에 우회한 것이 2세대 임베딩 기반 BERTopic이다. 임베딩 공간에서 군집화를 한 뒤 각 군집의 대표 단어를 뽑는 방식이라, $K$를 정할 필요도, BoW 가정도, 의미 표현 불가 문제도 없다.

## 6. 1세대 (4) - 사전 기반 감성분석

### 작동 방식

아이디어는 단순하다.

1. "긍정 단어" 사전과 "부정 단어" 사전을 만들어 둔다. (영어는 LIWC, 한국어는 KOSAC, 군산대 감성사전 등)
2. 분석할 문서에 등장하는 단어를 사전과 매칭한다.
3. 긍정 단어 개수 - 부정 단어 개수 = 감성 점수.

예를 들어 LIWC 류 한국어 사전에는 "행복", "기쁨", "사랑"이 긍정으로, "분노", "슬픔", "절망"이 부정으로 등재되어 있다.

### 왜 망했는가

<strong>한계 1 - 맥락(context)을 보지 못한다.</strong>

- "이 영화 진짜 <strong>안</strong> 재밌다." → 사전은 "재밌다"를 긍정으로 카운트.
- "별로 <strong>나쁘지 않다</strong>." → "나쁘다"가 부정으로 카운트되지만 실제로는 약한 긍정.
- "행복하긴 개뿔." → "행복"이 긍정으로 카운트되지만 빈정거림.

부정어 처리(negation handling)를 후처리로 추가하면 일부 해결되지만, 빈정거림·반어법·이중부정·완곡어법까지 다 잡으려면 결국 <strong>문법 분석을 따로 해야 하고</strong>, 사전 기반의 단순함이라는 장점이 사라진다.

<strong>한계 2 - 신조어·은어·도메인 어휘에 약하다.</strong>

커뮤니티 댓글에는 사전에 등재되지 않은 표현이 압도적으로 많다. "ㅈㄴ", "개꿀", "노답", "ㅂㅅ", "꿀잼", "팩폭", "ㅇㅈ", "ㄹㅇ". 디시인사이드·에펨코리아 같은 커뮤니티에서는 한 문장에 사전 어휘가 한 개도 없는 경우가 흔하다.

<strong>한계 3 - "단어 = 의미"라는 잘못된 전제.</strong>

워드클라우드, 텍스트 네트워크, LDA와 공유하는 결함. "사과"라는 글자에 하나의 라벨을 붙일 뿐이다. <strong>의미는 단어가 아니라 단어들의 관계에서 나온다</strong>는 사실을 사전은 표현할 수 없다.

### 1세대 기법의 공통 결함

네 기법을 한 표로 정리한다.

| 기법 | 주된 출력 | 공통 결함 |
|------|----------|----------|
| 워드클라우드 | 단어 빈도 시각화 | 빈도 외 정보 없음, 관계 표현 불가 |
| 텍스트 네트워크 | 단어 공출현 그래프 | 워드클라우드의 2차 함수, 의미 추가 정보 거의 없음 |
| LDA | 토픽 = 단어 분포 | BoW 가정, 의미 표현 불가, $K$ 의존 |
| 사전 기반 감성분석 | 문서별 감성 점수 | 맥락·신조어·반어 무시 |

<strong>네 가지 모두 "단어"를 분석의 단위로 삼고, 단어들 사이의 의미적 관계를 표현할 수단이 없다</strong>는 점에서 같다. 이 한계를 깬 것이 2세대 - 단어 임베딩이다.

## 7. Vector Space Model - 텍스트를 숫자로 옮기는 첫 시도

### Bag-of-Words (BoW) - 1세대와 2세대의 다리

임베딩 이야기로 가기 전, 그 직전 단계인 BoW와 TF-IDF를 짚어야 한다. 1세대 빈도 기반과 2세대 임베딩 기반 사이를 잇는 다리다.

BoW는 단순하다. 어휘 사전(vocabulary)을 만든 뒤, 각 문서를 <strong>어휘 크기만큼의 벡터</strong>로 표현한다. 벡터의 $j$번째 원소 = "$j$번 단어가 이 문서에 몇 번 나오는가".

| 문서 | 대통령 | 정책 | 국회 | 사과 | 짜증 | ··· |
|------|--------|------|------|------|------|-----|
| 댓글 1 | 2 | 1 | 0 | 0 | 1 | ··· |
| 댓글 2 | 0 | 0 | 0 | 3 | 0 | ··· |
| 댓글 3 | 1 | 1 | 1 | 0 | 2 | ··· |

이 표가 곧 텍스트의 수치 표현이다. 어휘가 5만 개라면 5만 차원 벡터다.

### Zipf의 법칙과 sparse vector 문제 - 더미 변수 불균형과의 유비

여기서 회귀분석에서 배운 내용과 연결되는 중요한 사실 하나를 짚는다.

자연어에서 단어 빈도는 <strong>극단적으로 비대칭</strong>이다. 언어학자 George Zipf가 정식화한 이 패턴(<strong>Zipf의 법칙</strong>)은 다음과 같이 정리된다 - <strong>코퍼스에서 어떤 단어의 빈도는 그 단어의 순위(rank)에 반비례한다</strong>. 즉 1위 단어는 2위 단어보다 약 2배, 3위 단어보다 약 3배 자주 등장한다.

$$f(w) \propto \frac{1}{\text{rank}(w)}$$

구체적인 결과는 다음과 같다.

- 상위 100~200개 단어가 코퍼스의 절반 이상의 토큰을 차지한다 ("것", "하다", "있다", "사람" 같은 단어들).
- 어휘 사전의 대다수 단어(>50%)는 코퍼스 전체에서 <strong>딱 한 번만 등장</strong>한다 (이를 hapax legomenon이라 부른다).
- 결과적으로 BoW 행렬은 <strong>대부분의 원소가 0</strong>인 sparse matrix가 된다.

이 sparse 구조가 통계적으로 어떤 문제를 일으키는지는 - <strong>회귀분석에서 익숙한 문제</strong>다. 지금까지 우리가 배운 것을 떠올리자.

> 더미 변수(dummy variable)의 한쪽 비율이 극도로 낮으면(예: 99% 0, 1% 1), 그 변수의 회귀계수는 매우 작은 표본에서 추정되는 셈이라 분산이 크고 불안정하다. 회귀에 그대로 넣으면 추정이 망한다.

BoW에서 단어 하나하나가 사실상 <strong>"이 문서에 단어 $j$가 등장했는가"라는 더미 변수</strong>다. 그리고 Zipf의 법칙 때문에 거의 모든 단어 더미가 <strong>극단적으로 불균형</strong>이다 - 대부분 0, 가끔 1. 이 sparse한 더미들을 입력으로 그대로 쓰면 통계 모델의 추정이 불안정해진다.

| 회귀분석 (정형 데이터) | BoW (텍스트) |
|---------------------|--------------|
| 더미 변수의 한쪽이 극도로 불균형 (99% 0) | 단어 더미의 한쪽이 극도로 불균형 (>99% 0) |
| 계수 추정 분산이 큼, 불안정 | 가중치 학습이 어렵고 노이즈에 약함 |
| → 변수 결합·범주 통합·제거로 처리 | → 차원 축소, 임베딩, 정규화로 처리 |

<strong>같은 문제다. 텍스트 분석은 회귀분석의 더미 불균형 문제를 단어 수만큼 곱해놓은 셈이다.</strong> 이 문제를 본질적으로 해결한 것이 단어 임베딩이다 - sparse 5만 차원 더미를 dense 300차원 연속 벡터로 압축한다.

### TF-IDF (Term Frequency - Inverse Document Frequency)

BoW의 약점 중 하나는 흔한 단어의 영향이 너무 큰 것이다. TF-IDF는 이 문제에 가중치를 도입한다.

$$\text{tf-idf}(w, d) = \text{tf}(w, d) \times \log\frac{N}{\text{df}(w)}$$

- $\text{tf}(w, d)$: 문서 $d$에서 단어 $w$의 빈도.
- $N$: 전체 문서 수.
- $\text{df}(w)$: 단어 $w$를 포함한 문서 수.
- $\log(N / \text{df}(w))$: 단어 $w$가 <strong>희귀할수록 커지는 가중치</strong>. 모든 문서에 나오는 단어는 $\log 1 = 0$으로 떨어진다.

해석은 직관적이다 - "이 문서에는 자주 나오면서, 전체 코퍼스에서는 드물게 나오는 단어"가 그 문서의 특징적 단어다. TF-IDF는 BoW를 완전히 대체하진 않고, BoW에 적용되는 표준적인 가중치 보정 기법이다.

### BoW/TF-IDF의 근본 한계

TF-IDF는 BoW의 sparse 문제를 완화하지만, <strong>단어 사이 의미 관계를 표현하지 못한다는 근본 한계는 그대로</strong>다.

BoW 공간에서 단어 $i$와 단어 $j$의 거리는 $i \neq j$이기만 하면 동일하다.

$$d_{\text{BoW}}(\text{사과}, \text{오렌지}) = d_{\text{BoW}}(\text{사과}, \text{비행기}) = d_{\text{BoW}}(\text{사과}, \text{민주주의})$$

말이 안 된다. <strong>의미적으로 가까운 단어는 벡터 공간에서도 가까워야 한다</strong>. 이 요구를 충족시키는 것이 단어 임베딩이다.

## 8. 단어 임베딩 (Word Embedding) - 2세대의 혁신

### 분포 가설 (Distributional Hypothesis)

1957년 언어학자 J.R. Firth의 한 줄로 요약된다.

> "You shall know a word by the company it keeps."
> (단어의 의미는 그것과 함께 출현하는 단어들에 의해 결정된다.)

"사과"의 의미를 알고 싶으면, "사과"가 어떤 단어들과 함께 등장하는지 보면 된다. "먹다", "달다", "빨갛다", "과일", "껍질"과 함께면 과일로서의 사과, "잘못", "용서", "죄송"과 함께면 사죄로서의 사과.

여기서 자연스러운 발상 - <strong>각 단어를 "그 단어가 어떤 단어들과 함께 등장하는가"의 패턴으로 표현하자</strong>. 이 패턴을 고차원 벡터로 인코딩한 것이 단어 임베딩이다.

### 잠깐 - Softmax와 Logistic 회귀의 관계

다음 식에서 등장할 <strong>softmax</strong> 함수를 먼저 짚고 가자. softmax는 학부에서 배운 <strong>logistic 회귀의 다중 클래스 일반화</strong>이고, word2vec뿐 아니라 거의 모든 현대 신경망(BERT, LLM 포함)의 출력층에서 쓰인다.

<strong>출발 - 종속변수가 binary일 때 OLS는 왜 안 되는가</strong>

종속변수가 0/1 이진(binary)인 경우, 예컨대 "이 응답자가 후보 A에 투표했는가(1) 안 했는가(0)"를 설명변수 $X$로 예측하는 상황을 생각하자. OLS를 그대로 쓰면 다음 문제들이 생긴다.

- <strong>예측값이 0과 1을 벗어난다.</strong> $\hat{Y} = 1.3$이나 $\hat{Y} = -0.2$ 같은 값이 나오면 확률로 해석할 수 없다.
- <strong>오차항이 등분산이 아니다.</strong> $Y$가 0/1만 가지므로 분산이 $X$에 따라 체계적으로 변한다 (구조적 이분산).
- <strong>선형 관계 가정이 비현실적이다.</strong> 확률은 0과 1에 가까워질수록 변화가 둔해지는 비선형 관계가 자연스럽다.

이 문제들을 해결하기 위해 <strong>logistic 회귀</strong>가 등장한다.

<strong>Logistic 회귀 - 선형 결합을 (0, 1) 확률로 짜내기</strong>

logistic 회귀의 식은 다음과 같다.

$$P(Y_i = 1 \mid X_i) = \sigma(\beta_0 + \beta_1 X_i) = \frac{1}{1 + e^{-(\beta_0 + \beta_1 X_i)}}$$

여기서 $\sigma(\cdot)$가 <strong>시그모이드(sigmoid) 함수</strong>다. 시그모이드는 실수 전체를 입력으로 받아 (0, 1) 사이 값을 출력한다.

- 입력이 매우 크면 (양수, $+\infty$ 쪽) → 출력이 1에 수렴.
- 입력이 0이면 → 출력이 정확히 0.5.
- 입력이 매우 작으면 (음수, $-\infty$ 쪽) → 출력이 0에 수렴.

즉 시그모이드는 <strong>"선형 결합($\beta_0 + \beta_1 X$)이라는 자유로운 실수를 (0,1) 확률 구간으로 부드럽게 짜내는 변환"</strong>이다. 그 결과 우리는 "확률"을 모델링하면서도 회귀계수의 친숙한 해석(설명변수가 효과를 갖는 방향과 크기)을 유지할 수 있다. 이게 종속변수가 binary일 때 OLS 대신 logistic 회귀를 쓰는 이유다.

<strong>Softmax - 클래스가 두 개 이상일 때의 일반화</strong>

logistic 회귀는 클래스가 2개(0/1)인 경우다. 클래스가 3개 이상(예: 긍정/부정/중립의 3-class 감성분류, 또는 어휘 5만 단어 중 하나를 고르는 단어 예측)일 때 일반화한 것이 <strong>softmax</strong>다.

$$\text{softmax}(\vec{z})_i = \frac{e^{z_i}}{\sum_{j=1}^{K} e^{z_j}}$$

각 항을 풀면 - $\vec{z}$는 $K$개의 "점수"(실수, 보통 신경망의 마지막 선형 결합 결과). $z_i$가 클수록 클래스 $i$가 정답일 가능성이 높다는 것을 나타내는 raw score다. softmax는 이 점수들을 <strong>합이 1이 되는 확률 분포</strong>로 짜낸다.

세 가지 핵심 성질:

- <strong>출력의 합이 1.</strong> $\sum_i \text{softmax}(\vec{z})_i = 1$ → "확률 분포"로 해석할 수 있다.
- <strong>$z_i$가 클수록 출력이 1에 가까워지고, 작을수록 0에 가까워진다.</strong>
- <strong>지수함수 $e^{z_i}$를 쓰는 이유</strong> - (1) 음수 점수도 양수 확률로 만들고, (2) 점수 차이가 클수록 확률 차이가 비선형으로 확대된다 (winner-takes-most 경향).

<strong>logistic이 softmax의 특수 케이스</strong>다. 클래스가 2개일 때 softmax 공식을 풀면 정확히 시그모이드와 같아진다.

| | 클래스 수 | 함수 | 출력 |
|--|---------|------|------|
| Logistic 회귀 | 2 (binary) | 시그모이드 $\sigma(z) = 1/(1+e^{-z})$ | (0, 1) 사이 한 값 |
| Softmax 회귀 (multinomial logistic) | $K \geq 2$ | softmax | 합이 1인 $K$차원 확률 벡터 |

<strong>왜 이게 word2vec과 관련 있는가</strong> - skip-gram의 출력층은 "중심 단어가 주어졌을 때 어휘 5만 개 중 어느 단어가 주변에 나타날 확률"이다. 즉 <strong>5만-class softmax</strong>다. 학부에서 배운 logistic 회귀의 직접적 확장이다. 신경망이 새롭게 발명한 게 아니라, 통계학에서 이미 쓰던 도구를 신경망의 마지막 층에 그대로 가져다 붙인 것이다.

이 관점이 중요한 이유 - <strong>이후 등장하는 BERT, LLM의 모든 출력층도 결국 softmax</strong>다. "다음 토큰 확률 분포"를 뱉는 LLM의 마지막 단계도 어휘 크기만큼의 softmax. 학부 통계와 최신 LLM이 같은 함수로 끝난다.

이제 word2vec의 식으로 돌아가자.

### Word2Vec - 신경망을 표현 학습에 써먹기

2013년 Mikolov의 word2vec이 임베딩 시대의 결정적 분기점이다. 핵심 아이디어와 신경망 구조를 정확히 짚자.

<strong>Skip-gram의 학습 목표</strong>는 다음 확률을 최대화하는 것이다.

$$\arg\max_{\theta} \prod_{t=1}^{T} \prod_{-c \leq j \leq c, j \neq 0} P_\theta(w_{t+j} \mid w_t)$$

각 항을 풀면 - $w_t$가 중심 단어, $w_{t+j}$가 윈도우 $c$ 이내의 주변 단어. $\theta$는 모델 파라미터. "중심 단어가 주어졌을 때 주변 단어가 나타날 확률"을 코퍼스 전체에 걸쳐 최대로 만드는 파라미터를 찾는다.

조건부 확률 $P_\theta(w_O | w_I)$는 다음 softmax로 정의된다.

$$P_\theta(w_O \mid w_I) = \frac{\exp(\vec{u}_{w_O}^\top \vec{v}_{w_I})}{\sum_{w=1}^{V} \exp(\vec{u}_w^\top \vec{v}_{w_I})}$$

여기서 $\vec{v}_{w_I}$는 입력(중심) 단어의 임베딩 벡터, $\vec{u}_{w_O}$는 출력(주변) 단어의 임베딩 벡터. $V$는 어휘 크기.

### 왜 이게 "신경망을 단순하게 써먹는" 패턴인가

이 학습 목표는 다음과 같은 매우 단순한 신경망으로 구현된다.

![Skip-gram 신경망 구조와 학습 트릭](images/word2vec_network.svg)

- <strong>입력층</strong>: 중심 단어의 one-hot 벡터. 어휘 크기 $V$가 5만이면 5만 차원, 그 중 하나만 1이고 나머지는 0.
- <strong>은닉층(중간층)</strong>: 입력에 가중치 행렬 $W_1$ ($V \times d$, 여기서 $d$는 임베딩 차원, 보통 300)을 곱한 dense 벡터. <strong>활성함수가 없다(=선형)</strong>.
- <strong>출력층</strong>: 은닉층 벡터에 다른 가중치 행렬 $W_2$ ($d \times V$)를 곱한 뒤 softmax. 출력은 $V$차원 확률 분포 (= 각 단어가 주변 단어일 확률).

학습은 출력층의 softmax 분포가 실제 주변 단어 분포에 가까워지도록 $W_1$, $W_2$를 역전파(backpropagation)로 갱신한다.

여기서 결정적 통찰 - <strong>학습이 끝난 뒤, 우리가 원하는 것은 출력층이 아니라 가운데 행렬 $W_1$이다</strong>.

입력이 one-hot이라 입력 단어 $w_I$가 어휘의 $i$번째 위치라면, 은닉층은 단순히 $W_1$의 $i$번째 <strong>행</strong>이 된다. 즉:

$$W_1 \text{의 $i$번째 행} = \text{단어 $i$의 임베딩 벡터}$$

다시 말해, <strong>$W_1$은 "어휘 크기 × 임베딩 차원" 크기의 룩업 테이블</strong>이고, 학습이 끝나면 각 행이 곧 그 단어의 임베딩이다. 출력층 $W_2$와 그 뒤의 softmax는 <strong>학습이 끝나면 버린다</strong>. 더 정확히 말하면, 출력층의 역할은 "어떻게든 학습 신호를 만들어내는 보조 장치"일 뿐이고, 우리가 가져갈 결과물은 $W_1$의 각 행이다.

이 패턴이 word2vec의 진짜 의의다.

- <strong>표면적 학습 목표</strong>: 주변 단어 예측 (사실 별로 흥미롭지 않은 task).
- <strong>실제로 우리가 원하는 것</strong>: 그 학습 과정의 부산물(by-product)인 가중치 행렬.
- <strong>핵심 발상</strong>: 어떤 보조 task(auxiliary task)를 풀게 함으로써 신경망이 의미 있는 내부 표현을 학습하도록 강제한다.

이 발상이 2010년대 후반 딥러닝 전반에 퍼진 <strong>표현 학습(representation learning)</strong> 패러다임의 시초다. BERT의 "masked language modeling"(빈칸 채우기)이나 컴퓨터 비전의 self-supervised learning도 모두 같은 발상이다 - <strong>보조 task를 통해 표현을 학습하고, 학습된 표현을 다른 곳에 가져다 쓴다</strong>.

또 하나 강조할 점 - <strong>word2vec의 신경망은 매우 단순하다</strong>. 은닉층이 1개이고, 비선형 활성함수도 없다(또는 매우 단순하다). 그럼에도 의미 기하가 나오는 것이 word2vec의 충격이었다 - 깊은 신경망이 아니어도, 분포 가설을 신경망 형태로 풀기만 하면 의미 표현이 떨어진다는 사실.

### 임베딩이 왜 혁신인가 - 의미가 기하(geometry)로 표현된다

word2vec이 가져온 충격은 단순히 "단어를 벡터로 만든다"가 아니다. <strong>의미적 관계가 벡터 공간의 기하적 관계로 나타난다</strong>는 것이 핵심이다.

가장 유명한 결과 - 벡터 산술이 의미적 유추(analogy)와 일치한다.

$$\vec{v}_{\text{king}} - \vec{v}_{\text{man}} + \vec{v}_{\text{woman}} \approx \vec{v}_{\text{queen}}$$

이게 단순한 트릭이 아니다. "king - man" 벡터가 사실상 "왕족성(royalty)"이라는 의미 축을 표현하고, 그걸 "woman"에 더하면 "queen"이 나온다. <strong>의미 축이 벡터 공간의 방향으로 존재한다</strong>.

또 cosine similarity가 의미적 유사도를 잰다.

$$\cos(\vec{v}_a, \vec{v}_b) = \frac{\vec{v}_a \cdot \vec{v}_b}{\|\vec{v}_a\|\,\|\vec{v}_b\|}$$

"사과"와 "오렌지"의 cosine similarity는 "사과"와 "비행기"의 것보다 훨씬 크다. BoW에서는 절대 잡을 수 없었던 관계다.

### word2vec의 한계와 BERT의 등장

word2vec(과 그 후속인 GloVe)에는 결정적 약점이 있다 - <strong>같은 표기 단어는 무조건 같은 벡터</strong>. "사과(과일)"과 "사과(사죄)"의 문맥이 코퍼스 안에서 섞이므로, 결과는 두 의미가 평균된 어중간한 하나의 벡터.

2018년 BERT(Devlin et al.)가 이 한계를 깼다 - <strong>임베딩이 단어가 아니라 "그 단어가 등장한 문장 전체의 함수"가 된다</strong>.

- "사과를 먹었다" 안의 "사과" → 벡터 A
- "사과를 했다" 안의 "사과" → 벡터 B
- A ≠ B. 같은 표기지만 문맥에 따라 다른 벡터 (contextual embedding).

BERT는 또한 문서·문장 단위 임베딩도 만들어낸다. 특히 <strong>Sentence-BERT</strong>(2019)는 문장/문서를 하나의 고정 길이 벡터로 매핑하도록 fine-tuning된 모델이다. 댓글 한 개 = 768차원 벡터 한 개로 변환된다.

| 표현 | 단위 | 문맥 처리 | 차원 | 사용처 |
|------|------|----------|------|--------|
| BoW / TF-IDF | 코퍼스 어휘 | 못 함 | 수만 | 1세대 방식 |
| word2vec / GloVe | 단어 | 못 함 | 100~300 | 단어 유사도 |
| BERT (단어) | 단어 | 함 | 768~1024 | 문맥 의존 단어 분석 |
| Sentence-BERT | 문장/문서 | 함 | 768~1024 | <strong>현대 텍스트 분석의 표준 입력</strong> |

<strong>Sentence-BERT 류 문장 임베딩이 현대 텍스트 분석의 표준 입력</strong>이다. 분류든 군집화든, 시작점은 거의 항상 이거다.

## 9. Classification (분류) - Top-down 작업

### 작동 원리

분류 문제의 본질은 <strong>"문서 임베딩 공간에서 결정경계(decision boundary)를 그리는 것"</strong>이다. 라벨된 학습 데이터로 결정경계를 학습하고, 새 문서가 들어오면 그 경계의 어느 쪽에 떨어지는지를 보고 라벨을 예측한다.

```mermaid
flowchart LR
    A["문서 → 임베딩 벡터"] --> B["라벨된 학습 데이터<br/>(긍정/부정/중립)"]
    B --> C["결정경계 학습"]
    C --> D["새 문서 → 임베딩"]
    D --> E["결정경계의 어느 쪽?<br/>→ 라벨 예측"]
```

핵심은 <strong>"한 문서씩 독립적으로 판단"</strong>한다는 점이다. 댓글 1번을 분류할 때 댓글 2번을 볼 필요가 없다 (local decision). 이 사실이 뒤에서 군집화와의 결정적 차이를 만든다.

### 대표 알고리즘들

| 알고리즘 | 핵심 아이디어 | 장점 | 단점 |
|---------|-------------|------|------|
| <strong>Naive Bayes</strong> | 단어별 등장 확률 + 베이즈 정리 | 빠름, 단순, 적은 데이터에서도 작동 | 단어 독립 가정이 비현실적 |
| <strong>Logistic Regression</strong> | 특징의 선형 결합 → 시그모이드 → 확률 | 해석 가능 (계수 = 단어의 클래스 기여도) | 비선형 관계 못 잡음 |
| <strong>SVM</strong> | 두 클래스 사이 마진 최대화 초평면 | 고차원에서 안정적 | 다중 클래스 처리 번거로움 |
| <strong>Random Forest / GBM</strong> | 결정 트리 앙상블 | 비선형, robust | 텍스트 sparse 특징에 덜 적합 |
| <strong>Neural Net (BERT fine-tuning)</strong> | 임베딩 + 분류층 end-to-end 학습 | 가장 강력 | 데이터·연산 비용 큼 |

### 평가 - Accuracy만 보면 안 되는 이유와 1종/2종 오류

분류 모델 평가에서 가장 흔한 실수가 <strong>정확도(accuracy)만 보고 끝내는 것</strong>이다. 라벨이 불균형(imbalanced)할 때 정확도는 거의 무의미하다.

예: 빈정거림 댓글 탐지 - 전체 댓글 중 빈정거림이 5%라면, "전부 비빈정거림"이라고 답하는 모델도 정확도 95%가 나온다. 그러나 빈정거림을 하나도 못 잡았으니 쓸모없다.

이걸 통계학에서 배운 <strong>1종 오류(Type I error)와 2종 오류(Type II error)</strong>의 언어로 정확히 다시 짚자.

<strong>혼동 행렬 (Confusion Matrix)</strong>

이진 분류에서 한 댓글의 실제 라벨과 예측 라벨 조합은 네 가지다. "관심 있는 라벨"을 양성(positive), 그 외를 음성(negative)이라 하자. 예: 빈정거림 탐지에서 빈정거림 = 양성.

| | 예측: 양성 | 예측: 음성 |
|--|----------|----------|
| <strong>실제: 양성</strong> | True Positive (TP) | False Negative (FN) <br/> = <strong>2종 오류</strong> |
| <strong>실제: 음성</strong> | False Positive (FP) <br/> = <strong>1종 오류</strong> | True Negative (TN) |

용어 정리:

- <strong>1종 오류 (Type I error, false positive, α)</strong>: 실제로는 양성이 <strong>아닌데</strong> 양성이라고 잘못 예측. "잘못된 검출(false alarm)". 통계학의 가설 검정에서 "$H_0$가 참인데 기각하는 오류"와 같은 개념.
- <strong>2종 오류 (Type II error, false negative, β)</strong>: 실제로 양성<strong>인데</strong> 놓침. "검출 실패(miss)". 가설 검정에서 "$H_0$가 거짓인데 기각하지 못하는 오류"와 같은 개념.

이 두 오류로부터 핵심 지표들이 도출된다.

| 지표 | 공식 | 의미 |
|------|------|------|
| Accuracy | $\frac{TP+TN}{TP+TN+FP+FN}$ | 전체 중 맞춘 비율. 불균형에 약함 |
| <strong>Precision (정밀도)</strong> | $\frac{TP}{TP+FP}$ | "양성으로 예측한 것 중 진짜 양성 비율". <strong>1종 오류가 적을수록 큼</strong> |
| <strong>Recall (재현율) = Power = $1-\beta$</strong> | $\frac{TP}{TP+FN}$ | "진짜 양성 중 모델이 잡은 비율". <strong>2종 오류가 적을수록 큼</strong> |
| F1 | $\frac{2 \cdot P \cdot R}{P+R}$ | Precision과 Recall의 조화평균 |

<strong>두 오류는 보통 trade-off 관계다.</strong> 모델이 양성 판정 기준(threshold)을 낮추면 양성으로 더 많이 예측하니 recall은 올라가지만(2종 오류 감소), false positive도 늘어 precision이 떨어진다(1종 오류 증가). 반대로 기준을 엄격하게 하면 precision은 오르지만 recall이 떨어진다.

### 어느 오류를 더 두려워해야 하는가는 연구 목적에 달려 있다

이 부분이 학생들이 가장 자주 놓치는 지점이다. <strong>1종 오류와 2종 오류 중 어느 쪽을 더 줄여야 하는가는 통계가 답하지 않는다 - 연구 목적과 도메인이 결정한다</strong>.

| 상황 | 양성(positive)의 정의 | 더 무서운 오류 | 우선 지표 |
|------|---------------------|-------------|----------|
| <strong>빈정거림 탐지 (사회연구)</strong> | 빈정거림 댓글 | 2종 오류 (빈정거림을 놓침) | <strong>Recall 우선</strong> |
| <strong>스팸 필터</strong> | 스팸 메일 | 1종 오류 (정상 메일을 스팸으로) | <strong>Precision 우선</strong> |
| <strong>혐오 표현 탐지 (콘텐츠 모더레이션)</strong> | 혐오 표현 | 도메인 따라 다름 | Recall vs Precision 균형 |
| <strong>의료 진단 보조 (암 검출)</strong> | 암 있음 | 2종 오류 (놓치면 환자 죽음) | <strong>Recall 우선</strong> |
| <strong>형사 재판 (유죄 판정)</strong> | 유죄 | 1종 오류 (무고한 사람 처벌) | <strong>Precision 우선</strong> |

핵심은 - <strong>"오류의 비대칭 비용"</strong>을 먼저 생각하라는 것이다. 빈정거림 한 건을 놓치는 비용과, 빈정거림이 아닌 댓글에 잘못 라벨을 붙이는 비용은 같지 않다. 어느 쪽이 더 비싼지는 분석가가 도메인 지식으로 판단해야 한다.

이 판단은 <strong>3부에서 다룬 인과추론과 같은 구조</strong>다. "이 추정량이 어떤 가정 하에서 어떤 양을 식별하는가"가 통계가 아니라 분석가의 논증이듯, "어느 오류를 줄여야 하는가"도 통계가 아니라 도메인 판단이다. <strong>Accuracy 한 숫자에 답을 맡기지 마라</strong>.

### ROC와 AUC

분류 모델은 보통 "양성일 확률"을 뱉고, 임계값(threshold)을 정해서 양성/음성으로 변환한다. 임계값을 0에서 1로 움직여가며 (recall, false positive rate)의 쌍을 그리면 <strong>ROC curve</strong>가 된다. 그 아래 넓이가 <strong>AUC (Area Under Curve)</strong>이고, 이는 임계값 선택과 무관한 분류 성능 지표다.

다만 AUC도 도메인 비용 비대칭을 자동으로 반영하지 않는다. 결국 1종/2종 오류 트레이드오프는 분석가가 명시적으로 선택해야 한다.

## 10. Clustering (군집화) - Bottom-up 작업

### 작동 원리

군집화는 분류와 본질이 다르다. <strong>"모든 문서들 사이의 관계를 동시에 고려해 그룹을 찾아내는 작업"</strong>이다. 라벨이 없으므로 알고리즘은 "어떤 문서들이 서로 가까운가"라는 데이터 자체의 구조만으로 그룹을 만든다.

핵심은 <strong>거리/유사도 함수</strong>다. 임베딩 공간에서 cosine similarity나 Euclidean distance가 표준이다.

### 대표 알고리즘들

<strong>k-means</strong>

가장 단순한 알고리즘. 최적화 목표는 다음과 같다.

$$\min_{\{C_k\}} \sum_{k=1}^{K} \sum_{i \in C_k} \|\vec{x}_i - \vec{\mu}_k\|^2$$

각 클러스터 $C_k$의 중심 $\vec{\mu}_k$에서 멤버까지 거리 제곱 합을 최소화. 알고리즘은 (1) 각 점을 가장 가까운 중심에 배정, (2) 각 중심을 멤버 평균으로 갱신, 을 반복.

한계 - (i) $K$를 미리 지정해야 한다, (ii) 군집이 구형(spherical)이라 가정, (iii) outlier에 약함, (iv) 초기값 민감.

<strong>Hierarchical Clustering (Agglomerative)</strong>

각 점을 단일 군집으로 시작해 가장 가까운 두 군집을 차례로 합쳐가는 방식. 덴드로그램(dendrogram)으로 표현되며, 원하는 높이에서 잘라서 군집 수를 정할 수 있다. $K$를 미리 정할 필요 없음. 단점은 <strong>모든 점 쌍의 거리 계산 → $O(n^2)$ 메모리·시간</strong>. 댓글 10만 건이면 100억 쌍 - 사실상 불가능.

<strong>DBSCAN / HDBSCAN - 밀도 기반</strong>

DBSCAN은 "점들의 밀도가 높은 지역"을 군집으로 본다. HDBSCAN은 DBSCAN의 개선판으로 밀도 임계값을 데이터에서 자동 추정.

- $K$를 미리 지정할 필요 없다.
- 군집의 모양에 가정 없음 (비구형 OK).
- <strong>"노이즈"를 명시적으로 분리</strong> - 어느 군집에도 속하지 않는 outlier를 알아낸다.

댓글 같은 노이즈 많은 텍스트에서 HDBSCAN은 k-means보다 압도적으로 잘 작동한다.

<strong>현대의 표준 파이프라인 - 임베딩 + UMAP + HDBSCAN</strong>

```mermaid
flowchart LR
    A["문서들"] --> B["<b>Sentence-BERT</b><br/>768차원 임베딩"]
    B --> C["<b>UMAP</b><br/>차원 축소<br/>(768 → 5~50차원)"]
    C --> D["<b>HDBSCAN</b><br/>밀도 기반 군집화"]
    D --> E["군집 + 노이즈 라벨"]
```

UMAP을 끼우는 이유 - 임베딩 공간이 매우 고차원이라 그대로 HDBSCAN을 돌리면 차원의 저주(curse of dimensionality)로 거리 측정이 무너진다. UMAP으로 5~50차원으로 줄인 뒤 HDBSCAN을 돌리는 것이 표준. 이 조합을 패키지화한 것이 <strong>BERTopic</strong>이다.

### 군집화는 항상 분류보다 어렵다

학생들이 종종 "군집화가 분류보다 쉽다"고 오해한다 - 라벨이 필요 없으니까. 실은 반대다.

- 분류는 라벨된 정답이 있어 평가가 쉽다. F1, AUC 같은 명확한 지표.
- 군집화는 정답이 없다. "이 군집들이 좋은가?"를 객관적으로 평가할 방법이 본질적으로 없다. silhouette score 같은 내부 지표는 휴리스틱일 뿐.

또한 분류는 한 점씩 독립으로 판단하지만, 군집화는 모든 점의 관계를 동시에 고려해야 한다 - <strong>전역적(global) 결정</strong>. 이 차이가 다음 절의 LLM 비교에서 결정적인 역할을 한다.

## 11. LLM 시대의 분류 - Zero-shot의 충격

### Zero-shot Classification이란

3세대 - LLM 시대로 넘어가자. 2022년 이후 LLM(GPT, Claude, Gemini 등)이 텍스트 분석에 가져온 가장 큰 변화는 <strong>분류 작업의 zero-shot 처리</strong>다.

전통적 분류 파이프라인 (1) 라벨된 학습 데이터 수집, (2) 모델 학습, (3) 새 데이터 적용. Zero-shot은 1, 2단계를 <strong>완전히 건너뛴다</strong>. LLM에게 그냥 묻는다.

> 다음 댓글을 [긍정 / 부정 / 중립] 중 하나로 분류하라.
>
> 댓글: "ㅋㅋㅋ 이게 진짜 정치냐 코미디지"
>
> 답:

LLM은 빈정거림과 정치 풍자의 뉘앙스를 잡아내서 "부정"이라고 답한다. <strong>학습 데이터 0개로 분류가 끝난다</strong>.

### 무엇이 사라졌나

1. <strong>사전 구축 불필요</strong>. LIWC, 감성사전 등을 만들 이유가 없다.
2. <strong>라벨링 불필요</strong>. 사람이 수천 건의 댓글에 손으로 라벨 붙이는 작업 없어짐.
3. <strong>모델 학습 불필요</strong>. fine-tuning, hyperparameter tuning 없어짐.

또한 LLM은 사전 기반이 절대 잡지 못한 것들을 잡는다.

- <strong>빈정거림과 반어법</strong>: "잘한다 잘한다 ㅋㅋ" → 부정.
- <strong>맥락 의존적 의미</strong>: "이 정도면 됐다" → 화자 어조에 따라 긍정/체념.
- <strong>커뮤니티 은어</strong>: "ㅈㄴ", "ㅂㅅ", "팩폭".
- <strong>다중 분류·다국어·도메인 전환</strong>: 프롬프트만 바꾸면 같은 모델로 처리.

분류뿐 아니라 <strong>NER, 요약, QA 같은 작업도 LLM이 zero-shot으로 한다</strong>. "다음 댓글에서 인명을 모두 추출하라" - 끝. "다음 인터뷰를 3문장으로 요약하라" - 끝. 3세대 LLM 시대에 들어서 2세대 도구로 따로따로 다루던 작업들이 한 모델로 통합됐다.

### LLM 분류의 비용

댓글 1개당 LLM 호출 1회. 10만 건이면 10만 호출. 현재 작은 모델(GPT-4o-mini, Haiku 류)로는 댓글 1만 건당 수 천 원 수준에서 처리 가능. 시간은 병렬 처리하면 수십 분.

<strong>분류 작업에 한해서, LLM은 기존 기법들을 사실상 대체했다</strong>. 학부 캡스톤 수준에서도 이제 BERT fine-tuning을 직접 할 이유가 거의 없다.

---

## 12. 그런데 군집화는 왜 LLM이 못 하는가 - $O(n^2)$의 벽

### 핵심 질문

> 분류는 LLM zero-shot으로 끝났다. 그럼 군집화도 LLM에게 시키면 되지 않나?

직관적으로는 그럴 듯하다. 그러나 <strong>이게 불가능하다</strong>. 그리고 그 불가능성의 이유는 LLM의 성능 한계가 아니라, <strong>군집화 작업 자체의 계산 복잡도 구조</strong>에 있다.

### Local vs Global - 분류와 군집화의 결정적 비계

| | Classification (분류) | Clustering (군집화) |
|--|---------------------|-------------------|
| 의사 결정의 단위 | <strong>한 샘플씩 독립</strong> | <strong>모든 샘플 쌍의 관계 동시에</strong> |
| 결정 종류 | Local decision | Global optimization |
| 한 샘플 처리에 필요한 정보 | 그 샘플 + 라벨 후보 | 그 샘플 + 다른 모든 샘플 |
| LLM 호출 횟수 (n개 샘플) | $O(n)$ | $O(n^2)$ (pairwise comparison 시) |

분류는 한 댓글씩 LLM에 던지면 끝난다 - local decision.

군집화는 다르다. "댓글 1번과 2번이 같은 군집인가"를 결정하려면 두 댓글을 비교해야 한다. "댓글 1번이 어느 군집에 속하는가"를 결정하려면 1번과 다른 모든 댓글의 관계를 고려해야 한다 - global optimization.

### Pairwise Comparison의 비용

LLM으로 군집화를 시도하면 가장 자연스러운 접근은 "각 댓글 쌍에 대해 같은 군집인지 LLM에게 묻기"다. 비교 횟수는:

$$\binom{n}{2} = \frac{n(n-1)}{2} = O(n^2)$$

| 데이터 크기 $n$ | Pairwise 비교 수 |
|----------------|----------------|
| 100 | 약 5,000 |
| 1,000 | 약 500,000 |
| 10,000 | 약 50,000,000 |
| 100,000 | 약 5,000,000,000 |

댓글 10만 건의 군집화를 pairwise LLM 호출로 하려면 <strong>50억 번 호출</strong>이 필요하다. 호출당 $0.0001만 잡아도 50만 달러. 초당 100건 처리해도 580일.

데이터가 늘어날수록 비용은 <strong>제곱으로 폭증</strong>한다. 이게 $O(n^2)$의 의미다.

### "LLM이 더 똑똑해지면 해결되지 않나?" - 아니다

이것은 LLM의 한계가 아니라 <strong>군집화 문제 자체의 본질</strong>에서 오는 한계다. 어떤 알고리즘을 쓰든 군집화는 모든 점 쌍의 관계를 고려해야 한다. LLM이 100배 빨라져도 $O(n^2)$의 본질은 그대로다.

전체를 한 프롬프트에 다 넣는 접근도 안 된다. LLM 컨텍스트 윈도우는 유한(현재 최대 100만 토큰 수준)하고, 댓글 10만 건은 윈도우에 안 들어간다. 게다가 LLM은 긴 컨텍스트에서 일관된 군집 구조를 유지하지 못한다.

### 군집화는 여전히 임베딩 기반이다

```mermaid
flowchart TD
    A["<b>대규모 텍스트 군집화</b>"] --> B["<b>1세대 (사전·빈도): X</b><br/>의미 표현 불가"]
    A --> C["<b>2세대 (임베딩): O</b><br/>Sentence-BERT + UMAP + HDBSCAN<br/>= 현재의 표준"]
    A --> D["<b>3세대 (LLM 전수 호출): X</b><br/>O(n²) 비용으로 불가능"]
    A --> E["<b>실전 권장: 2.5세대 하이브리드</b><br/>임베딩+HDBSCAN으로 군집 발견<br/>+ LLM으로 군집 라벨링/요약"]

    classDef bad fill:#ffcdd2,stroke:#c62828,color:#000
    classDef ok fill:#c8e6c9,stroke:#2e7d32,color:#000
    classDef best fill:#bbdefb,stroke:#0d47a1,color:#000
    class B,D bad
    class C ok
    class E best
```

핵심은 <strong>두 시대를 결합하는 것</strong>. 임베딩 기반 군집화로 군집 구조 자체는 빠르게 발견한 뒤, 각 군집의 의미 라벨링·요약·해석을 LLM에게 시킨다. LLM 호출 수가 $O(n)$이 아닌 $O(K)$($K$는 군집 수, 보통 수십)로 떨어진다.

## 13. 정리 - 세 작업, 세 시대의 종합표

### 종합 매트릭스

| | 사전·빈도 기반 (1세대) | 임베딩 기반 (2세대) | LLM 기반 (3세대) |
|--|---------------------|-------------------|------------------|
| <strong>분류 (Classification)</strong> | LIWC, 감성사전<br/>→ <strong>망함</strong> (맥락 못 봄) | BERT fine-tuning<br/>→ 강력하지만 데이터·연산 큼 | <strong>Zero-shot</strong><br/>→ 사실상 대체 |
| <strong>군집화 (Clustering)</strong> | LDA, 워드클라우드,<br/>텍스트 네트워크<br/>→ <strong>망함</strong> (의미 표현 불가) | Sentence-BERT+UMAP+HDBSCAN<br/>→ <strong>현재의 표준</strong> | <strong>불가능</strong><br/>($O(n^2)$ 비용) |
| <strong>생성 (요약·QA·번역)</strong> | 거의 다룰 수 없음 | 부분적 (seq2seq, BART 등) | <strong>완전 혁신</strong> (LLM의 핵심 영역) |

### 두 가지 핵심 메시지

1. <strong>분류는 LLM 시대로 이행 완료</strong>. 사전·BERT fine-tuning을 굳이 직접 할 이유가 줄어들었다. 학부 캡스톤에서는 LLM zero-shot이 첫 시도여야 한다.
2. <strong>군집화는 여전히 임베딩이 답</strong>. LLM이 보완할 수 있지만 대체할 수 없다. 군집 발견은 임베딩+HDBSCAN, 군집 해석은 LLM - 이 하이브리드가 현재의 표준.

    const slides = [];
    let buf = [];
    let currentSection = '';
    let currentSectionNum = '';
    let inTitle = true;
    let titleBuf = [];

    function flush() {
      if (buf.length > 0) {
        const text = buf.join('\n').trim();
        if (text) {

      const line = lines[i];

      // Title slide: collect until first ---
      if (inTitle) {
        if (/^---$/.test(line.trim())) {
          inTitle = false;
          slides.push({ type: 'title', content: titleBuf.join('\n').trim() });
          continue;
        }
        titleBuf.push(line);
        continue;
      }

      // Section divider: ## N. ...
      const sectionMatch = line.match(/^## (\d+)\.\s+(.*)/);
      if (sectionMatch) {
        flush();
        currentSectionNum = sectionMatch[1];
        currentSection = sectionMatch[2];
        slides.push({ type: 'divider', section: currentSection, sectionNum: currentSectionNum });
        continue;
      }

      // --- separator between sections
      if (/^---$/.test(line.trim())) {
        flush();
        continue;
      }

      // Subsection ### starts new slide
      if (/^### /.test(line)) {
        flush();
        buf.push(line);
        continue;
      }

      buf.push(line);

  function protectMath(md) {
    const store = [];
    let idx = 0;

    // Display math $$...$$
    md = md.replace(/\$\$([\s\S]*?)\$\$/g, (m) => {
      const key = '\x00DISP' + (idx++) + '\x00';
      store.push({ key, val: m });
      return key;
    });

    // Inline math $...$  (not $$)
    md = md.replace(/(?<!\$)\$(?!\$)([^\$\n]+?)\$(?!\$)/g, (m) => {
      const key = '\x00INLN' + (idx++) + '\x00';
      store.push({ key, val: m });
      return key;
    });

    return { md, store };
  }

  function protectMermaid(md) {
    const store = [];
    let idx = 0;
    md = md.replace(/```mermaid\n([\s\S]*?)```/g, (m, code) => {
      const key = '\x00MERM' + (idx++) + '\x00';
      store.push({ key, val: code });
      return key;
    });
    return { md, store };
  }

      html = html.split(key).join(val);
    }
    for (const { key, val } of mermaidStore) {
      html = html.split(key).join('<pre class="mermaid">' + val + '</pre>');
    }
    return html;

    const m2 = protectMermaid(m1.md);
    let html = marked.parse(m2.md);
    html = restoreAll(html, m1.store, m2.store);
    return html;

        '<h1>' + h1 + '</h1>' +
        '<h2>' + h2 + '</h2>' +

        '<div class="section-title">' + s.section + '</div></div>';

    }

    else el.classList.add('active');

    container.appendChild(el);

  });

      // Temporarily show all slides so mermaid can measure
      slideEls.forEach(el => { el.style.display = 'flex'; el.style.visibility = 'hidden'; });
      try { await mermaid.run({ nodes: mermaidEls }); } catch(e) { console.warn('Mermaid error:', e); }
      slideEls.forEach((el, i) => {
        el.style.visibility = '';
        if (i !== currentSlide) { el.style.display = 'none'; el.classList.remove('active'); }
        else { el.style.display = 'flex'; el.classList.add('active'); }
      });
    }
  }

  // ===== 6. NAVIGATION =====
  let currentSlide = 0;
  const total = slideEls.length;

  const counterEl = document.getElementById('slide-counter');
  const progressEl = document.getElementById('progress-fill');
  const sectionEl = document.getElementById('section-indicator');

  function updateUI() {
    counterEl.textContent = (currentSlide + 1) + ' / ' + total;
    progressEl.style.width = ((currentSlide + 1) / total * 100) + '%';
    const sec = slideEls[currentSlide].dataset.sectionNum;
    const secName = slideEls[currentSlide].dataset.section;
    if (sec) sectionEl.textContent = sec + '. ' + secName;

    // White counter on dark divider slides
    const isDivider = slideEls[currentSlide].classList.contains('slide-divider');
    counterEl.style.color = isDivider ? 'rgba(255,255,255,0.5)' : '';
    sectionEl.style.color = isDivider ? 'rgba(255,255,255,0.4)' : '';
  }

  function goTo(n) {
    if (n < 0 || n >= total || n === currentSlide) return;
    slideEls[currentSlide].style.display = 'none';
    slideEls[currentSlide].classList.remove('active');
    currentSlide = n;
    slideEls[currentSlide].style.display = 'flex';
    slideEls[currentSlide].classList.add('active');
    slideEls[currentSlide].scrollTop = 0;
    updateUI();
  }

  window.nextSlide = function() { goTo(currentSlide + 1); };
  window.prevSlide = function() { goTo(currentSlide - 1); };

  // Keyboard
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ' || e.key === 'PageDown') {
      e.preventDefault(); nextSlide();
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'Backspace' || e.key === 'PageUp') {
      e.preventDefault(); prevSlide();
    } else if (e.key === 'Home') {
      e.preventDefault(); goTo(0);
    } else if (e.key === 'End') {
      e.preventDefault(); goTo(total - 1);
    }
  });

  // Click navigation removed - use keyboard arrows or nav buttons only

  // Touch swipe
  let touchStartX = 0;
  container.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
  container.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].screenX - touchStartX;
    if (Math.abs(dx) > 50) {
      if (dx < 0) nextSlide();
      else prevSlide();
    }
  }, { passive: true });

  // ===== 7. PAGE JUMP =====
  const pageJumpEl = document.getElementById('page-jump');
  const pageJumpInput = document.getElementById('page-jump-input');
  const pageJumpTotal = document.getElementById('page-jump-total');
  const pageJumpBtn = document.getElementById('page-jump-btn');

  pageJumpTotal.textContent = '/ ' + total;

  counterEl.addEventListener('click', (e) => {
    e.stopPropagation();
    counterEl.style.display = 'none';
    pageJumpEl.style.display = 'flex';
    pageJumpInput.value = '';
    pageJumpInput.focus();
  });

  function doJump() {
    const n = parseInt(pageJumpInput.value, 10);
    if (!isNaN(n) && n >= 1 && n <= total) {
      goTo(n - 1);
    }
    pageJumpEl.style.display = 'none';
    counterEl.style.display = '';
  }

  pageJumpBtn.addEventListener('click', doJump);
  pageJumpInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); doJump(); }
    if (e.key === 'Escape') { pageJumpEl.style.display = 'none'; counterEl.style.display = ''; }
    e.stopPropagation(); // prevent slide navigation while typing
  });
  pageJumpInput.addEventListener('keyup', (e) => e.stopPropagation());

  // Close jump box when clicking outside
  document.addEventListener('click', (e) => {
    if (pageJumpEl.style.display === 'flex' && !pageJumpEl.contains(e.target)) {
      pageJumpEl.style.display = 'none';
      counterEl.style.display = '';
    }
  });

  // ===== 8. INIT =====
  updateUI();
  renderSpecial();

})();
</script>
</body>
</html>
