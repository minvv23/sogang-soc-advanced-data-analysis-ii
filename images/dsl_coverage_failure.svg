<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'Noto Sans KR', Pretendard, sans-serif">
  <rect width="760" height="470" fill="#ffffff" rx="8"/>
  <text x="380" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#222">95% 신뢰구간이 진짜 값을 덮는 비율</text>
  <text x="380" y="60" text-anchor="middle" font-size="14" fill="#666">정직한 추론이라면 95%에 가까워야 한다</text>

  <!-- axes -->
  <line x1="110" y1="90" x2="110" y2="380" stroke="#adb5bd" stroke-width="2"/>
  <line x1="110" y1="380" x2="690" y2="380" stroke="#adb5bd" stroke-width="2"/>
  <g font-size="13" fill="#999">
    <line x1="110" y1="380" x2="690" y2="380" stroke="#e9ecef"/><text x="100" y="385" text-anchor="end">0</text>
    <line x1="110" y1="310" x2="690" y2="310" stroke="#e9ecef"/><text x="100" y="315" text-anchor="end">25</text>
    <line x1="110" y1="240" x2="690" y2="240" stroke="#e9ecef"/><text x="100" y="245" text-anchor="end">50</text>
    <line x1="110" y1="170" x2="690" y2="170" stroke="#e9ecef"/><text x="100" y="175" text-anchor="end">75</text>
    <line x1="110" y1="100" x2="690" y2="100" stroke="#e9ecef"/><text x="100" y="105" text-anchor="end">100</text>
  </g>

  <!-- nominal 95% line: y = 380 - 95*2.8 = 380-266 = 114 -->
  <line x1="110" y1="114" x2="690" y2="114" stroke="#2e7d32" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="685" y="108" text-anchor="end" font-size="14" font-weight="700" fill="#2e7d32">목표 95%</text>

  <!-- bars: y=380 - v*2.8 -->
  <!-- SO 40% : top y=380-112=268 -->
  <rect x="200" y="268" width="120" height="112" fill="#c62828" rx="4"/>
  <text x="260" y="258" text-anchor="middle" font-size="20" font-weight="700" fill="#c62828">40%</text>
  <text x="260" y="404" text-anchor="middle" font-size="15" font-weight="700" fill="#333">순진한 방법 (SO)</text>
  <text x="260" y="424" text-anchor="middle" font-size="13" fill="#666">LLM 라벨 그대로</text>

  <!-- DSL 94% : top y=380-263=117 -->
  <rect x="480" y="117" width="120" height="263" fill="#2e7d32" rx="4"/>
  <text x="540" y="107" text-anchor="middle" font-size="20" font-weight="700" fill="#2e7d32">94%</text>
  <text x="540" y="404" text-anchor="middle" font-size="15" font-weight="700" fill="#333">DSL (디바이어싱)</text>
  <text x="540" y="424" text-anchor="middle" font-size="13" fill="#666">정답 라벨로 보정</text>

  <text x="380" y="454" text-anchor="middle" font-size="13" fill="#999">LLM 정확도가 90%여도, 라벨을 그냥 쓰면(SO) 신뢰구간은 거짓말을 한다</text>
</svg>
