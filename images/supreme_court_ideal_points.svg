<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="'Noto Sans KR', Pretendard, sans-serif">
  <rect width="820" height="470" fill="#ffffff" rx="8"/>
  <text x="410" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#222">대법관 이념 점추정 - LLM 기반 이상점 추론 (모식도)</text>

  <!-- progressive-conservative gradient axis -->
  <defs>
    <linearGradient id="lr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1565c0"/><stop offset="0.5" stop-color="#e9ecef"/><stop offset="1" stop-color="#c62828"/>
    </linearGradient>
  </defs>
  <rect x="110" y="400" width="600" height="10" rx="5" fill="url(#lr)"/>
  <text x="110" y="438" text-anchor="middle" font-size="15" font-weight="700" fill="#1565c0">진보</text>
  <text x="710" y="438" text-anchor="middle" font-size="15" font-weight="700" fill="#c62828">보수</text>
  <!-- center (중도) -->
  <line x1="410" y1="70" x2="410" y2="400" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="410" y="62" text-anchor="middle" font-size="13" fill="#999">중도</text>

  <!-- x = 410 + val*150 ; rows y=100..330 step 46 ; whisker = CI -->
  <!-- 박시환 -1.6 (노무현) progressive 독수리5형제 -->
  <g>
    <line x1="110" y1="100" x2="290" y2="100" stroke="#1565c0" stroke-width="2"/>
    <circle cx="170" cy="100" r="7" fill="#1565c0"/>
    <text x="300" y="105" font-size="14" fill="#333">박시환 (노무현) · 독수리 5형제</text>
  </g>
  <!-- 김영란 -1.2 -->
  <g>
    <line x1="170" y1="146" x2="350" y2="146" stroke="#1976d2" stroke-width="2"/>
    <circle cx="230" cy="146" r="7" fill="#1976d2"/>
    <text x="360" y="151" font-size="14" fill="#333">김영란 (노무현) · 독수리 5형제</text>
  </g>
  <!-- 김명수 -0.5 (문재인, 대법원장) -->
  <g>
    <line x1="290" y1="192" x2="380" y2="192" stroke="#4A90D9" stroke-width="2"/>
    <circle cx="335" cy="192" r="7" fill="#4A90D9"/>
    <text x="390" y="197" font-size="14" fill="#333">김명수 (문재인) · 대법원장</text>
  </g>
  <!-- 조희대 +0.1 (윤석열, 대법원장) 중도 -->
  <g>
    <line x1="380" y1="238" x2="470" y2="238" stroke="#9e9e9e" stroke-width="2"/>
    <circle cx="425" cy="238" r="8" fill="#616161"/>
    <text x="480" y="243" font-size="14" font-weight="700" fill="#333">조희대 (윤석열) · 대법원장 · 중도</text>
  </g>
  <!-- 이용훈 +0.5 (대법원장) -->
  <g>
    <line x1="440" y1="284" x2="530" y2="284" stroke="#E57373" stroke-width="2"/>
    <circle cx="485" cy="284" r="7" fill="#E57373"/>
    <text x="540" y="289" font-size="14" fill="#333">이용훈 · 대법원장</text>
  </g>
  <!-- 양승태 +1.6 (이명박, 대법원장) 가장 보수 -->
  <g>
    <line x1="590" y1="330" x2="710" y2="330" stroke="#c62828" stroke-width="2"/>
    <circle cx="650" cy="330" r="7" fill="#c62828"/>
    <text x="585" y="353" text-anchor="end" font-size="14" fill="#333">양승태 (이명박) · 가장 보수</text>
  </g>

  <text x="410" y="462" text-anchor="middle" font-size="12" fill="#999">가로선 = 94% 신용구간. 점 = 추정 평균 이념. (상대적 위치 모식도)</text>
</svg>
