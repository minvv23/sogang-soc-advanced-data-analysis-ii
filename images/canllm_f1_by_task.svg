<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 490" font-family="'Noto Sans KR', Pretendard, sans-serif">
  <rect width="820" height="490" fill="#ffffff" rx="8"/>
  <text x="410" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#222">zero-shot LLM은 과제를 가린다 - 과제별 최고 F1</text>
  <text x="410" y="54" text-anchor="middle" font-size="14" fill="#666">Can LLMs Transform CSS, Table 4. 색 = 사람과의 일치도(Cohen κ)</text>

  <!-- bars start x=230, scale F1 0-80 over 540px -> 6.75 px/unit ; rows y from 88 step 42 -->
  <!-- random baseline F1=50 -> x=230+50*6.75=567.5 -->
  <line x1="567.5" y1="78" x2="567.5" y2="430" stroke="#e65100" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="567.5" y="448" text-anchor="middle" font-size="13" font-weight="700" fill="#e65100">무작위 50</text>

  <g font-size="15" fill="#333">
    <!-- Misinfo 77.4 green -->
    <text x="220" y="100" text-anchor="end">허위정보 (κ.55)</text><rect x="230" y="88" width="522.5" height="22" fill="#2e7d32" rx="3"/><text x="760" y="105" font-size="14" font-weight="700" fill="#2e7d32">77.4</text>
    <!-- Stance 72.0 green -->
    <text x="220" y="142" text-anchor="end">입장 (κ.58)</text><rect x="230" y="130" width="486" height="22" fill="#2e7d32" rx="3"/><text x="724" y="147" font-size="14" font-weight="700" fill="#2e7d32">72.0</text>
    <!-- Emotion 70.8 green -->
    <text x="220" y="184" text-anchor="end">감정 (κ.65)</text><rect x="230" y="172" width="477.9" height="22" fill="#2e7d32" rx="3"/><text x="716" y="189" font-size="14" font-weight="700" fill="#2e7d32">70.8</text>
    <!-- Politeness 59.2 red (kappa .14) -->
    <text x="220" y="226" text-anchor="end">공손함 (κ.14)</text><rect x="230" y="214" width="399.6" height="22" fill="#c62828" rx="3"/><text x="638" y="231" font-size="14" font-weight="700" fill="#c62828">59.2</text>
    <!-- Toxicity 55.4 red .11 -->
    <text x="220" y="268" text-anchor="end">유해성 (κ.11)</text><rect x="230" y="256" width="373.9" height="22" fill="#c62828" rx="3"/><text x="612" y="273" font-size="14" font-weight="700" fill="#c62828">55.4</text>
    <!-- Ideology doc 51.5 green .51 -->
    <text x="220" y="310" text-anchor="end">이념-문서 (κ.51)</text><rect x="230" y="298" width="347.6" height="22" fill="#2e7d32" rx="3"/><text x="586" y="315" font-size="14" font-weight="700" fill="#2e7d32">51.5</text>
    <!-- Empathy 35.9 red .04 -->
    <text x="220" y="352" text-anchor="end">공감 (κ.04)</text><rect x="230" y="340" width="242.3" height="22" fill="#c62828" rx="3"/><text x="481" y="357" font-size="14" font-weight="700" fill="#c62828">35.9</text>
    <!-- Dialect 32.9 red .15 -->
    <text x="220" y="394" text-anchor="end">방언 (κ.15)</text><rect x="230" y="382" width="222.1" height="22" fill="#c62828" rx="3"/><text x="461" y="399" font-size="14" font-weight="700" fill="#c62828">32.9</text>
  </g>

  <rect x="250" y="462" width="18" height="18" fill="#2e7d32" rx="3"/><text x="274" y="476" font-size="14" fill="#333">사람과 중간 이상 일치 (κ≥.40)</text>
  <rect x="540" y="462" width="18" height="18" fill="#c62828" rx="3"/><text x="564" y="476" font-size="14" fill="#333">거의 무작위 (낮은 일치)</text>
</svg>
