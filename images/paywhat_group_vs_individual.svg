<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="'Noto Sans KR', Pretendard, sans-serif">
  <rect width="720" height="470" fill="#ffffff" rx="8"/>
  <text x="360" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#222">집단 경향은 맞히지만, 개인은 못 맞힌다</text>
  <text x="360" y="54" text-anchor="middle" font-size="14" fill="#666">Pay What LLM Wants - 한국인 522명 지불 실험 (GPT-4o)</text>

  <line x1="100" y1="90" x2="100" y2="380" stroke="#adb5bd" stroke-width="2"/>
  <line x1="100" y1="380" x2="660" y2="380" stroke="#adb5bd" stroke-width="2"/>
  <g font-size="13" fill="#999">
    <line x1="100" y1="380" x2="660" y2="380" stroke="#e9ecef"/><text x="90" y="385" text-anchor="end">0</text>
    <line x1="100" y1="307.5" x2="660" y2="307.5" stroke="#e9ecef"/><text x="90" y="312" text-anchor="end">25</text>
    <line x1="100" y1="235" x2="660" y2="235" stroke="#e9ecef"/><text x="90" y="240" text-anchor="end">50</text>
    <line x1="100" y1="162.5" x2="660" y2="162.5" stroke="#e9ecef"/><text x="90" y="167" text-anchor="end">75</text>
    <line x1="100" y1="90" x2="660" y2="90" stroke="#e9ecef"/><text x="90" y="95" text-anchor="end">100</text>
  </g>
  <text x="58" y="235" text-anchor="middle" font-size="13" fill="#999" transform="rotate(-90 58 235)">일치도 / 정확도 (%)</text>

  <!-- y=380 - v*2.9 ; SSA 93 -> y=110.3 ; individual 17 -> y=330.7 -->
  <rect x="190" y="110.3" width="130" height="269.7" fill="#2e7d32" rx="4"/>
  <text x="255" y="100" text-anchor="middle" font-size="22" font-weight="700" fill="#2e7d32">93%</text>
  <text x="255" y="404" text-anchor="middle" font-size="15" font-weight="700" fill="#333">집단 수준 일치 (SSA)</text>
  <text x="255" y="424" text-anchor="middle" font-size="13" fill="#666">계수 부호·방향 재현</text>

  <rect x="440" y="330.7" width="130" height="49.3" fill="#c62828" rx="4"/>
  <text x="505" y="320" text-anchor="middle" font-size="22" font-weight="700" fill="#c62828">17%</text>
  <text x="505" y="404" text-anchor="middle" font-size="15" font-weight="700" fill="#333">개인 수준 정확도</text>
  <text x="505" y="424" text-anchor="middle" font-size="13" fill="#666">3개 항목 모두 맞힘 = 4%</text>

  <text x="360" y="452" text-anchor="middle" font-size="13" fill="#999">평균은 흉내 내도 특정 개인의 선택은 거의 못 맞힌다</text>
</svg>
