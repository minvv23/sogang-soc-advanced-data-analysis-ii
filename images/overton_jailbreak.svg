<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="'Noto Sans KR', Pretendard, sans-serif">
<rect width="880" height="470" fill="#ffffff" rx="8"/>
<text x="440.0" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#222">탈옥 기법별 Overton Window 변화 (ΔOW)</text>
<text x="440.0" y="56" text-anchor="middle" font-size="13.5" fill="#666">기준 OW=0.853. 양수=발화 범위 확장, 음수=축소 (Red-Teaming Overton, 31개 모델 평균)</text>
<text x="240" y="117" text-anchor="end" font-size="13.5" font-weight="700" fill="#333">Few-Shot (예시 제공)</text>
<rect x="560" y="97" width="215.8" height="30" fill="#2e7d32" rx="3"/><text x="783.8" y="117" text-anchor="start" font-size="13" font-weight="700" fill="#2e7d32">+0.083</text>
<text x="240" y="163" text-anchor="end" font-size="13.5" font-weight="700" fill="#333">Extreme Persona</text>
<rect x="560" y="143" width="150.8" height="30" fill="#2e7d32" rx="3"/><text x="718.8" y="163" text-anchor="start" font-size="13" font-weight="700" fill="#2e7d32">+0.058</text>
<text x="240" y="209" text-anchor="end" font-size="13.5" font-weight="700" fill="#333">Anti-Neutrality</text>
<rect x="560" y="189" width="117.0" height="30" fill="#2e7d32" rx="3"/><text x="685.0" y="209" text-anchor="start" font-size="13" font-weight="700" fill="#2e7d32">+0.045</text>
<text x="240" y="255" text-anchor="end" font-size="13.5" font-weight="700" fill="#333">Authority (권위)</text>
<rect x="471.6" y="235" width="88.4" height="30" fill="#c62828" rx="3"/><text x="463.6" y="255" text-anchor="end" font-size="13" font-weight="700" fill="#c62828">-0.034</text>
<text x="240" y="301" text-anchor="end" font-size="13.5" font-weight="700" fill="#333">Adversarial Pleading</text>
<rect x="362.4" y="281" width="197.6" height="30" fill="#c62828" rx="3"/><text x="354.4" y="301" text-anchor="end" font-size="13" font-weight="700" fill="#c62828">-0.076</text>
<text x="240" y="347" text-anchor="end" font-size="13.5" font-weight="700" fill="#333">Moral Decoupling</text>
<rect x="359.8" y="327" width="200.2" height="30" fill="#c62828" rx="3"/><text x="351.8" y="347" text-anchor="end" font-size="13" font-weight="700" fill="#c62828">-0.077</text>
<text x="240" y="393" text-anchor="end" font-size="13.5" font-weight="700" fill="#333">Foot-in-the-Door</text>
<rect x="320.8" y="373" width="239.2" height="30" fill="#c62828" rx="3"/><text x="312.8" y="393" text-anchor="end" font-size="13" font-weight="700" fill="#c62828">-0.092</text>
<line x1="560" y1="94" x2="560" y2="404" stroke="#495057" stroke-width="1.5"/>
<text x="560" y="426" text-anchor="middle" font-size="12" fill="#888">0 (변화 없음)</text>
<text x="440.0" y="452" text-anchor="middle" font-size="13" fill="#999">8개 중 Few-Shot만 발화 범위를 확장. 설득형(FID, Moral Decoupling)은 오히려 역효과.</text>
</svg>
