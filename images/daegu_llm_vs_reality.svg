<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="'Noto Sans KR', Pretendard, sans-serif">
  <rect width="820" height="480" fill="#ffffff" rx="8"/>
  <text x="410" y="36" text-anchor="middle" font-size="23" font-weight="700" fill="#222">대구시장 선거 - LLM 예측 vs 실제 여론조사</text>

  <!-- axes -->
  <line x1="80" y1="80" x2="80" y2="380" stroke="#adb5bd" stroke-width="2"/>
  <line x1="80" y1="380" x2="780" y2="380" stroke="#adb5bd" stroke-width="2"/>

  <!-- gridlines + y labels (0,25,50,75,100) -->
  <g font-size="13" fill="#999">
    <line x1="80" y1="380" x2="780" y2="380" stroke="#e9ecef"/>
    <text x="70" y="385" text-anchor="end">0</text>
    <line x1="80" y1="305" x2="780" y2="305" stroke="#e9ecef"/>
    <text x="70" y="310" text-anchor="end">25</text>
    <line x1="80" y1="230" x2="780" y2="230" stroke="#e9ecef"/>
    <text x="70" y="235" text-anchor="end">50</text>
    <line x1="80" y1="155" x2="780" y2="155" stroke="#e9ecef"/>
    <text x="70" y="160" text-anchor="end">75</text>
    <line x1="80" y1="80" x2="780" y2="80" stroke="#e9ecef"/>
    <text x="70" y="85" text-anchor="end">100</text>
  </g>

  <!-- Group 1: LLM 시뮬레이션 -->
  <rect x="175" y="150" width="80" height="230" fill="#c62828" rx="3"/>
  <rect x="265" y="310" width="80" height="70" fill="#1565c0" rx="3"/>
  <text x="215" y="142" text-anchor="middle" font-size="17" font-weight="700" fill="#c62828">76.7%</text>
  <text x="305" y="302" text-anchor="middle" font-size="17" font-weight="700" fill="#1565c0">23.3%</text>
  <text x="260" y="408" text-anchor="middle" font-size="16" font-weight="700" fill="#333">LLM 시뮬레이션</text>

  <!-- Group 2: 실제 여론조사 (양자대결) -->
  <rect x="515" y="270" width="80" height="110" fill="#c62828" rx="3"/>
  <rect x="605" y="223" width="80" height="157" fill="#1565c0" rx="3"/>
  <text x="555" y="262" text-anchor="middle" font-size="17" font-weight="700" fill="#c62828">36.6%</text>
  <text x="645" y="215" text-anchor="middle" font-size="17" font-weight="700" fill="#1565c0">52.3%</text>
  <text x="600" y="408" text-anchor="middle" font-size="16" font-weight="700" fill="#333">실제 여론조사 (양자대결)</text>

  <!-- legend -->
  <rect x="300" y="430" width="18" height="18" fill="#c62828" rx="3"/>
  <text x="324" y="444" font-size="15" fill="#333">추경호 (국민의힘)</text>
  <rect x="500" y="430" width="18" height="18" fill="#1565c0" rx="3"/>
  <text x="524" y="444" font-size="15" fill="#333">김부겸 (더불어민주당)</text>

  <!-- reversal annotation -->
  <path d="M 215 130 Q 410 95 645 200" fill="none" stroke="#e65100" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="430" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#e65100">약 50%p 정반대로 빗나감</text>
</svg>
