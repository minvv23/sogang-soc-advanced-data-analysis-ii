<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="'Noto Sans KR', Pretendard, sans-serif">
<rect width="780" height="420" fill="#ffffff" rx="8"/>
<text x="390.0" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#222">이타성은 어디서 오나 - 특징을 끄면 기부액이 얼마나 주나</text>
<text x="390.0" y="56" text-anchor="middle" font-size="14" fill="#666">관대 페르소나 49.1% 기준 변화(pp), 음수=기부 감소 (Mechanism of Altruism, Fig 5c)</text>
<text x="308" y="126" text-anchor="end" font-size="14" font-weight="700" fill="#333">전체 2048개 특징</text>
<rect x="320" y="104" width="372.0" height="32" fill="#37474f" rx="4"/>
<text x="700.0" y="126" font-size="14" font-weight="700" fill="#37474f">-18.6 pp</text>
<text x="308" y="182" text-anchor="end" font-size="14" font-weight="700" fill="#333">System 1+2 (655개)</text>
<rect x="320" y="160" width="376.0" height="32" fill="#37474f" rx="4"/>
<text x="704.0" y="182" font-size="14" font-weight="700" fill="#37474f">-18.8 pp</text>
<text x="308" y="238" text-anchor="end" font-size="14" font-weight="700" fill="#333">System 2 만 (328개·숙고)</text>
<rect x="320" y="216" width="206.0" height="32" fill="#2e7d32" rx="4"/>
<text x="534.0" y="238" font-size="14" font-weight="700" fill="#2e7d32">-10.3 pp</text>
<text x="308" y="294" text-anchor="end" font-size="14" font-weight="700" fill="#333">System 1 만 (327개·직관)</text>
<rect x="320" y="272" width="20.0" height="32" fill="#9e9e9e" rx="4"/>
<text x="348.0" y="294" font-size="14" font-weight="700" fill="#9e9e9e">-1.0 pp</text>
<text x="308" y="350" text-anchor="end" font-size="14" font-weight="700" fill="#333">무작위 327개 (대조)</text>
<rect x="320" y="328" width="10.0" height="32" fill="#cfd8dc" rx="4"/>
<text x="338.0" y="350" font-size="14" font-weight="700" fill="#cfd8dc">-0.5 pp</text>
<line x1="320" y1="96" x2="320" y2="372" stroke="#495057" stroke-width="1.5"/>
<text x="390" y="400" text-anchor="middle" font-size="13" fill="#999">System 2(숙고) 특징이 이타성의 인과 동력. System 1(직관)은 무작위와 차이 없음.</text>
</svg>
