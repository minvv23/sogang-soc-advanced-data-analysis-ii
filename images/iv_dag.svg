<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Noto Sans KR', Pretendard, sans-serif">
  <defs>
    <marker id="arrGreen" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#2e7d32"/>
    </marker>
    <marker id="arrBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#1565c0"/>
    </marker>
    <marker id="arrGray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#6c757d"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#c62828" opacity="0.45"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">도구변수(IV)의 인과 구조</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#6c757d">U: 관측 불가 교란요인 (능력 등) · ε: 오차항, ε ⊇ U</text>

  <!-- U node (top, unobserved) -->
  <circle cx="320" cy="100" r="32" fill="#f7f8fa" stroke="#6c757d" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="320" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#6c757d">U</text>
  <text x="320" y="114" text-anchor="middle" font-size="9" fill="#6c757d">관측 불가</text>

  <!-- Z node (left) -->
  <circle cx="80" cy="240" r="32" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="80" y="238" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e7d32">Z</text>
  <text x="80" y="254" text-anchor="middle" font-size="9" fill="#2e7d32">도구변수</text>

  <!-- X node (center) -->
  <circle cx="320" cy="240" r="32" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <text x="320" y="238" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565c0">X</text>
  <text x="320" y="254" text-anchor="middle" font-size="9" fill="#1565c0">내생변수</text>

  <!-- Y node (right) -->
  <circle cx="560" cy="240" r="32" fill="#fce4ec" stroke="#c62828" stroke-width="2.5"/>
  <text x="560" y="238" text-anchor="middle" font-size="16" font-weight="bold" fill="#c62828">Y</text>
  <text x="560" y="254" text-anchor="middle" font-size="9" fill="#c62828">결과변수</text>

  <!-- epsilon node (small, near Y, error term) -->
  <circle cx="560" cy="135" r="22" fill="#fff8e1" stroke="#b8860b" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="560" y="142" text-anchor="middle" font-size="15" font-weight="bold" fill="#b8860b">ε</text>

  <!-- Z -> X arrow (green) -->
  <line x1="112" y1="240" x2="288" y2="240" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arrGreen)"/>
  <text x="200" y="231" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e7d32">관련성</text>
  <text x="200" y="260" text-anchor="middle" font-size="10" fill="#2e7d32">Cov(Z, X) ≠ 0</text>

  <!-- X -> Y arrow (blue) -->
  <line x1="352" y1="240" x2="528" y2="240" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="440" y="231" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">인과효과 β₁</text>

  <!-- U -> X arrow (gray, dashed) -->
  <line x1="306" y1="130" x2="306" y2="208" stroke="#6c757d" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrGray)"/>

  <!-- U -> Y arrow (gray, dashed) -->
  <path d="M 348 116 Q 460 130 545 213" stroke="#6c757d" stroke-width="1.8" stroke-dasharray="5,3" fill="none" marker-end="url(#arrGray)"/>

  <!-- U labels -->
  <text x="293" y="170" text-anchor="end" font-size="10" fill="#6c757d">내생성</text>
  <text x="450" y="155" text-anchor="middle" font-size="10" fill="#6c757d">내생성</text>

  <!-- epsilon -> Y arrow -->
  <line x1="560" y1="157" x2="560" y2="208" stroke="#b8860b" stroke-width="1.8" stroke-dasharray="4,2" marker-end="url(#arrGray)"/>
  <text x="582" y="185" font-size="10" fill="#b8860b">오차</text>

  <!-- Blocked Z -> Y path (curved BELOW, dashed red, with X mark in middle) -->
  <!-- Bezier midpoint of M(80,272) Q(320,360) (560,272) is (320, 316) -->
  <path d="M 80 272 Q 320 360 560 272" stroke="#c62828" stroke-width="1.8" stroke-dasharray="6,4" fill="none" opacity="0.55"/>
  <!-- Big X mark right on the curve apex (x=320, y=316) -->
  <line x1="306" y1="302" x2="334" y2="330" stroke="#c62828" stroke-width="4"/>
  <line x1="334" y1="302" x2="306" y2="330" stroke="#c62828" stroke-width="4"/>
  <!-- Label for the blocked path (above the X mark, below X node) -->
  <rect x="195" y="278" width="250" height="20" fill="#fff" stroke="#c62828" stroke-width="1" rx="4" opacity="0.95"/>
  <text x="320" y="292" text-anchor="middle" font-size="11" font-weight="bold" fill="#c62828">배제 제약: Z → Y 직접 경로 없음</text>

  <!-- Bottom condition boxes -->
  <rect x="40" y="358" width="270" height="34" fill="#e8f5e9" rx="6" stroke="#a5d6a7" stroke-width="1"/>
  <text x="175" y="374" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e7d32">조건 1 — 관련성: Cov(Z, X) ≠ 0</text>
  <text x="175" y="388" text-anchor="middle" font-size="10" fill="#2e7d32">Z가 X를 실제로 흔든다</text>

  <rect x="330" y="358" width="270" height="34" fill="#fce4ec" rx="6" stroke="#ef9a9a" stroke-width="1"/>
  <text x="465" y="374" text-anchor="middle" font-size="11" font-weight="bold" fill="#c62828">조건 2 — 외생성: Cov(Z, ε) = 0</text>
  <text x="465" y="388" text-anchor="middle" font-size="10" fill="#c62828">Z가 오차항(U 포함)과 무관</text>
</svg>
