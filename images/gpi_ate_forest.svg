<line x1="757.3" y1="90" x2="757.3" y2="320" stroke="#f1f3f5"/>
<text x="757.3" y="340" text-anchor="middle" font-size="12" fill="#999">60</text>
<line x1="376.2" y1="90" x2="376.2" y2="320" stroke="#495057" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="376.2" y="84" text-anchor="middle" font-size="12" fill="#495057">효과 0</text>
