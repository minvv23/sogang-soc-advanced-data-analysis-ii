<text x="407.0" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#2e7d32">4.852</text>
<text x="442.7" y="135" font-size="12" fill="#2e7d32">그럴듯: +5점</text>
<text x="290" y="205" text-anchor="end" font-size="14" font-weight="700" fill="#333">Outcome model + BERT</text>
<line x1="348.8" y1="200" x2="349.3" y2="200" stroke="#c62828" stroke-width="3"/>
