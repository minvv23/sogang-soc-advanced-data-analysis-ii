# 4월 10일 — 인과추론의 기본 개념
## 상관관계를 넘어서: "이 효과가 진짜인가"를 묻는 네 가지 전략

> <strong>SOC4013-01 고급데이터분석 Ⅱ(캡스톤디자인)</strong> | 2026년 봄학기 4주차
>
> 인터랙티브 프레젠테이션: https://minvv23.github.io/sogang-soc-advanced-data-analysis-ii/20260508-presentation.html

## 1. 회귀분석은 인과관계를 말해주는가? — 내생성(endogeneity)의 문제

### 지난주에서 이번 주로

지난주 수업에서 우리는 OLS 회귀분석의 메커니즘을 다뤘다. 평균이 회귀의 특수 경우라는 것, 계수의 의미가 "다른 변수를 통제했을 때의 조건부 평균 차이"라는 것, 그리고 p-value와 표준오차를 해석하는 법까지.

그런데 한 가지 질문을 계속 미뤄왔다. <strong>"성별이 부정선거론 수용에 미치는 효과가 9.8%p"라는 결과가 있을 때, 이것이 정말로 성별의 '효과'인가?"</strong>

OLS는 $X$와 $Y$ 사이의 <strong>통계적 연관(statistical association)</strong>을 추정한다. 그런데 연관(association)과 인과(causation)는 다르다. $X$와 $Y$가 함께 움직이는 것을 관찰했다고 해서, $X$가 $Y$를 <strong>만들었다(caused)</strong>고 말할 수 있는가?

### 내생성: OLS가 인과효과를 추정하지 못하는 이유

지난주에 외생성 가정 $E[\epsilon_i | X_i] = 0$이 가장 중요한 가정이라고 했다. 이 식 자체를 한 번 천천히 읽어보자.

- $\epsilon_i$: 회귀식 $Y_i = \beta_0 + \beta_1 X_i + \epsilon_i$에서 <strong>오차항(error term)</strong>. $X$로 설명되지 않은 $Y$의 모든 부분 — 누락된 변수, 측정 오차, 순수한 무작위 변동 등이 전부 여기 들어간다
- $E[\,\cdot\,|X_i]$: "$X_i$를 알고 있다는 조건 하의 기댓값(조건부 기댓값)". 즉 $X_i$의 값이 어떤 특정 값으로 주어졌을 때 그 안에서 평균을 낸 것
- $E[\epsilon_i | X_i] = 0$: <strong>"$X_i$의 값이 어떻든 간에, 오차항의 평균은 항상 0"</strong>이라는 뜻

직관적으로 풀어 쓰면 이렇다. <strong>"$X$의 어떤 값을 골라서 보더라도, $X$로 설명되지 않은 나머지($\epsilon$)가 그 값과 체계적으로 연관되어 있지 않다"</strong>. $X$가 크든 작든, $\epsilon$은 평균적으로 0이어야 한다. 만약 $X$가 클 때만 $\epsilon$이 양수로 쏠린다면 — 즉 $X$의 값에 따라 오차의 평균이 달라진다면 — $X$와 $\epsilon$이 모종의 방식으로 얽혀 있다는 뜻이다.

이 가정이 왜 결정적인가? OLS는 "$X$가 변할 때 $Y$가 얼마나 변하는가"를 측정한다. 그런데 $X$가 변할 때 $\epsilon$도 같이 변한다면, 우리가 본 $Y$의 변화는 <strong>"$X$의 진짜 효과"와 "$X$를 따라 움직이는 $\epsilon$의 효과"가 섞인 결과</strong>다. OLS는 이 둘을 분리할 능력이 없으므로 — 두 효과를 합쳐서 $\hat{\beta}_1$이라는 하나의 숫자로 뱉어낸다.

이 가정이 위반되는 상황을 <strong>내생성(endogeneity)</strong>이라 한다 ("$X$가 모형 안에서 다른 것과 연관되어 결정된다"는 의미). 내생성이 있으면 OLS 추정치 $\hat{\beta}_1$은 인과효과가 아니라, 인과효과 + 편향의 합이 된다.

내생성이 발생하는 세 가지 경로:

<strong>경로 1: 누락 변수 편향 (Omitted Variable Bias)</strong>

먼저 상황을 설정하자. 등장하는 변수는 셋이다.

- $Y$: 결과 변수 (예: 부정선거론 수용도)
- $X$: 우리가 효과를 알고 싶은 핵심 설명변수 (예: 성별)
- $Z$: $X$와 $Y$ 모두에 영향을 미치는 <strong>제3의 변수</strong> (예: 온라인 커뮤니티 노출 정도)

이 세 변수의 관계를 그림으로 그리면 다음과 같다. (그림 안의 $\beta_1$, $\beta_2$, $\delta$는 곧 수식과 함께 풀어 설명한다.)

```mermaid
flowchart LR
    X["<b>X</b><br/>핵심 설명변수<br/>(예: 성별)"] -->|"β₁<br/><i>진짜 인과효과</i>"| Y["<b>Y</b><br/>결과 변수<br/>(예: 부정선거론)"]
    Z["<b>Z</b><br/>누락된 변수<br/>(예: 커뮤니티 노출)"] -->|"β₂<br/><i>Z→Y 효과</i>"| Y
    X <-->|"δ = Cov(X,Z)/Var(X)<br/><i>X와 Z의 연관</i>"| Z
    Z -.->|"회귀에서 빠져<br/>오차 ε에 흡수"| E["오차항 ε"]

    classDef omit fill:#ffe0b2,stroke:#e65100,color:#000
    classDef target fill:#e3f2fd,stroke:#1565c0,color:#000
    class Z,E omit
    class X,Y target
```

진짜 데이터 생성 과정이 $Y = \beta_0 + \beta_1 X + \beta_2 Z + u$라고 하자. 즉 $Y$는 $X$와 $Z$ 양쪽 모두에 영향을 받는다. 만약 우리가 $Z$를 데이터에 갖고 있지 않거나 회귀식에서 빼먹는다면 — 즉 $X$만 넣은 "짧은(short)" 회귀 $Y = \beta_0 + \beta_1 X + \epsilon$을 돌린다면 — 그 추정치 $\hat{\beta}_1^{\text{short}}$는 $\beta_1$이 아니라 다른 값으로 수렴한다.

$$\hat{\beta}_1^{\text{short}} \xrightarrow{p} \beta_1 + \beta_2 \cdot \delta$$

지난주에 다뤘던 공식이다. 기호가 빽빽하니 좌변과 우변을 하나씩 풀어 읽어보자.

- $\hat{\beta}_1^{\text{short}}$: $Z$를 빠뜨린 채 "$Y$를 $X$에 회귀"했을 때 얻는 OLS 추정치. 즉, 우리가 데이터에서 실제로 손에 쥔 숫자 (예: "성별의 효과 9.8%p")
- $\beta_1$: 우리가 정말로 알고 싶었던 $X$의 인과효과. $Z$까지 통제했을 때의 순수한 효과
- $\beta_2$: $Z$가 $Y$에 미치는 효과 (예: 온라인 커뮤니티 노출이 부정선거론 수용에 미치는 효과)
- $\delta$: $X$와 $Z$의 관계. 구체적으로는 "$Z$를 $X$에 회귀했을 때의 계수"이고, 직관적으로는 $X$가 1단위 변할 때 $Z$가 평균적으로 얼마나 같이 움직이는가
- $\xrightarrow{p}$: "표본 크기가 커지면 이 값으로 수렴한다(probability limit)"는 뜻. <strong>데이터를 아무리 많이 모아도 이 편향은 사라지지 않는다</strong>는 게 핵심

<strong>$\delta$를 수식으로 못박자</strong>. 위에서 글로만 설명한 $\delta$는 사실 <strong>보조 회귀(auxiliary regression)</strong>에서 정확히 정의되는 값이다. 누락된 변수 $Z$를 핵심 설명변수 $X$에 대해 회귀하면:

$$Z_i = \gamma_0 + \delta \cdot X_i + v_i \quad\Longrightarrow\quad \delta = \frac{\text{Cov}(X, Z)}{\text{Var}(X)}$$

즉 "$X$로 $Z$를 예측했을 때의 기울기"다. $X$와 $Z$가 함께 움직이지 않는다면 ($\text{Cov}(X, Z) = 0$) $\delta = 0$이 되어 편향도 자동으로 사라진다. (위 DAG에서 $X \leftrightarrow Z$ 화살표에 붙은 $\delta$가 바로 이 보조회귀의 기울기다.)

따라서 $\beta_2 \cdot \delta$는 <strong>"누락된 $Z$의 효과($\beta_2$)가, $X$-$Z$가 얽혀 있는 정도($\delta$)만큼 $X$의 계수에 묻어나는 양"</strong>이다. 편향이 0이 되려면 둘 중 하나가 성립해야 한다. (1) $\beta_2 = 0$ — $Z$가 $Y$에 영향이 없거나, (2) $\delta = 0$ — $Z$가 $X$와 무관하거나. 둘 다 아니면 OLS 추정치는 <strong>인과효과가 아니라 "인과효과 + 편향"</strong>이다.

수식 자체의 분해 구조는 다음과 같다.

```mermaid
flowchart TD
    A["<b>β&#770;<sub>1</sub><sup>short</sup></b><br/>데이터에서 얻은 추정치<br/>(X만 넣은 짧은 회귀)"] --> B["<b>β<sub>1</sub></b><br/>진짜 인과효과<br/>(우리가 알고 싶은 것)"]
    A --> C["<b>β<sub>2</sub> · δ</b><br/>편향 (bias)<br/>(원치 않게 끼어든 양)"]
    C --> D["<b>β<sub>2</sub></b><br/>Z → Y 효과<br/>(누락된 변수가<br/>결과에 영향)"]
    C --> E["<b>δ</b><br/>X와 Z의 연관<br/>(보조회귀 Z=γ₀+δX+v의<br/>기울기)"]

    classDef good fill:#c8e6c9,stroke:#2e7d32,color:#000
    classDef bad fill:#ffcdd2,stroke:#c62828,color:#000
    classDef neutral fill:#e1bee7,stroke:#6a1b9a,color:#000

```

- 예: 성별 → 부정선거론에서, "온라인 커뮤니티 노출"($Z$)을 빠뜨리면 → 남학생이 특정 커뮤니티에 더 많이 노출되고($\delta \neq 0$), 그 커뮤니티가 부정선거론을 키운다($\beta_2 \neq 0$). 이때 $Z$의 진짜 효과($\beta_2$)가 성별의 계수에 $\delta$의 비율만큼 끼어들어, 마치 "성별의 효과"인 것처럼 잡힌다

### 편향의 방향: upward bias vs downward bias

"편향이 낀다"고만 하면 추상적이다. <strong>편향이 추정치를 진짜 값보다 크게 만드는가, 작게 만드는가</strong>도 알아야 한다. 답은 단순하다 — $\beta_2 \cdot \delta$의 <strong>부호</strong>를 보면 된다.

| $\beta_2$ ($Z \to Y$의 부호) | $\delta$ ($X$-$Z$ 연관의 부호) | $\beta_2 \cdot \delta$ | 편향 방향 |
|------|------|------|------|
| $+$ | $+$ | $+$ | <strong>Upward bias</strong> (추정치 과대평가) |
| $-$ | $-$ | $+$ | <strong>Upward bias</strong> (추정치 과대평가) |
| $+$ | $-$ | $-$ | <strong>Downward bias</strong> (추정치 과소평가) |
| $-$ | $+$ | $-$ | <strong>Downward bias</strong> (추정치 과소평가) |

핵심은 <strong>"부호가 같으면 위쪽으로, 다르면 아래쪽으로"</strong>다.

<strong>우리 사례에 적용해보자: 성별($X$) → 부정선거론($Y$), 누락 변수 = 온라인 커뮤니티 노출($Z$).</strong> 변수 코딩을 명확히 하자 — $X = 1$이 남성, $X = 0$이 여성이라 가정.

- $\beta_2$ ($Z \to Y$의 부호): <strong>$+$ 가능성이 매우 높다</strong>. 부정선거론을 유포하는 커뮤니티(일부 유튜브 채널, 디시 일부 갤러리, 보수 성향 온라인 공간 등)에 노출이 많을수록 부정선거론 수용도가 올라간다고 보는 게 자연스럽다.
- $\delta$ ($X \to Z$의 부호): <strong>$+$ 가능성이 높다</strong>. 한국의 정치 관련 온라인 커뮤니티(특히 부정선거론을 유포하는 쪽)는 남성 이용자 비중이 높다는 게 여러 조사에서 확인된다. 남성($X = 1$)일수록 그런 커뮤니티에 노출($Z$)될 확률이 높다.
- 따라서 $\beta_2 \cdot \delta > 0$ → <strong>Upward bias</strong>.

해석: 우리가 데이터에서 본 "성별의 효과 9.8%p"는 <strong>진짜 성별의 효과($\beta_1$)보다 부풀려진 값</strong>일 가능성이 크다. "남자라서 부정선거론을 더 믿는다"기보다는, "남자라서 그런 커뮤니티에 더 노출되고, 그 노출이 부정선거론을 키운다"의 일부가 성별 계수에 묻어난 것이다. 진짜 성별의 인과효과는 9.8%p보다 작을 가능성이 높다 — 어쩌면 거의 0에 가까울 수도 있다.

<strong>주의 — "이론적 방향성"과 "도메인 판단"의 구분</strong>: 위 분석에서 $\beta_2$와 $\delta$의 <strong>부호 자체는 통계 이론으로 결정되지 않는다</strong>. 통계 이론이 알려주는 것은 오직 "두 부호가 같으면 upward, 다르면 downward"라는 <strong>관계</strong>일 뿐이다. 각 부호가 실제로 무엇인지는 <strong>도메인 지식과 사전 연구</strong>로 판단해야 한다. 이 사례에서 둘 다 양수라고 판단한 근거는 한국 정치 커뮤니티의 성별 분포에 대한 경험적 관찰과, 음모론적 콘텐츠가 수용도에 미치는 효과에 대한 기존 연구다. <strong>도메인 판단이 바뀌면 편향 방향도 바뀐다</strong>. 만약 부정선거론을 유포하는 커뮤니티가 (가설적으로) 여성 이용자가 더 많은 곳이라면 $\delta < 0$이 되고, 편향은 downward로 뒤집힌다.

<strong>경로 2: 역인과 (Reverse Causality)</strong>

$X$가 $Y$를 만드는 게 아니라, $Y$가 $X$를 만드는 경우.

- 예: "경찰 수가 많은 도시일수록 범죄가 많다." 경찰이 범죄를 유발하는가? 아니다. 범죄가 많으니까 경찰을 더 배치한 것이다

<strong>경로 3: 선택 편향 (Selection Bias)</strong>

표본이 특정 방식으로 선택되어, 모집단과 다른 관계가 나타나는 경우.

- 예: "입원 환자 중에서 흡연자가 비흡연자보다 코로나 사망률이 낮다." → 입원이라는 조건(충돌 변수)으로 선택된 표본이므로, 모집단의 관계와 다르다

```mermaid
flowchart TD
    A["X와 Y 사이에<br/>통계적 연관이 관찰됨"] --> B{"이것이 인과인가?"}
    B -->|"문제 1"| C["누락 변수<br/>Z가 둘 다에 영향"]
    B -->|"문제 2"| D["역인과<br/>Y → X"]
    B -->|"문제 3"| E["선택 편향<br/>표본이 편향됨"]
    C --> F["OLS 추정치 ≠ 인과효과"]
    D --> F
    E --> F
    F --> G["<b>해결:</b> 인과추론 방법론"]
```

### "상관관계 ≠ 인과관계"를 넘어서

"상관관계는 인과관계가 아니다"라는 말은 맞지만, 거기서 멈추면 안 된다. 사회과학의 핵심 질문은 대부분 인과적이다. "최저임금 인상이 고용을 줄이는가?", "용산 이전이 교통 체증을 유발했는가?", "성별이 정치적 태도에 영향을 미치는가?" — 이 질문들에 답하려면, 단순 OLS를 넘어서 <strong>인과효과를 식별(identify)하는 전략</strong>이 필요하다.

이번 수업에서 다루는 것이 바로 그 전략들이다. 실험(RCT), 이중차분법(DID), 도구변수(IV), 회귀불연속설계(RDD) — 네 가지 접근, 각각의 핵심 아이디어와 가정을 살펴본다.

## 2. 인과추론의 언어: 잠재적 결과(Potential Outcomes)와 반사실(Counterfactual)

### 인과효과란 무엇인가

인과효과를 엄밀하게 정의하려면 <strong>잠재적 결과 프레임워크(Potential Outcomes Framework)</strong>가 필요하다. Donald Rubin이 체계화해서 <strong>Rubin Causal Model</strong>이라고도 부른다.

핵심 아이디어: 모든 분석 단위 $i$에게는 두 가지 <strong>잠재적 결과(potential outcomes)</strong>가 존재한다. 여기서 "단위($i$)"는 분석 대상인 관측 단위를 가리킨다 — 의학 연구라면 환자, 정책 평가라면 지역·도로·학교 등이다. 이 수업의 용산 이전 사례에서는 <strong>도로 하나하나가 단위 $i$</strong>이고, 사회조사 데이터라면 응답자 한 명이 단위가 된다.

- $Y_i(1)$: 단위 $i$가 처치(treatment)를 <strong>받았을 때</strong>의 결과
- $Y_i(0)$: 단위 $i$가 처치를 <strong>받지 않았을 때</strong>의 결과

단위 $i$에 대한 <strong>단위 처치 효과(individual treatment effect, ITE)</strong>는:

$$\tau_i = Y_i(1) - Y_i(0)$$

<strong>예시 — 용산 이전과 교통량</strong>:

- $Y_i(1)$: 대통령실이 용산으로 이전<strong>한</strong> 세계에서 $i$번째 도로의 교통량
- $Y_i(0)$: 대통령실이 용산으로 이전하지 <strong>않은</strong> 세계에서 $i$번째 도로의 교통량
- $\tau_i = Y_i(1) - Y_i(0)$: 이전으로 인한 $i$번째 도로의 교통량 변화

### 인과추론의 근본 문제 (Fundamental Problem of Causal Inference)

문제는 <strong>한 사람(또는 한 도로)에 대해 $Y_i(1)$과 $Y_i(0)$을 동시에 관측할 수 없다</strong>는 것이다. 용산 이전은 일어났거나 일어나지 않았거나 둘 중 하나다. 같은 도로를 같은 시점에 "이전한 세계"와 "이전하지 않은 세계" 양쪽에서 동시에 관찰하는 것은 불가능하다.

우리가 관측하는 것은:

$$Y_i = D_i \cdot Y_i(1) + (1 - D_i) \cdot Y_i(0)$$

여기서 $D_i$는 처치 여부 (1이면 처치군, 0이면 대조군). 처치군에서는 $Y_i(1)$만, 대조군에서는 $Y_i(0)$만 관측된다. 관측되지 않는 쪽을 <strong>반사실(counterfactual)</strong>이라 부른다.

| | $Y_i(1)$ (처치 시) | $Y_i(0)$ (비처치 시) | 단위 효과 $\tau_i$ |
|--|--|--|--|
| 처치군 ($D_i = 1$) | <strong>관측</strong> | 반사실 (?) | ? |
| 대조군 ($D_i = 0$) | 반사실 (?) | <strong>관측</strong> | ? |

![인과추론의 근본 문제: 반사실은 관측할 수 없다](images/potential_outcomes_table.svg)

<strong>단위 수준의 인과효과 $\tau_i$는 절대 직접 관측할 수 없다.</strong> 이것이 인과추론의 근본 문제다.

### ATE와 ATT: 우리가 추정하려는 것

단위 효과 $\tau_i$를 직접 볼 수 없으니, 우리는 <strong>평균적 효과</strong>를 추정한다. 그런데 "평균"이라고 다 같은 평균이 아니다. <strong>"누구에 대해 평균을 내느냐"</strong>가 ATE와 ATT의 결정적 차이다.

<strong>ATE (Average Treatment Effect, 평균 처치 효과)</strong>: 모집단의 <strong>모든 단위</strong>(처치를 실제로 받았든 안 받았든)를 대상으로 한 평균.

$$\text{ATE} = E[Y_i(1) - Y_i(0)] = E[Y_i(1)] - E[Y_i(0)]$$

<strong>ATT (Average Treatment Effect on the Treated, 처치집단 평균 처치 효과)</strong>: 실제로 처치를 받은 단위($D_i = 1$)에 한정한 조건부 평균.

$$\text{ATT} = E[Y_i(1) - Y_i(0)\ |\ D_i = 1]$$

핵심은 ATT 식 우변에 붙은 <strong>$|\ D_i = 1$ (처치를 실제로 받은 집단으로 한정)</strong>이라는 조건이다. ATE는 이 조건이 없는 무조건부 기댓값이다.

<strong>두 값은 언제 같고 언제 다른가?</strong>

- 효과가 모든 단위에서 동일하면(homogeneous treatment effect, $\tau_i = \tau$ 일정) → 누구에 대해 평균을 내든 같은 값이므로 ATE = ATT.
- 처치 배정이 잠재적 결과와 독립이면(예: RCT) → 처치군이 모집단의 무작위 표본이므로 ATE = ATT.
- 효과가 단위마다 다르고(heterogeneous), 처치가 비무작위로 배정되면(특히 효과가 클 단위에 처치가 몰리면) → ATE ≠ ATT.

<strong>용산 이전 예시</strong>로 풀어보자. 처치 = "대통령실 이전으로 출근길 영향권에 들어감", 단위 = 도로 139개.

- ATE: "서울 139개 도로 <strong>전부</strong>를 가상으로 출근길 영향권에 놓았다면, 도로 한 개당 평균 교통량 변화는 얼마인가?" — 강북 외곽의 작은 도로까지 다 처치한 가상 시나리오의 평균. 정책적 의미가 거의 없다.
- ATT: "<strong>실제로</strong> 출근길 영향권에 들어간 6개 도로에서, 이전이 그 도로들에 가한 평균 효과는 얼마인가?" — 정책 평가가 실제로 답하고 싶은 질문.
- 두 값은 다를 가능성이 매우 크다. 출근길 6개 도로는 애초에 한강을 건너 용산을 잇는 주요 교량이라, "이전이 가했을 때의 효과"가 임의 도로보다 클 것이다. 처치 효과 자체가 이질적이고, 처치는 효과가 큰 단위에 집중되어 있다 → ATE는 평균을 희석시키고, ATT가 실질적 답이 된다.

<strong>그렇다면 ATE는 언제 의미 있는가?</strong> ATE를 추정하는 연구가 없는 것은 아니다. 오히려 다음과 같은 상황에서는 ATE가 ATT보다 정책적으로 더 의미 있다.

| 상황 | ATE가 더 의미 있는 이유 |
|------|----------------------|
| <strong>전 국민 대상 보편 정책</strong> (예: 국민건강보험 도입, 의무 백신 접종, 보편 기본소득) | 처치 = 모든 단위. 모집단 = 처치 집단이므로 ATE = ATT가 되고, 우리가 알고 싶은 건 "전체에 시행했을 때의 효과" |
| <strong>정책의 확장/일반화 검토</strong> (예: 소규모 시범사업의 효과를 전국 시행 시 어떻게 일반화할까) | 시범사업 참가자(ATT)에게서 본 효과가 모집단 전체에 시행했을 때(ATE)도 유지될지를 묻는 질문. ATE가 외적 타당성 차원의 핵심 |
| <strong>RCT/A/B 테스트</strong> | 무작위 배정으로 처치 배정이 결과와 독립이므로 ATE = ATT가 자동으로 성립. RCT 결과는 그대로 ATE로 해석된다 |
| <strong>약물 임상시험</strong> (모집단을 대표하는 표본에 무작위 배정) | "이 약을 처방받을 환자 모집단 전체에 평균적으로 얼마의 효과가 있는가" — ATE가 자연스러운 추정 대상 |

반대로 다음 상황에서는 ATT가 정책적으로 훨씬 의미 있다.

| 상황 | ATT가 더 의미 있는 이유 |
|------|----------------------|
| <strong>이미 시행된 정책의 사후 평가</strong> (예: 용산 이전, 4대강 사업, 특정 지역 도시재생) | "실제로 처치를 받은 단위에 효과가 있었나"가 정책 평가의 핵심 질문 |
| <strong>표적 정책</strong> (예: 저소득층 대상 직업훈련, 특정 산업 지원) | 정책 대상자 = 처치집단. ATT가 정책 대상자에 대한 효과 그 자체 |
| <strong>처치를 받지 않은 단위에 가하는 게 비현실적</strong> (예: 한강 외곽 도로에 "용산 이전" 효과를 가한다는 가상 자체가 무의미) | ATE를 정의하는 가상 시나리오 자체가 정책적으로 무의미할 때 |
| <strong>자연실험·준실험적 연구</strong> (DID, RDD 등) | 식별 전략 대부분이 ATT(또는 LATE처럼 처치 집단 일부)에 대한 효과만 깔끔하게 식별. ATE까지 일반화하려면 추가 가정 필요 |

정리하면: <strong>"전체에 시행했을 때 어떨까"를 물으면 ATE</strong>, <strong>"실제 시행된 처치가 그 대상에게 효과가 있었나"를 물으면 ATT</strong>다. 사회과학·정책 평가에서는 이미 일어난 일을 평가하는 경우가 많아 ATT가 더 빈번하게 쓰이지만, 보편 정책 설계나 RCT 기반 연구에서는 ATE가 핵심이다.

### 한 발 더 — LATE: "특정 부분집단"에 대한 평균 처치 효과

ATE와 ATT 외에 한 가지 개념을 미리 소개해 둔다. 뒤에서 도구변수(IV)와 Fuzzy RDD를 다룰 때 다시 등장할 <strong>LATE (Local Average Treatment Effect, 국소 평균 처치 효과)</strong>다.

LATE는 모집단 전체(ATE)도, 실제 처치받은 집단 전체(ATT)도 아니라, <strong>"어떤 외생적 변이(예: 도구변수 $Z$)에 의해서 처치 여부가 바뀐 사람들"</strong>에 한정한 평균 처치 효과다. 이 집단을 흔히 <strong>compliers(순응자)</strong>라고 부른다.

직관적으로 비교하면 다음과 같다.

| 개념 | 누구에 대한 평균인가 | 식 |
|------|---------------------|---|
| ATE | 모집단 전체 | $E[Y_i(1) - Y_i(0)]$ |
| ATT | 실제로 처치를 받은 단위 | $E[Y_i(1) - Y_i(0)\ \|\ D_i = 1]$ |
| LATE | 도구변수에 의해 처치 여부가 바뀌는 단위(compliers) | $E[Y_i(1) - Y_i(0)\ \|\ \text{complier}]$ |

예를 들어, 베트남전 징병 추첨(도구변수 $Z$)이 군 복무($X$)에 미친 효과를 통해 군 복무가 소득($Y$)에 미친 인과효과를 추정하는 상황을 생각해보자. 추첨에 뽑혔기 때문에 군에 간 사람과, 안 뽑혔지만 자원입대한 사람, 뽑혔지만 면제받은 사람이 섞여 있다. 이때 도구변수 IV가 식별해 주는 것은 <strong>"추첨에 뽑혀서 군에 간(=$Z$가 바뀌면 $X$가 바뀌는) compliers"</strong>의 평균 처치 효과뿐이다. 자원입대자나 면제자에 대한 효과는 알 수 없다.

LATE의 두 가지 특징을 기억해두자. 첫째, <strong>compliers가 누구인지 데이터로 직접 확인할 수 없다</strong>. 둘째, 따라서 LATE의 외적 타당성(다른 집단으로 일반화)은 본질적으로 제한적이다. 이 한계가 IV의 핵심 단점 중 하나로 다시 등장한다.

지금은 "ATE/ATT 말고도 처치 효과의 '평균'을 정의하는 방식이 또 있고, 그것이 도구변수가 식별해 주는 양이다" 정도만 머리에 담아두면 된다. 자세한 논의는 7장에서 한다.

## 3. 선택 편향(Selection Bias) — 왜 단순 비교가 틀리는가

### 처치군과 대조군의 단순 비교

인과효과를 추정하는 가장 순진한(naive) 방법은 "처치군의 평균 결과 - 대조군의 평균 결과"를 계산하는 것이다.

$$\underbrace{E[Y_i | D_i = 1] - E[Y_i | D_i = 0]}_{\text{관측 가능한 차이}}$$

이것을 잠재적 결과(potential outcomes)의 언어로 분해해보자. 천천히 단계별로 가야 한다.

<strong>1단계 — 관측되는 $Y_i$를 잠재적 결과로 다시 쓰기</strong>

먼저 한 가지 사실을 확실히 짚자. 우리가 실제로 관측하는 $Y_i$는 그 단위가 받은 처치에 따라 결정된다.

- 처치군($D_i = 1$): 실제로 처치를 받았으므로 우리가 보는 $Y_i$는 처치 받았을 때의 잠재적 결과, 즉 $Y_i = Y_i(1)$.
- 대조군($D_i = 0$): 처치를 안 받았으므로 우리가 보는 $Y_i$는 처치 안 받았을 때의 잠재적 결과, 즉 $Y_i = Y_i(0)$.

따라서 단순 비교식은 다음과 같이 다시 쓸 수 있다.

$$E[Y_i \mid D_i = 1] - E[Y_i \mid D_i = 0] = E[Y_i(1) \mid D_i = 1] - E[Y_i(0) \mid D_i = 0]$$

여기서 우변의 두 항을 각각 한국어로 풀면:

- $E[Y_i(1) \mid D_i = 1]$: <strong>"처치를 받은 집단의, 처치 받은 상태에서의 결과 평균"</strong>. 우리가 실제로 관측 가능한 값.
- $E[Y_i(0) \mid D_i = 0]$: <strong>"처치를 받지 않은 집단의, 처치 안 받은 상태에서의 결과 평균"</strong>. 이것도 관측 가능.

<strong>왜 이 두 값을 빼는 것이 인과효과가 아닌가?</strong> 인과효과를 보려면 <strong>같은 집단</strong>이 처치 받았을 때와 안 받았을 때를 비교해야 한다. 그런데 위 식은 <strong>서로 다른 집단</strong>("처치군 vs 대조군")을 비교하고 있다. 두 집단이 처치 이전부터 이미 달랐다면, 그 차이가 결과에 섞여 나온다.

<strong>2단계 — "0을 더하기" 트릭으로 인과효과 항 분리하기</strong>

이 문제를 식으로 드러내기 위해, <strong>"처치군의 반사실 결과"</strong>인 $E[Y_i(0) \mid D_i = 1]$를 빼고 다시 더한다 (값은 그대로 0을 더한 것이지만, 식의 모양은 달라진다).

$$= \underbrace{E[Y_i(1) \mid D_i = 1]}_{\text{관측됨}} \;-\; \underbrace{E[Y_i(0) \mid D_i = 1]}_{\text{빼고}} \;+\; \underbrace{E[Y_i(0) \mid D_i = 1]}_{\text{다시 더하고}} \;-\; \underbrace{E[Y_i(0) \mid D_i = 0]}_{\text{관측됨}}$$

이 네 항을 두 묶음으로 다시 묶으면 다음과 같이 정리된다.

$$= \underbrace{\big(\,E[Y_i(1) \mid D_i = 1] - E[Y_i(0) \mid D_i = 1]\,\big)}_{\text{ATT}} \;+\; \underbrace{\big(\,E[Y_i(0) \mid D_i = 1] - E[Y_i(0) \mid D_i = 0]\,\big)}_{\text{선택 편향 (Selection Bias)}}$$

<strong>3단계 — 두 묶음이 각각 무엇인지 풀어보기</strong>

각 묶음의 의미를 차근차근 짚어보자.

<strong>① 첫 번째 묶음 = ATT</strong>

$$E[Y_i(1) \mid D_i = 1] - E[Y_i(0) \mid D_i = 1]$$

두 항 모두 조건이 $D_i = 1$ — 즉 <strong>같은 사람들(처치군)</strong>에 대한 비교다. 첫 항은 그들이 실제로 처치 받았을 때의 결과, 둘째 항은 그들이 만약 처치를 안 받았다면 어땠을지(반사실)의 결과. 두 값의 차이는 그 집단에 대한 진짜 인과효과, 즉 <strong>ATT (처치집단 평균 처치 효과)</strong>다. 이것이 우리가 알고 싶은 양이다.

<strong>② 두 번째 묶음 = 선택 편향</strong>

$$E[Y_i(0) \mid D_i = 1] - E[Y_i(0) \mid D_i = 0]$$

두 항 모두 $Y_i(0)$ — 즉 <strong>"처치를 받지 않았을 때"의 결과</strong>를 다루고 있다. 차이는 누구에 대해 보는가다. 첫 항은 "처치군이 만약 처치를 안 받았다면 보였을 결과", 둘째 항은 "대조군이 (실제로) 처치를 안 받고 보인 결과". 만약 처치군과 대조군이 처음부터 동질적이라면 이 두 값은 같아야 하고 차이는 0이 된다. 그러나 두 집단이 원래부터 달랐다면, 이 차이는 0이 아니다 — 그것이 바로 <strong>선택 편향</strong>이다.

핵심 통찰: 선택 편향은 <strong>처치와 무관한 두 집단의 원래 차이</strong>다. 처치가 가져온 효과가 아니라, 처치를 받지 않은 시나리오에서도 존재했을 차이.

<strong>결론</strong>

$$\boxed{\;\text{관측 가능한 차이} \;=\; \text{ATT} \;+\; \text{선택 편향}\;}$$

우리는 좌변(관측 가능한 차이)만 데이터에서 볼 수 있다. 좌변에는 우리가 원하는 ATT뿐 아니라 선택 편향까지 섞여 있다. <strong>선택 편향이 0이라고 가정할 수 있을 때(예: RCT에서의 무작위 배정)에만</strong> 단순 비교가 ATT와 같아진다. 그렇지 않으면 단순 비교는 인과효과의 편향된 추정치다 — 이것이 회귀 한 줄로 인과효과를 주장할 수 없는 근본 이유다.

![단순 비교는 왜 틀리는가: 선택 편향의 분해](images/selection_bias.svg)

### 선택 편향이 의미하는 것

선택 편향 항 $E[Y_i(0) | D_i = 1] - E[Y_i(0) | D_i = 0]$은 <strong>"처치를 받은 집단이, 설령 처치를 받지 않았더라도, 대조군과 원래 달랐을 정도"</strong>를 나타낸다.

<strong>용산 이전 예시</strong>:

- 처치군: 사저 출근길 영향권 6개 도로 (한강대교, 동작대교, 반포대교 등)
- 대조군: 나머지 133개 도로

처치군 도로들은 대통령실 이전과 무관하게도 서울의 주요 교량이자 교통 요충지다. 이전이 없었어도 이 도로들의 교통량은 나머지 도로보다 <strong>원래 높았을 것이다</strong>. 이것이 선택 편향이다.

따라서 "이전 후 처치군의 교통량 - 대조군의 교통량"을 계산하면, 이전의 효과뿐 아니라 원래부터 있던 도로 간 차이까지 섞여 들어간다.

```mermaid
flowchart LR
    A["관측된 차이<br/>(처치군 평균 - 대조군 평균)"] --> B["ATT<br/>(진짜 인과효과)"]
    A --> C["선택 편향<br/>(처치 전부터<br/>있던 차이)"]
    B --> D["우리가 원하는 것"]
    C --> E["제거해야 하는 것"]
```

### 선택 편향을 제거하는 네 가지 전략

이 수업에서 다루는 네 가지 방법론은 모두 <strong>선택 편향을 제거하는 서로 다른 전략</strong>이다.

| 방법 | 선택 편향 제거 전략 |
|------|------------------|
| <strong>실험 (RCT)</strong> | 무작위 배정으로 처치군과 대조군을 사전에 동일하게 만든다 |
| <strong>이중차분법 (DID)</strong> | 시간에 따른 변화를 비교해서, 시간-불변 차이를 제거한다 |
| <strong>도구변수 (IV)</strong> | 처치와 상관되지만 결과에는 직접 영향이 없는 외생적 변이를 찾는다 |
| <strong>회귀불연속 (RDD)</strong> | 커트라인 근처에서 처치 배정이 "사실상 무작위"임을 이용한다 |

## 4. 실험(RCT)과 A/B 테스팅 — 무작위 배정이 해결하는 것

### 무작위 통제 실험 (Randomized Controlled Trial)

<strong>RCT의 핵심 아이디어</strong>: 참가자를 <strong>무작위(random)</strong>로 처치군과 대조군에 배정한다.

무작위 배정이 왜 강력한가? $D_i$(처치 여부)가 동전 던지기로 결정되면:

$$D_i \mathrel{\perp\mkern-10mu\perp} (Y_i(1), Y_i(0))$$

여기서 두 개의 ⊥를 겹친 기호 "⫫"는 통계학에서 <strong>독립(independence)</strong>을 뜻한다. 즉 처치 여부($D_i$)가 잠재적 결과 $(Y_i(1), Y_i(0))$와 <strong>독립(independent)</strong>이다. 쉽게 말하면, "처치를 받은 사람과 받지 않은 사람이 처치를 받기 전에는 평균적으로 동일하다."

이 경우 선택 편향이 정확히 0이 된다:

$$E[Y_i(0) | D_i = 1] - E[Y_i(0) | D_i = 0] = 0$$

왜냐하면 무작위 배정으로 인해 $E[Y_i(0) | D_i = 1] = E[Y_i(0) | D_i = 0] = E[Y_i(0)]$이기 때문이다. 처치군에 배정된 사람이나 대조군에 배정된 사람이나, 처치를 받지 않았을 때의 기대 결과가 같다.

따라서:

$$E[Y_i | D_i = 1] - E[Y_i | D_i = 0] = \text{ATE}$$

<strong>단순 평균 차이가 곧 인과효과가 된다.</strong> 별다른 통계적 기법이 필요 없다. 이것이 RCT가 인과추론의 "황금 표준(gold standard)"이라 불리는 이유다.

### A/B 테스팅: 산업계의 RCT

산업계에서 RCT를 부르는 이름이 <strong>A/B 테스팅</strong>이다. 원리는 정확히 같다.

| | 학계 (RCT) | 산업계 (A/B Test) |
|--|--|--|
| <strong>대상</strong> | 환자, 학생, 시민 등 | 사용자, 고객 |
| <strong>처치</strong> | 약물, 정책, 교육 프로그램 | 버튼 색상, 알고리즘, 가격 |
| <strong>결과 변수</strong> | 건강, 학업 성취, 정치 태도 | 클릭률, 전환율, 체류 시간 |
| <strong>표본 크기</strong> | 수십~수천 | 수만~수백만 |
| <strong>기간</strong> | 수개월~수년 | 수일~수주 |
| <strong>핵심 원리</strong> | 동일: 무작위 배정 → 선택 편향 제거 | 동일 |

첫 수업에서 "산업 현장에서는 복잡한 인과추론 모형보다 A/B 테스팅이 훨씬 실용적"이라고 했던 이유가 여기에 있다. A/B 테스팅은 인과추론의 가장 깔끔한 형태다. 무작위 배정이 가능하고, 표본이 크고, 반복 실험이 쉬우니까.

### RCT의 한계

RCT가 만능은 아니다. 다음 상황에서는 실험이 불가능하거나 바람직하지 않다.

<strong>1. 윤리적 제약</strong>:

"흡연이 폐암을 유발하는가?"를 검증하기 위해 사람을 무작위로 흡연군/비흡연군에 배정할 수 없다. "용산 이전이 교통 체증을 유발하는가?"를 검증하기 위해 대통령실을 무작위로 이전할 수 없다.

<strong>2. 현실적 제약</strong>:

"최저임금 인상이 고용을 줄이는가?"를 실험하려면 지역마다 다른 최저임금을 무작위로 적용해야 하는데, 이것은 정치적으로 불가능하다.

<strong>3. 외적 타당성 (External Validity)</strong>:

실험실에서 나온 결과가 현실 세계에서도 성립하는가? 실험 환경이 인위적일수록 일반화가 어렵다.

- <strong>내적 타당성 (Internal Validity)</strong>: "이 실험 내에서 인과효과가 올바르게 추정되었는가?" — RCT는 이것에 강하다
- <strong>외적 타당성 (External Validity)</strong>: "이 결과가 다른 집단, 다른 맥락에서도 성립하는가?" — RCT가 보장하지 못한다

<strong>4. SUTVA (Stable Unit Treatment Value Assumption)</strong>:

RCT가 성립하려면 <strong>"한 사람의 처치가 다른 사람의 결과에 영향을 미치지 않는다"</strong>는 가정이 필요하다. 이것을 SUTVA라 한다.

- 위반 예시: 백신 RCT에서, 처치군(백신 접종자)이 많아지면 대조군(미접종자)도 집단 면역 효과를 받는다. 처치군의 처치가 대조군의 결과를 바꾼 것이다
- 위반 예시: A/B 테스트에서 처치군 사용자가 대조군 사용자에게 새 기능을 알려주는 경우

```mermaid
flowchart TD
    A["<b>RCT (A/B Test)</b><br/>무작위 배정"] --> B["✅ 내적 타당성<br/>선택 편향 = 0"]
    A --> C["⚠️ 한계"]
    C --> D["윤리적 제약<br/>사람에게 해로운<br/>처치 불가"]
    C --> E["현실적 제약<br/>정책 무작위 배정<br/>불가능"]
    C --> F["외적 타당성<br/>실험실 ≠ 현실"]
    C --> G["SUTVA<br/>간섭 효과"]
```

### 실험이 불가능할 때의 대안

RCT가 불가능한 상황에서 인과효과를 추정하는 방법을 <strong>준실험적 방법(quasi-experimental methods)</strong> 또는 <strong>자연 실험(natural experiments)</strong>이라 한다. 핵심 아이디어는 동일하다: <strong>현실 세계에서 "마치 무작위 배정처럼" 작동하는 상황을 찾는 것</strong>.

이제부터 다루는 DID, IV, RDD가 바로 이 전략들이다. 그런데 이 세 가지가 동등하게 좋은 것은 <strong>아니다</strong>. 이 수업의 입장을 미리 밝히자면:

- <strong>DID</strong>: 실험 다음으로 가장 설득력 있는 전략이다. 가정(평행 추세)이 명확하고, 간접적으로나마 검증 가능하며, 직관적이다
- <strong>RDD</strong>: 개념적으로는 매우 깔끔한 디자인이다. 커트라인 근처에서 "사실상 무작위"라는 논리가 직관적이고 시각적으로도 설득력 있다. 다만 실질적으로는 IV의 변형이라는 약점이 있다
- <strong>IV</strong>: 이론적으로는 우아하지만, 실제 연구에서 설득력 있게 쓰기가 가장 어려운 방법이다. 현대 응용 경제학에서는 IV에 대한 회의론이 커지고 있다

이 위계를 염두에 두고 각 방법을 살펴보자.

## 5. 이중차분법(Difference-in-Differences) — "다른 도로 대비 얼마나 더 늘었는가"

### 잠깐 — 횡단면 데이터와 패널 데이터는 무엇이 다른가

지금까지 우리가 다뤄온 데이터는 전부 <strong>횡단면(cross-sectional) 데이터</strong>다. 1,070명의 응답자를 한 시점에 조사한 것. 각 행(row)이 한 사람이고, 시간 차원은 없다.

| 응답자 | 성별 | 소득 | 부정선거론 |
|--------|------|------|-----------|
| 1 | 남 | 350 | 62 |
| 2 | 여 | 420 | 38 |
| ... | ... | ... | ... |

DID는 이런 데이터로는 쓸 수 없다. DID에는 <strong>패널(panel) 데이터</strong>가 필요하다. 패널 데이터란 <strong>같은 개체를 여러 시점에 걸쳐 반복 관측한 데이터</strong>다.

| 도로 | 주차 | 교통량 |
|------|------|--------|
| 한강대교 | 2022-W11 | 84,200 |
| 한강대교 | 2022-W12 | 85,100 |
| ... | ... | ... |
| 한강대교 | 2022-W25 | 97,800 |
| 동작대교 | 2022-W11 | 82,500 |
| ... | ... | ... |

핵심적 차이: 패널 데이터에는 <strong>두 가지 차원의 변이(variation)</strong>가 있다.

- <strong>횡단면 변이 (between variation)</strong>: 같은 시점에서 도로 간 차이. "한강대교가 강변북로보다 교통량이 많다"
- <strong>시계열 변이 (within variation)</strong>: 같은 도로의 시간에 따른 변화. "한강대교의 교통량이 5월 이후 늘었다"

횡단면 데이터에서는 between variation밖에 없다. 패널 데이터에서는 둘 다 있으므로, <strong>"같은 도로가 시간에 따라 어떻게 변했는가"를 추적할 수 있다</strong>. 이것이 DID의 전제 조건이다.

수식으로 쓰면, 패널 데이터의 기본 구조는:

$$Y_{it} = \alpha_i + \lambda_t + \beta X_{it} + \epsilon_{it}$$

여기서 $i$는 개체(도로), $t$는 시점이다. $\alpha_i$는 도로별 고정 특성(위치, 차선 수 등), $\lambda_t$는 시점별 공통 충격(계절, 경기 등)이다. 횡단면 OLS에서는 $\alpha_i$를 통제할 수 없었지만, 패널 데이터에서는 이것을 차분이나 고정효과로 제거할 수 있다. <strong>이것이 패널 데이터의 힘이고, DID가 작동하는 기반이다.</strong>

### DID의 핵심 아이디어

이중차분법(Difference-in-Differences, DID)은 <strong>두 번의 차이(difference)</strong>를 구해서 인과효과를 추정하는 방법이다.

<strong>용산 이전 예시</strong>로 바로 들어가자.

첫 수업에서 이미 소개한 데이터: 서울시 139개 도로, 대통령실 용산 이전 전후 10주(2022.3.11~7.9).

- <strong>처치군</strong>: 사저 출근길 영향권 6개 도로
- <strong>대조군</strong>: 나머지 133개 도로
- <strong>처치 시점</strong>: 2022년 5월 10일 (윤석열 취임, 용산 이전)

단순 비교가 왜 안 되는지는 이미 봤다. 처치군 도로는 원래부터 교통량이 많은 주요 교량이다. "이전 후 처치군의 교통량"만 보면 이전의 효과와 원래의 도로 차이가 섞인다.

<strong>DID의 전략</strong>:

1. <strong>첫 번째 차이 (시간 차이)</strong>: 처치군의 이전 후 교통량 - 처치군의 이전 전 교통량
   - 이것은 "이전의 효과 + 시간에 따른 자연 변화"를 포함한다
2. <strong>두 번째 차이 (집단 간 차이)</strong>: 대조군의 이전 후 교통량 - 대조군의 이전 전 교통량
   - 이것은 "시간에 따른 자연 변화"만 포함한다
3. <strong>이중차분</strong>: (첫 번째 차이) - (두 번째 차이)
   - 시간에 따른 자연 변화가 상쇄되고, <strong>이전의 순수한 효과</strong>만 남는다

### 2×2 DID 테이블

| | 이전 전 (Pre) | 이전 후 (Post) | 시간 차이 |
|--|--|--|--|
| <strong>처치군</strong> (출근길 도로) | $\bar{Y}_{T,\text{pre}}$ | $\bar{Y}_{T,\text{post}}$ | $\Delta_T = \bar{Y}_{T,\text{post}} - \bar{Y}_{T,\text{pre}}$ |
| <strong>대조군</strong> (나머지 도로) | $\bar{Y}_{C,\text{pre}}$ | $\bar{Y}_{C,\text{post}}$ | $\Delta_C = \bar{Y}_{C,\text{post}} - \bar{Y}_{C,\text{pre}}$ |
| <strong>집단 간 차이</strong> | | | $\hat{\tau}_{\text{DID}} = \Delta_T - \Delta_C$ |

가상의 숫자로 예시를 들면:

| | 이전 전 | 이전 후 | 시간 차이 |
|--|--|--|--|
| <strong>처치군</strong> (6개 도로) | 85,000대 | 98,000대 | +13,000대 |
| <strong>대조군</strong> (133개 도로) | 52,000대 | 57,000대 | +5,000대 |
| | | | <strong>DID = +8,000대</strong> |

처치군의 교통량은 13,000대 증가했지만, 대조군도 5,000대 증가했다 (계절 효과, 경제 활동 증가 등). 대조군의 변화를 빼면, 용산 이전으로 인한 순수한 효과는 <strong>+8,000대</strong>로 추정된다.

![이중차분법(DID): 용산 이전의 인과효과 추정](images/did_diagram.svg)

### DID의 회귀식 표현

DID를 회귀분석으로 표현하면:

$$Y_{it} = \beta_0 + \beta_1 \cdot \text{Treat}_i + \beta_2 \cdot \text{Post}_t + \beta_3 \cdot (\text{Treat}_i \times \text{Post}_t) + \epsilon_{it}$$

여기서:
- $\text{Treat}_i$: 처치군이면 1, 대조군이면 0
- $\text{Post}_t$: 이전 후면 1, 이전 전이면 0
- $\text{Treat}_i \times \text{Post}_t$: <strong>교차항</strong> — 처치군이면서 이전 후인 경우에만 1

| 계수 | 의미 |
|------|------|
| $\beta_0$ | 대조군의 이전 전 평균 ($\bar{Y}_{C,\text{pre}}$) |
| $\beta_1$ | 이전 전 시점에서 처치군과 대조군의 평균 차이 (원래부터 있던 집단 간 차이) |
| $\beta_2$ | 대조군의 시간에 따른 변화 (이전과 무관한 자연 변화) |
| $\beta_3$ | <strong>DID 추정치</strong> = 인과효과 ($\hat{\tau}_{\text{DID}}$) |

<strong>$\beta_3$가 핵심이다.</strong> 이것은 지난주에 배운 교차항(interaction effect)의 계수이며, "처치군에서 이전 후에 추가로 나타난 변화"를 포착한다.

이 회귀식을 2×2 테이블과 대응시키면:

| | 이전 전 | 이전 후 |
|--|--|--|
| <strong>대조군</strong> | $\beta_0$ | $\beta_0 + \beta_2$ |
| <strong>처치군</strong> | $\beta_0 + \beta_1$ | $\beta_0 + \beta_1 + \beta_2 + \beta_3$ |

$\beta_3 = (\bar{Y}_{T,\text{post}} - \bar{Y}_{T,\text{pre}}) - (\bar{Y}_{C,\text{post}} - \bar{Y}_{C,\text{pre}})$. 정확히 2×2 테이블의 이중차분이다.

### DID가 선택 편향을 제거하는 방법

DID가 선택 편향을 제거할 수 있는 이유는, <strong>시간-불변(time-invariant) 차이</strong>가 차분 과정에서 상쇄되기 때문이다.

처치군 도로가 대조군 도로보다 원래 교통량이 33,000대 많다. 이 차이는 이전 전에도, 이전 후에도 동일하다. 첫 번째 차이(시간 차이)를 구하면 이 33,000대는 사라진다. <strong>각 도로의 "고정 특성"(위치, 차선 수, 주변 인구 등)이 차분으로 제거되는 것이다.</strong>

이것은 사실 패널 데이터에서의 <strong>고정효과(fixed effects)</strong>와 동일한 논리다. 고정효과 모형은 각 개체(도로)의 시간-불변 특성을 제거함으로써, 시간에 따른 변화만을 비교한다.

## 6. DID의 핵심 가정: 평행 추세(Parallel Trends)

### 평행 추세 가정이란

DID가 인과효과를 올바르게 추정하려면 한 가지 핵심 가정이 필요하다:

> <strong>평행 추세 가정 (Parallel Trends Assumption)</strong>: 처치가 없었다면, 처치군과 대조군의 결과 변수는 같은 추세(trend)를 따랐을 것이다.

수식으로 쓰면 다음과 같다.

$$E[Y_{it}(0) \mid D_i = 1] - E[Y_{it}(0) \mid D_i = 0] = \text{상수} \quad \text{(시간 } t \text{에 따라 변하지 않음)}$$

기호 하나씩 풀면:

- $Y_{it}(0)$: <strong>잠재적 결과 (potential outcome)</strong>. 단위 $i$가 시점 $t$에 <strong>처치를 받지 않았을 때</strong>의 결과 변수 값. 앞의 2장에서 본 잠재적 결과 표기를 그대로 가져온 것이다. 예: 도로 $i$가 시점 $t$에 (용산 이전이 일어나지 않았다면 보였을) 교통량.
- $D_i = 1$ / $D_i = 0$: 단위 $i$의 <strong>처치군/대조군</strong> 표시. $D_i$에 시간 인덱스 $t$가 없는 점에 주목하자. DID의 기본 세팅에서는 "이 단위가 처치군에 속하는가"는 시간에 따라 변하지 않는 고정된 속성이다.
- $E[Y_{it}(0) \mid D_i = 1]$: <strong>"처치군에 속한 단위들이, 만약 처치를 받지 않았더라면, 시점 $t$에 보였을 결과의 평균"</strong>. 한 마디로 <strong>처치군의 반사실 평균</strong>이다 — 실제로는 관측되지 않는 양.
- $E[Y_{it}(0) \mid D_i = 0]$: <strong>"대조군에 속한 단위들이 시점 $t$에 보인 결과의 평균"</strong>. 이쪽은 대조군은 실제로 처치를 안 받았으므로 $Y_{it}(0)$가 그대로 관측된다.
- 좌변 전체: <strong>"같은 시점 $t$에서, 처치군의 반사실 평균과 대조군의 실제 평균의 차이"</strong>.
- 우변 "상수": 이 차이가 $t$에 의존하지 않는다는 뜻. 시점이 1월이든 6월이든 12월이든 그 차이는 항상 같은 값.

요약하면 이 식은 <strong>"처치가 없었다고 가정했을 때, 처치군 평균과 대조군 평균의 격차가 시간이 흘러도 일정하다"</strong>는 주장이다. 격차가 100이라면 매 시점 100, 격차가 -50이라면 매 시점 -50. 격차의 절대 크기는 무엇이든 상관없고, 그것이 <strong>시간에 따라 흔들리지 않는다</strong>는 점이 핵심이다.

이를 그래프로 옮기면: 가로축이 시간, 세로축이 $E[Y(0)]$인 그림에서 처치군의 반사실 곡선과 대조군의 실제 곡선이 <strong>평행</strong>하게 가야 한다(같은 기울기). 두 곡선의 <strong>수준(level)이 같을 필요는 없다</strong> — 처치군이 원래 33,000대 더 많은 상태로 평행하게 가도 된다. 중요한 것은 <strong>변화의 패턴(기울기·추세)</strong>이 동일한 것이다.

DID 추정량이 이 가정 하에서 왜 깨끗하게 작동하는지도 식에서 바로 보인다. DID는 "(처치군 사후 - 처치군 사전) - (대조군 사후 - 대조군 사전)"인데, 처치가 없었다고 가정한 세계에서 이 값을 계산하면 처치군 두 시점의 차이도 대조군 두 시점의 차이와 같아져서 결과적으로 0이 된다. 따라서 실제 데이터에서 DID가 0이 아닌 값을 잡았다면, 그 차이가 곧 <strong>처치의 인과효과</strong>로 해석될 수 있다.

![평행 추세 성립 vs 위반](images/parallel_trends.svg)

### 왜 이 가정이 중요한가

평행 추세 가정이 성립하지 않으면 DID 추정치가 편향된다.

<strong>가정이 성립하는 경우</strong>: 처치가 없었다면 처치군의 교통량 변화가 대조군과 같았을 것이므로, 대조군의 변화를 빼면 순수한 처치 효과만 남는다.

<strong>가정이 위반되는 경우</strong>: 예를 들어, 처치군 도로 인근에서 용산 이전과 무관하게 대형 상업시설이 개장했다면? 처치군의 교통량은 이전이 없었어도 대조군보다 더 증가했을 것이다. 이때 DID 추정치에는 "상업시설 효과"가 "이전 효과"로 섞여 들어간다.

```mermaid
flowchart TD
    A["<b>평행 추세 성립</b>"] --> B["처치 없었으면<br/>처치군과 대조군이<br/>같은 추세"]
    B --> C["DID = 순수 처치 효과"]

    D["<b>평행 추세 위반</b>"] --> E["처치 없었어도<br/>추세가 달랐을 것"]
    E --> F["DID = 처치 효과<br/>+ 추세 차이 (편향)"]
```

### 평행 추세를 어떻게 검증하는가

<strong>엄밀히 말하면, 평행 추세 가정은 검증 불가능하다.</strong> 왜냐하면 "처치가 없었다면 처치군이 어떻게 변했을 것인가"는 반사실(counterfactual)이기 때문이다. 관측할 수 없는 것을 검증할 수는 없다.

그러나 간접적 증거를 제시할 수 있다:

<strong>사전 추세 검증 (Pre-treatment trend test)</strong>: 처치가 일어나기 <strong>전</strong>의 데이터에서, 처치군과 대조군의 추세가 평행했는지 확인한다.

- 용산 이전 사례: 2022년 5월 이전의 수 개월간, 출근길 6개 도로와 나머지 133개 도로의 교통량 변화 추세가 평행했는지 시각적으로 확인
- 평행했다면: "처치 전에는 추세가 같았으니, 처치 후에도 같았을 것이라는 가정이 합리적이다"
- 평행하지 않았다면: DID의 핵심 가정이 의심스러우므로, 추정치를 신뢰하기 어렵다

<strong>Event Study Plot (사건 연구 그림)</strong>: 사전 추세 검증을 시각적·정량적으로 한 번에 보여 주는 표준적인 방법이다. 아이디어는 단순하다. "처치 시점 전후의 <strong>각 기간마다</strong> 처치군과 대조군의 차이를 따로따로 추정해서, 그것을 시간 축에 줄 세워 그려본다." 처치 이전 기간의 추정치들이 모두 0 근처라면 평행 추세가 처치 전에는 성립했다는 증거가 된다.

회귀식으로 쓰면 다음과 같다.

$$Y_{it} = \alpha_i + \lambda_t + \sum_{k \neq -1} \gamma_k \cdot \mathbf{1}[t - t^{\ast} = k] \cdot \text{Treat}_i + \epsilon_{it}$$

식이 다소 무겁게 보이지만, 기호 하나씩 풀면 어렵지 않다.

- $Y_{it}$: 단위 $i$ (예: 도로 $i$)가 시점 $t$에 보인 결과 변수. 예: $t$월의 교통량.
- $\alpha_i$: <strong>단위 고정효과 (unit fixed effect)</strong>. 도로 $i$가 원래부터 가지고 있는 시간에 따라 변하지 않는 특성(폭, 위치, 차선 수 등)을 흡수한다. "도로별로 다른 평균 수준"을 제거하는 역할.
- $\lambda_t$: <strong>시간 고정효과 (time fixed effect)</strong>. 시점 $t$에 <strong>모든 도로에 공통으로</strong> 작용한 충격(계절, 경기, 전국적 사건 등)을 흡수한다. "모든 도로가 같은 시기에 같이 변한 부분"을 제거하는 역할.
- $\text{Treat}_i$: 단위 $i$가 처치군이면 1, 대조군이면 0인 더미. 시간에 따라 변하지 않는다.
- $t^{\ast}$: <strong>처치가 시작된 시점</strong> (예: 용산 이전이 시행된 2022년 5월).
- $k = t - t^{\ast}$: 처치 시점으로부터의 <strong>상대적 기간</strong>. $k = -3$은 "처치 3개월 전", $k = 0$은 "처치 당월", $k = 2$는 "처치 2개월 후".
- $\mathbf{1}[t - t^{\ast} = k]$: <strong>지시함수 (indicator function)</strong>. 괄호 안 조건이 참이면 1, 거짓이면 0. 즉 "지금 보고 있는 관측치가 처치 시점으로부터 정확히 $k$만큼 떨어진 기간인가?"를 1/0으로 표시한다.
- $\gamma_k$: 우리가 진짜 보고 싶은 계수. <strong>"처치 시점에서 $k$만큼 떨어진 기간에, 처치군과 대조군의 차이가 (기준 기간 대비) 얼마나 더 벌어졌는가"</strong>를 나타낸다.
- $k \neq -1$이라는 조건: 합 기호 $\sum$ 아래에 붙은 조건이다. <strong>"$k = -1$인 항은 빼고 모두 더한다"</strong>는 뜻. $k = -1$ (처치 직전 1기)을 <strong>기준 기간(reference period)</strong>으로 잡고, 그 시점의 처치군-대조군 차이를 "0"으로 놓은 다음, 나머지 모든 $\gamma_k$를 그 기준 대비 값으로 해석하기 위해서다. 기준을 정하지 않으면 더미 변수들이 완전공선성을 일으켜 계수가 식별되지 않는다.
- $\epsilon_{it}$: 오차항.

이 모형은 결국 <strong>"처치 시점 1기 전($k = -1$)에는 두 집단 차이를 0으로 고정해 놓고, 다른 모든 기간 $k$에 대해 두 집단 차이가 얼마나 다른지 따로따로 추정한다"</strong>는 말이다. 추정된 $\hat{\gamma}_k$들을 가로축을 $k$, 세로축을 $\hat{\gamma}_k$로 해서 그리면 event study plot이 된다.

전형적인 event study plot은 다음과 같은 모양이다 (실제 논문에 등장하는 가상의 결과 예시).

![Event Study Plot 예시](images/event_study_plot.svg)

이 그림에서 읽어야 할 것은 두 가지다. 첫째, <strong>처치 전 구간(왼쪽, $k < 0$)의 점들이 모두 0 근처에 모여 있고 신뢰구간이 0을 포함</strong>한다 — 사전 추세가 평행했다는 증거. 둘째, <strong>처치 시점($k = 0$)을 지나면서 계수가 0에서 유의하게 벗어나며 시간이 갈수록 효과가 누적</strong>되는 패턴이 보인다 — 처치 효과가 실재하며 동적으로 커지고 있다는 해석이 가능하다. $k = -1$ 시점은 기준 기간이라 정의상 $\hat{\gamma}_{-1} = 0$으로 고정되어 있고, 신뢰구간이 표시되지 않는다.

이때 그림을 보고 평가하는 기준은 다음과 같다.

- <strong>처치 전 기간 ($k < 0$)</strong>: $\hat{\gamma}_k \approx 0$이어야 한다. 만약 처치 전인데도 $\hat{\gamma}_{-3}, \hat{\gamma}_{-2}$ 등이 0에서 유의하게 벗어나 있다면, "처치가 일어나기 전부터 이미 두 집단의 추세가 달랐다"는 신호이며 평행 추세 가정이 의심된다.
- <strong>처치 후 기간 ($k \geq 0$)</strong>: $\hat{\gamma}_k$가 0에서 유의하게 벗어나면 처치 효과가 발생했다는 증거. 시간에 따라 효과가 즉시 나타나는지, 점점 커지는지, 일시적인지 등 <strong>동적 패턴</strong>도 함께 볼 수 있다는 점이 단일 DID 회귀보다 풍부한 장점이다.

<strong>핵심</strong>: Event study plot에서 처치 전 계수들이 모두 0 근처에 있으면, 평행 추세 가정이 처치 전에는 성립했다는 간접 증거가 된다. 그러나 이것이 처치 후에도 성립한다는 보장은 없다는 점을 항상 인식해야 한다. 어디까지나 <strong>"처치 직전까지의 패턴이 비슷했으니, 처치 후에도 비슷했을 것으로 가정하는 것이 합리적이다"</strong>라는 정도의 정황 증거다.

### 평행 추세 가정이 위반될 수 있는 상황들

| 상황 | 위반 이유 | 예시 |
|------|----------|------|
| <strong>차별적 시간 추세</strong> | 처치군과 대조군이 서로 다른 경향을 따름 | 처치군 도로 인근의 재개발로 인한 교통량 자연 증가 |
| <strong>다른 정책의 동시 시행</strong> | 처치와 동시에 처치군에만 영향을 미치는 다른 사건 발생 | 이전 시점에 처치군 도로에서 도로 공사가 시작됨 |
| <strong>예측 효과 (Anticipation)</strong> | 처치군이 처치를 예상하고 사전에 행동 변화 | 이전 발표 직후, 출근길 우회가 시작됨 (처치 전에 이미 효과 발생) |

## 7. 도구변수(Instrumental Variables) — 이론적으로 우아하지만 실전에서 가장 위험한 전략

### DID를 쓸 수 없는 상황

DID는 "처치 전/후"와 "처치군/대조군"이 명확히 구분되는 상황에서 작동한다. 그런데 많은 인과적 질문에서 이런 구조가 없다.

- "교육 연수가 소득에 미치는 효과는?" — 교육을 "받기 전/후"로 나누기 어렵고, 교육 수준은 개인의 선택이다
- "흡연이 건강에 미치는 효과는?" — 흡연 여부는 무작위가 아니라 개인의 선택이다

이런 상황에서 OLS를 돌리면 내생성이 발생한다. 교육 연수($X$)와 소득($Y$)의 관계에서, 능력($Z$, 관측 불가)이 교육과 소득 모두에 영향을 미치기 때문이다. $X$가 내생적이므로 $E[\epsilon | X] \neq 0$이다.

도구변수(IV)는 이런 상황을 위해 고안된 방법이다. 아이디어 자체는 우아하다. 그러나 <strong>실전에서 설득력 있게 적용하기가 매우 어렵고, 현대 사회과학 방법론에서 IV에 대한 회의론이 점점 커지고 있다</strong>는 점을 미리 밝혀둔다. 왜 그런지는 뒤에서 다룬다.

### 도구변수의 아이디어

도구변수가 왜 필요한지부터 구체적인 사회과학 사례에서 출발해보자.

<strong>출발 질문: "교육이 소득에 미치는 인과효과는 얼마인가?"</strong>

노동사회학·교육사회학에서 오래된 핵심 질문이다. 단순히 OLS로 다음 회귀를 돌린다고 해보자.

$$\text{소득}_i = \beta_0 + \beta_1 \cdot \text{교육연수}_i + \epsilon_i$$

데이터에서 $\hat{\beta}_1$이 양수로 나오면 "교육이 소득을 높인다"고 말하고 싶다. 그러나 여기에는 함정이 있다. <strong>$\epsilon_i$ 안에는 우리가 관측하지 못하는 "능력(ability)", "가정 배경", "동기", "사회 자본" 같은 변수들이 모두 들어 있다</strong>. 그리고 이 변수들은 동시에 두 가지 일을 한다.

- 능력이 높은 사람은 학교를 더 오래 다닐 가능성이 크다 → <strong>$X$(교육)를 움직임</strong>
- 능력이 높은 사람은 같은 교육 연수라도 소득이 더 높다 → <strong>$Y$(소득)를 움직임</strong>

이 상황에서 OLS의 $\hat{\beta}_1$은 두 가지가 섞인 추정치가 된다.

1. 진짜 인과효과: 교육 1년 더 받으면 소득이 얼마나 더 오르는가
2. 능력 효과의 누수: 원래 능력이 높은 사람이 교육도 더 받고 소득도 더 높아서 생긴 상관

문제는 OLS가 이 두 부분을 구별하지 못한다는 것이다. 그래서 $\hat{\beta}_1$은 보통 진짜 인과효과보다 과대 추정된다 (이를 <strong>능력 편향, ability bias</strong>이라 부른다).

<strong>변이를 두 종류로 쪼개기</strong>

여기서 결정적 통찰이 등장한다. 사람들의 교육 연수가 다른 이유는 사실 여러 가지다.

- 어떤 사람은 능력이 높아서 학교에 오래 다닌다 (능력이 $\epsilon$ 안에 있으니 <strong>내생적 변이</strong>)
- 어떤 사람은 가정환경이 좋아서 학교에 오래 다닌다 (가정환경도 $\epsilon$ 안 → <strong>내생적 변이</strong>)
- 어떤 사람은 <strong>의무교육법 개정으로 우연히 1년 더 학교에 다니게 됐다</strong> — 능력·가정환경과 무관하게 외부 제도가 강제로 만든 변이 (<strong>외생적 변이</strong>)
- 어떤 사람은 <strong>대학이 자기 동네에 새로 생기는 바람에</strong> 대학에 진학했다 — 능력과 무관하게 지리적 우연이 만든 변이 (<strong>외생적 변이</strong>)

즉 같은 "교육 연수"라는 변수 안에도 두 종류의 변이가 섞여 있다.

- <strong>외생적 변이</strong>: $\epsilon$ 안의 능력·가정환경 등과 무관하게 $X$를 움직이는 부분. 의무교육 연한 개정, 대학 신설, 자녀 출생 분기(졸업 시점에 영향)처럼 <strong>본인의 선택이나 특성과 무관한 외부 요인</strong>이 만들어낸 부분.
- <strong>내생적 변이</strong>: $\epsilon$ 안의 요인들과 함께 움직이는 부분. 능력이 높아서, 부모가 부유해서, 동기가 강해서 등 <strong>본인의 특성 자체</strong>가 만들어낸 부분.

OLS는 이 둘을 구별하지 못하고 교육 연수의 모든 변이를 한꺼번에 쓴다. 그래서 $\hat{\beta}_1$에 내생적 변이의 효과가 새어 들어와 편향이 생긴다.

<strong>도구변수의 핵심 아이디어</strong>

여기서 자연스럽게 따라오는 발상이 도구변수다.

> <strong>$X$의 변이 중에서 외생적인 부분만 따로 골라내서, 그 부분이 $Y$를 얼마나 움직였는지만 보자.</strong>

문제는 "외생적인 부분"이 데이터에 라벨이 붙어 있는 게 아니라는 것이다. 능력에 의한 교육과 의무교육법에 의한 교육이 한 변수("교육 연수") 안에 섞여 있다. 그래서 우리는 외생적 변이를 <strong>간접적으로</strong> 분리해야 한다. 방법: <strong>외부에서 외생성이 분명한 변수 $Z$를 가져와서, 그 $Z$가 만들어낸 $X$의 움직임만 추적한다</strong>. 이 $Z$를 <strong>도구변수(Instrumental Variable, IV)</strong>라 부른다.

위 교육-소득 예에서 실제로 쓰인 $Z$들을 보자.

- <strong>의무교육 연한 개정</strong> (Acemoglu & Angrist 2000 등): 어느 해에 의무교육이 8년 → 9년으로 바뀌면, 그 해 직전과 직후 출생 코호트는 능력·가정환경이 비슷한데 교육 연수만 다르다. 이때 코호트의 의무교육 연한($Z$)은 교육($X$)을 흔들지만 소득($Y$)에 직접 영향을 미치진 않는다.
- <strong>출생 분기</strong> (Angrist & Krueger 1991): 미국 의무교육법은 만 16세에 학교를 떠날 수 있게 했는데, 출생 분기에 따라 그때까지 다닌 학기 수가 달라진다. 출생 분기는 능력과 무관(외생적)하지만 교육 연수에 영향을 준다.
- <strong>대학과의 지리적 근접성</strong> (Card 1995): 사는 동네 근처에 대학이 있으면 대학 진학 가능성이 높아진다. 근접성은 (대체로) 본인 능력과 무관하지만 교육을 흔든다.

이런 $Z$들이 가진 공통점은 명확하다. <strong>"교육 연수를 흔들기는 하지만, 본인이 원해서 그런 게 아니라 외부 제도·우연이 만든 변이"</strong>라는 것. 그래서 이 $Z$가 만들어낸 교육 연수의 변이는 능력·가정환경과 무관 — 즉 외생적이다. 그 외생적 변이가 소득을 얼마나 움직였는지 보면, 교육의 인과효과를 깨끗하게 식별할 수 있다.

<strong>정치학의 예: 미디어 노출이 투표 행태에 미치는 효과</strong>

정치학에서도 같은 논리가 자주 등장한다. "TV 정치 뉴스 시청량($X$)이 투표율($Y$)에 미치는 영향"을 보고 싶다고 하자. 그러나 정치에 원래 관심 많은 사람일수록 뉴스도 많이 보고 투표도 많이 한다 — 정치적 관심도가 $\epsilon$에 들어가 내생성을 만든다. OLS로 돌리면 "뉴스 시청의 효과"인지 "원래 정치 관심 많은 사람의 효과"인지 분리되지 않는다.

DellaVigna & Kaplan (2007)의 도구변수 전략: <strong>Fox News가 어느 지역에 케이블로 송출되었는가</strong>를 $Z$로 썼다. 케이블 회사가 어느 지역에 Fox News 채널을 편성할지는 시청자의 정치 성향과는 (대체로) 무관한 사업적 결정이었다. 이 도구로 만들어진 "Fox News에 노출되었는가"의 변이는 시청자의 원래 정치 성향과 무관 — 외생적. 그 변이가 공화당 득표율을 얼마나 움직였는지 본 결과, 미디어 노출의 인과적 효과를 식별할 수 있었다.

이런 사례들이 보여주는 IV의 본질은 다음과 같다. <strong>"본인이 선택할 수 없거나 본인의 특성과 무관한 외부 충격을 찾아내, 그것이 만든 $X$의 변이만 분리해서 $Y$와의 관계를 본다."</strong> 이때 $Z$의 자격 조건은 두 가지다.

![도구변수(IV)의 인과 구조](images/iv_dag.svg)

<strong>조건 1 — 관련성 (Relevance)</strong>:

$$\text{Cov}(Z, X) \neq 0$$

도구변수 $Z$는 내생적 변수 $X$와 상관이 있어야 한다. $Z$가 $X$를 "밀어줘야(push)" 한다.

<strong>조건 2 — 배제 제약 (Exclusion Restriction)</strong>:

$$\text{Cov}(Z, \epsilon) = 0$$

도구변수 $Z$는 $X$를 <strong>통해서만</strong> $Y$에 영향을 미쳐야 한다. $Z$가 $Y$에 직접 영향을 미치면 안 된다.

```mermaid
flowchart LR
    Z["<b>Z</b><br/>도구변수"] -->|"관련성<br/>Cov(Z,X) ≠ 0"| X["<b>X</b><br/>내생적 변수"]
    X -->|"인과효과<br/>β₁"| Y["<b>Y</b><br/>결과 변수"]
    U["<b>U</b><br/>관측 불가<br/>(능력 등)"] -->|"내생성"| X
    U -->|"내생성"| Y
    Z -.-x|"❌ 배제 제약<br/>직접 영향 없음"| Y
```

### 2SLS: 2단계 최소제곱법

이번 절은 앞 절에서 등장한 사례 중 하나 — <strong>Card (1995)의 "동네 근처 대학" 사례</strong>를 일관된 예시로 가져가며 설명한다. 설정을 다시 정리하면:

- $Y_i$ = 개인 $i$의 성인기 소득 (관측 가능)
- $X_i$ = 개인 $i$의 교육 연수 (관측 가능, 그러나 내생적)
- $Z_i$ = 개인 $i$가 18세 즈음 살던 동네에 4년제 대학이 있었는가 (또는 가장 가까운 대학까지의 거리) — 도구변수
- $\epsilon_i$ = 능력·가정환경·동기 같은 관측 불가 요인 (이 안에 $X$를 흔드는 것들이 들어 있다)

OLS로 "교육 → 소득"을 그대로 추정하면 능력 편향이 생긴다는 점은 앞 절에서 봤다. 이 편향을 어떻게 우회할 것인가가 2SLS의 핵심이다.

<strong>왜 굳이 "두 번 돌리는" 절차가 필요한가</strong>

우리가 원래 추정하고 싶은 식은

$$\text{소득}_i = \beta_0 + \beta_1 \cdot \text{교육연수}_i + \epsilon_i$$

다. 여기서 $\beta_1$이 "교육 1년의 인과적 소득 효과"를 의미하길 바란다. 그런데 두 가지 자연스러운 시도가 모두 실패한다.

- <strong>시도 A: 교육연수를 그대로 넣는다 (= OLS)</strong>. 교육연수의 변이 안에는 "능력이 높아서 더 다닌 변이"가 섞여 있고, 능력은 $\epsilon$ 안에 있다 → $\text{Cov}(\text{교육}, \epsilon) \neq 0$ → 편향.
- <strong>시도 B: 교육연수 대신 대학 근접성을 넣는다</strong>. 즉 $\text{소득}_i = b_0 + b_1 \cdot \text{근접성}_i + e_i$를 돌린다. 이걸 <strong>축약형(reduced form)</strong>이라 부르는데, 여기서의 $\hat{b}_1$은 "동네에 대학이 있으면 소득이 얼마나 더 높은가"를 나타낸다. 우리가 알고 싶은 "교육 1년이 소득에 미치는 효과"는 아니다.

<strong>"교육연수를 그대로 쓸 수도 없고, 대학 근접성으로 대체할 수도 없다"</strong>는 딜레마. 2SLS의 발상은 이 둘을 결합한다. <strong>교육연수의 변이 중에서 "대학이 동네에 새로 생기는 바람에 학교를 더 다니게 된" 외생적 부분만 따로 떼어내, 그 부분이 소득과 어떤 관계인지 본다</strong>. 떼어내는 과정이 1단계, 떼어낸 것을 본추정에 쓰는 게 2단계 — 그래서 "2단계 최소제곱법".

자연스러운 후속 질문: <strong>왜 OLS 한 번으로는 안 되는가</strong>. OLS는 $X$의 변이를 쪼개서 일부만 골라 쓰는 기능이 없다. 교육연수에 능력이 만든 변이와 대학 신설이 만든 변이가 섞여 있어도, OLS는 둘을 한 덩어리로 처리한다. 그래서 일부만 쓰려면 <strong>별도의 회귀로 먼저 변이를 물리적으로 분리</strong>해 새 변수로 만들어 두고, 그 새 변수를 본 회귀의 설명변수로 다시 넣어야 한다. 이 분리 작업이 1단계 OLS다.

<strong>1단계 (First Stage) — "교육연수의 외생적 변이만 추출하기"</strong>

먼저 교육연수를 대학 근접성에 대해 회귀한다.

$$\text{교육연수}_i = \pi_0 + \pi_1 \cdot \text{근접성}_i + v_i$$

각 항의 의미를 Card 사례로 풀면 다음과 같다.

- $\pi_0$: 절편. 근접성이 0인 사람(동네에 대학 없는 경우)의 평균 교육연수.
- $\pi_1$: 핵심 계수. <strong>"동네에 대학이 있는 사람은 없는 사람보다 평균 교육연수가 얼마나 더 길어지는가"</strong>를 나타낸다. Card (1995)에서 이 값은 양수로 추정된다 — 근처에 대학이 있으면 통학·기숙 비용이 낮아져 진학률이 올라간다. 관련성 조건이 강하다는 건 이 $\pi_1$이 0에서 충분히 멀고 통계적으로 유의하다는 뜻이다. 실무적으로는 1단계 $F$-통계량으로 점검한다.
- $v_i$: 1단계의 잔차. <strong>"대학 근접성으로는 설명되지 않는 교육연수의 나머지 변이"</strong>. 능력이 높아서 더 다닌 부분, 가정이 부유해서 더 다닌 부분 등 <strong>내생적 변이가 모조리 여기에 떨어진다</strong>.

이 1단계 회귀를 OLS로 추정한 뒤 예측값을 구한다.

$$\widehat{\text{교육연수}}_i = \hat{\pi}_0 + \hat{\pi}_1 \cdot \text{근접성}_i$$

이 $\widehat{\text{교육연수}}_i$가 2SLS의 심장이다. 정의상 이 값은 오직 근접성의 함수다 — 즉 <strong>"교육연수 중에서, 그 사람이 동네에 대학이 있어서(없어서) 더(덜) 다닌 만큼"</strong>이라는 부분만 모아둔 값이다. 능력이 높아서 더 다닌 부분, 부모가 교육열이 높아서 더 다닌 부분은 모두 잔차 $\hat{v}_i$로 떨어져 나갔다.

직관적으로 말하면, $\widehat{\text{교육연수}}_i$는 <strong>"대학 신설/근접성이라는 외생적 충격이 강제로 만든 가짜(synthetic) 교육연수"</strong>다. 같은 사람이라도 동네에 대학이 있느냐 없느냐만 다를 때 교육연수가 어떻게 달라졌을지를 예측한 값.

<strong>2단계 (Second Stage) — "정제된 교육연수로 소득 설명하기"</strong>

이제 원래 보고 싶었던 식

$$\text{소득}_i = \beta_0 + \beta_1 \cdot \text{교육연수}_i + \epsilon_i$$

에서 내생적인 실제 교육연수 대신, 1단계에서 만든 $\widehat{\text{교육연수}}_i$를 넣어 다시 OLS를 돌린다.

$$\text{소득}_i = \beta_0 + \beta_1 \cdot \widehat{\text{교육연수}}_i + \eta_i$$

$\widehat{\text{교육연수}}_i$는 오직 근접성($Z$)으로 만들어졌고, 근접성은 배제 제약에 의해 능력·가정환경 등과 무관하다고 가정했으므로, 이 변수는 $\epsilon$과 무관하다. 즉 외생적이다. 따라서 이 2단계 회귀의 $\hat{\beta}_1$은 OLS와 달리 능력 편향이 빠진 <strong>인과효과 추정치</strong>다. Card (1995)에서 이 $\hat{\beta}_1$은 OLS 추정치보다 오히려 약간 더 컸는데, 이는 IV가 잡아낸 compliers(대학 신설로 진학하게 된 사람들)에 대한 효과가 평균보다 크다는 해석으로 이어졌다.

(주의: 실제 통계 소프트웨어에서 IV를 추정할 때는 1단계와 2단계를 손으로 따로 돌리지 않고 <strong>`ivreg`, `iv2sls` 같은 통합 명령어</strong>를 쓴다. 손으로 두 번 OLS를 돌리면 점추정치는 같지만 <strong>2단계의 표준오차가 잘못 계산</strong>되기 때문이다. 2단계가 $\widehat{\text{교육연수}}_i$를 "관측된 변수"로 취급해 추정 오차를 무시하기 때문에 표준오차가 과소 추정된다. 전용 명령어는 이 부분을 자동으로 보정해 준다.)

<strong>왈드 추정량 (Wald estimator) — 단일 IV의 닫힌 형태</strong>

도구변수가 하나일 때 위 2단계 절차를 끝까지 풀어쓰면, IV 추정치는 다음과 같이 두 공분산의 비율로 깔끔하게 정리된다.

$$\hat{\beta}_1^{\text{IV}} = \frac{\text{Cov}(Z, Y)}{\text{Cov}(Z, X)} = \frac{\text{reduced form}}{\text{first stage}}$$

Card 사례에 그대로 옮기면 다음 식이 된다.

$$\hat{\beta}_1^{\text{IV}} = \frac{\text{Cov}(\text{근접성},\ \text{소득})}{\text{Cov}(\text{근접성},\ \text{교육연수})}$$

각 부분의 의미를 한 줄씩 풀면:

- 분자 $\text{Cov}(\text{근접성}, \text{소득})$: <strong>"동네에 대학이 있는 사람과 없는 사람의 평균 소득 차이"</strong> (대략적으로). 이걸 reduced form이라 부른다. 근접성이 (오직 교육을 통해서) 소득에 미치는 총 영향.
- 분모 $\text{Cov}(\text{근접성}, \text{교육연수})$: <strong>"동네에 대학이 있는 사람과 없는 사람의 평균 교육연수 차이"</strong>. 1단계에서 본 양으로, 근접성이 교육에 미치는 영향.

이 둘을 나눈다는 것의 의미를 풀어 보자. 분자는 "대학 신설 충격이 소득을 얼마나 움직였는가"를 잡는다. 그런데 그 충격은 교육연수를 매개로 작용했으므로, "교육연수 1년 변화당 소득 변화"로 환산하려면 같은 충격이 <strong>교육연수를 얼마나 움직였는지로 정규화</strong>해야 한다. 그것이 분모다. 결과적으로 <strong>"교육이 1년 늘 때 소득이 얼마나 늘었는가"</strong>가 남는다 — 이것이 인과효과 $\beta_1$이다.

비유로 말하면, 대학 신설이라는 외부 충격이 일으킨 도미노를 따라가는 것이다. 충격이 교육연수를 흔들고($\text{Cov}(\text{근접성}, \text{교육})$), 교육연수가 다시 소득을 흔든다($\beta_1$). 우리가 관측하는 "충격 → 소득"의 전체 흔들림($\text{Cov}(\text{근접성}, \text{소득})$)을 "충격 → 교육"의 흔들림으로 나누면, 가운데 단계인 "교육 → 소득"의 기울기가 분리되어 나온다. 이때 배제 제약("대학 근접성은 교육을 통해서만 소득에 영향")이 결정적이다 — 만약 동네에 대학이 있다는 사실이 지역 노동시장·부모 소득 같은 다른 경로로 소득에 직접 영향을 미친다면, 분자에 그 경로의 영향이 섞여 들어가 식별이 깨진다.

<strong>OLS의 공분산 공식과 비교하면 — 같은 형태, 다른 의미</strong>

단순 OLS에서 회귀계수가 공분산 비율로 표현된다는 사실을 떠올리자. Card 설정에서는 OLS 추정량이 다음과 같다.

$$\hat{\beta}_1^{\text{OLS}} = \frac{\text{Cov}(\text{교육}, \text{소득})}{\text{Var}(\text{교육})} = \frac{\text{Cov}(\text{교육}, \text{소득})}{\text{Cov}(\text{교육}, \text{교육})}$$

왈드 추정량과 나란히 놓고 보자.

| 추정량 | 공식 | 분자 | 분모 |
|--------|------|------|------|
| OLS | $\dfrac{\text{Cov}(\text{교육}, \text{소득})}{\text{Cov}(\text{교육}, \text{교육})}$ | 교육과 소득이 함께 움직인 정도 (능력·근접성 등 모든 원인에서) | 교육의 변이 총량 (능력이 만든 변이 + 근접성이 만든 변이 + …) |
| IV (왈드) | $\dfrac{\text{Cov}(\text{근접성}, \text{소득})}{\text{Cov}(\text{근접성}, \text{교육})}$ | 근접성과 소득이 함께 움직인 정도 | 근접성이 만든 교육의 변이만 |

<strong>형태는 거의 같다.</strong> 둘 다 "분자가 소득과의 공분산, 분모가 원인 변수 자체/도구와의 공분산"인 비율이다.

<strong>그러나 분모가 결정적으로 다르다.</strong> OLS의 분모 $\text{Cov}(\text{교육}, \text{교육}) = \text{Var}(\text{교육})$은 <strong>교육연수의 모든 변이</strong>를 인정한다 — 능력이 만든 변이도, 가정환경이 만든 변이도, 근접성이 만든 변이도 모두 한 덩어리. 그러면 분자에도 그 모든 원인이 만든 "교육-소득 공동 변화"가 섞이고, 능력 편향이 그대로 누수된다. 반면 IV의 분모 $\text{Cov}(\text{근접성}, \text{교육})$은 <strong>"교육 변이 중 근접성이 만든 부분"만</strong>을 인정한다. 분자 $\text{Cov}(\text{근접성}, \text{소득})$도 자동으로 "근접성이 만든 교육의 변이를 매개로 소득이 움직인 부분"만 잡는다. 능력·가정환경이 만든 교육의 변이는 분자·분모 모두에서 동시에 빠져나간다.

비유로 말하면, OLS는 "교육과 소득이 같이 움직인 모든 경우의 평균 기울기"를 잡는 것이고, IV는 "대학 신설이 교육을 흔든 그 변이만큼만 봤을 때, 소득이 얼마나 반응했는가"를 잡는 것이다. <strong>같은 공분산 공식이지만 "어떤 변이를 분모로 인정하느냐"가 다르고, 그 차이가 능력 편향을 걸러내느냐 못 걸러내느냐를 가른다</strong>.

추가로 한 가지 관찰: 만약 $Z = X$로 두면(교육연수를 자기 자신의 도구로 쓰면) 왈드 공식은 정확히 OLS 공식으로 되돌아간다. 이는 "OLS는 IV의 특수한 경우" — 도구를 안 쓰고 교육연수의 변이를 그대로 다 인정해 버린 케이스 — 라는 시각으로도 볼 수 있다. 다만 그 경우 교육연수가 내생적이라면 도구 자체가 외생성 조건을 위배하므로 식별이 깨진다.

<strong>그러나 의미는 결정적으로 다르다.</strong> 분모에 무엇이 들어가느냐가 핵심이다.

- <strong>OLS</strong>: 분모가 $\text{Cov}(X, X) = \text{Var}(X)$ → <strong>$X$의 모든 변이</strong>를 분모로 쓴다. 능력이 만든 변이든, 가정환경이 만든 변이든, 의무교육법이 만든 변이든 전부 한 덩어리. 그래서 분자에도 모든 종류의 변이가 섞여 $Y$를 움직인 결과가 잡힌다 → 내생적 변이가 만든 부분이 누수되어 편향.
- <strong>IV/왈드</strong>: 분모가 $\text{Cov}(Z, X)$ → <strong>$X$의 변이 중 $Z$가 만든 부분만</strong>을 분모로 쓴다. 따라서 분자 $\text{Cov}(Z, Y)$도 "$Z$가 만든 $X$의 변이를 매개로 $Y$가 움직인 부분"만을 잡는다. 능력·가정환경 등 다른 채널이 만든 $X$의 변이는 분자·분모 모두에서 동시에 빠진다.

비유로 말하면, OLS는 "$X$가 $Y$와 같이 움직인 모든 경우의 평균 기울기"를 잡는 것이고, IV는 "$Z$가 흔든 만큼만 $X$가 움직였을 때, 그 움직임에 $Y$가 얼마나 반응했는가"를 잡는 것이다. <strong>같은 공분산 공식이지만 "어떤 변이를 분모로 인정하느냐"가 다르고, 그 차이가 인과효과를 식별하느냐 못 하느냐를 가른다</strong>.

추가로 한 가지 관찰: 만약 $Z = X$로 두면(즉 $X$를 자기 자신의 도구로 쓰면) 왈드 공식은 정확히 OLS 공식이 된다. 이는 "OLS는 IV의 특수한 경우" — 도구를 안 쓰고 $X$의 변이를 그대로 다 인정해 버린 케이스 — 라는 시각으로도 볼 수 있다. 다만 그 경우 $X$가 내생적이라면 도구 자체가 외생성 조건을 위배하므로 식별이 깨진다.

### 유명 사례들

| 연구 | $X$ (내생적) | $Y$ (결과) | $Z$ (도구변수) | 아이디어 |
|------|-------------|-----------|--------------|---------|
| Angrist (1990) | 군 복무 | 소득 | 베트남전 징병 번호 (추첨) | 징병 번호는 무작위 → 군 복무와 상관 있지만 소득에 직접 영향 없음 |
| Angrist & Krueger (1991) | 교육 연수 | 소득 | 출생 분기 | 의무교육법상 출생 분기에 따라 졸업 시기가 달라짐 → 교육 연수에 영향 |
| Miguel et al. (2004) | 경제 성장 | 내전 발생 | 강수량 | 아프리카에서 강수량은 농업 생산(= 경제 성장)에 영향, 내전에는 직접 영향 없음 |

### 도구변수의 근본적 한계 — 왜 IV가 점점 덜 쓰이는가

IV의 문제는 단순히 "어렵다"가 아니라, <strong>방법론 자체의 구조적 취약성</strong>이다.

<strong>1. 배제 제약은 검증 불가능하다 — 그리고 이것이 결정적이다</strong>

"$Z$가 $X$를 통해서만 $Y$에 영향을 미친다"는 배제 제약은 <strong>데이터로 검증할 수 없다</strong>. 이것은 순전히 이론적 논증에 의존하는 가정이며, 거의 모든 경우에 논쟁의 여지가 있다.

얼마나 심각한지 보여주는 가장 좋은 방법은, <strong>앞 절에서 우리가 "외생적이다"라며 들었던 도구변수 사례 하나하나를 다시 비판적으로 들여다보는 것</strong>이다. 외견상 깔끔해 보이던 도구들도, 자세히 따지고 들면 거의 모두 배제 제약이 흔들린다.

<strong>① 출생 분기 (Angrist & Krueger 1991) — "학기 수만 다른 게 정말일까?"</strong>

논리: 출생 분기는 본인이 선택할 수 없는 외생적 변수이고, 의무교육법이 만 16세에 학교를 떠날 수 있게 했으니, 1분기에 태어난 사람이 4분기에 태어난 사람보다 학교를 적게 다닌다. → 출생 분기는 교육 연수($X$)를 흔들 뿐 소득($Y$)에는 직접 영향이 없을 것이다.

반박: 출생 분기는 교육 외에도 여러 경로로 소득에 영향을 미칠 수 있다는 게 이후 연구에서 드러났다. (i) <strong>출생 분기는 학교 입학 시 나이</strong>를 결정한다 — 한 학년 안에서 상대적으로 나이가 많거나 어린 아이는 학업 성취·사회적 발달이 다르게 진행되어 장기 소득에 영향을 줄 수 있다 ("relative age effect"). (ii) 출생 분기는 어머니의 임신 시 계절(영양 상태, 질병 노출)과 연관되어 <strong>유아기 건강</strong>에 영향을 미칠 수 있다. (iii) 부모의 사회경제적 지위가 출생 분기와 약한 상관을 보인다는 증거도 있다. 이 중 어느 하나라도 소득에 직접 영향을 준다면 배제 제약이 깨진다. 게다가 Bound, Jaeger & Baker (1995)는 1단계 관계 자체가 매우 약해 <strong>약한 도구변수</strong> 문제까지 겹친다고 지적했다.

<strong>② 대학과의 지리적 근접성 (Card 1995) — "근처에 대학이 있는 게 정말 무작위인가?"</strong>

논리: 사는 동네 근처에 대학이 있으면 대학 진학 비용(통학·기숙 비용)이 낮아져 교육을 더 받을 가능성이 높다. 근접성은 본인 능력과 무관하므로 외생적이다.

반박: 사실 어느 동네에 대학이 들어서느냐는 무작위가 아니다. <strong>대학은 보통 인구가 많고 교육 수요·소득 수준이 높은 지역에 세워진다</strong>. 즉 대학이 있는 동네의 가구들은 평균적으로 부유하고, 교육 친화적이고, 일자리 시장도 좋다. 그러면 대학 근접성($Z$)은 교육($X$)뿐 아니라 지역 노동시장 조건과 부모 소득을 통해 자녀의 소득($Y$)에도 직접 영향을 미칠 수 있다. 배제 제약을 지키려면 "지역 효과를 모두 통제했다"고 주장해야 하는데, 그 통제가 완전한지는 검증 불가능하다.

<strong>③ Fox News 케이블 송출 (DellaVigna & Kaplan 2007) — "케이블 회사의 결정이 정말 무작위인가?"</strong>

논리: 케이블 회사가 Fox News를 어느 지역에 편성할지는 사업적 결정이고, 시청자의 정치 성향과는 무관할 것이다.

반박: 그렇게 단순하지 않다. 케이블 회사는 <strong>구독자의 수요 신호</strong>를 읽고 채널을 편성한다. 보수적 시청자가 많은 지역에 Fox News를 우선 송출했을 가능성을 배제할 수 없다. 또한 케이블 송출 여부는 도시 인프라(케이블 보급률)와 연관되어 있고, 인프라는 다시 인구 구성·소득 수준과 연관된다. 즉 $Z$(Fox News 송출)가 $Y$(공화당 득표율)에 영향을 미치는 경로가 "시청 → 정치 태도 변화" 외에도 "지역 사회경제적 특성을 통해" 있을 수 있다.

<strong>④ 강수량 (Miguel, Satyanath & Sergenti 2004) — "경제 성장이 유일한 경로인가?"</strong>

논리: 아프리카에서 강수량은 농업 생산성을 좌우해 경제 성장($X$)을 흔들고, 강수량 자체는 내전($Y$)에 직접 영향을 미칠 이유가 없다.

반박: 강수량은 경제뿐 아니라 <strong>수자원 분쟁, 가뭄으로 인한 이주, 작물 변동에 따른 질병 확산, 종족 간 토지·물 갈등</strong> 등 여러 경로로 사회 불안정에 영향을 미칠 수 있다. 어느 한 경로라도 내전 발생을 흔든다면, $Z \to Y$가 $X$(경제)를 거치지 않는 직접 경로를 갖게 되어 배제 제약이 깨진다.

<strong>공통 패턴</strong>

위 네 사례는 다른 도메인이지만 같은 구조의 비판을 받는다. <strong>"외생적이라고 주장된 $Z$가, 사실은 $X$ 외에도 다른 경로로 $Y$에 영향을 미칠 수 있다"</strong>는 것이다. 그리고 그 다른 경로가 정말 없는지는 <strong>데이터로 검증할 방법이 없다</strong>. 모든 가능한 경로를 사고실험으로 따져보고, 하나하나 "이건 별로 안 중요할 것이다"라고 논증할 수밖에 없다.

DID의 평행 추세 가정도 검증 불가능하지만, 적어도 <strong>사전 추세를 통해 간접적 증거</strong>를 제시할 수 있다. 배제 제약에는 이런 간접 검증 수단조차 없다 — 이것이 IV가 다른 준실험적 방법보다 학계의 신뢰를 잃어가는 핵심 이유다.

<strong>2. 약한 도구변수 문제 — IV 추정치의 구조적 불안정성</strong>

$\hat{\beta}_1^{\text{IV}} = \frac{\text{Cov}(Z, Y)}{\text{Cov}(Z, X)}$에서 분모 $\text{Cov}(Z, X)$가 작으면, 작은 오차가 결과를 크게 흔든다. 약한 도구변수를 쓰면 IV 추정치는 <strong>OLS보다 편향이 더 클 수 있다</strong>—인과추론을 하겠다고 쓴 방법이 오히려 상황을 악화시키는 것이다.

1단계 $F$-통계량으로 도구의 강도를 판단하는 관행이 있지만, 특정 수치를 기계적 기준으로 삼는 것은 위험하다. 중요한 것은 숫자가 아니라, <strong>1단계 관계가 이론적으로 강하고 실질적으로 의미 있는 크기인가</strong>를 판단하는 것이다.

<strong>3. LATE — "누구에 대한 효과인지 모른다"</strong>

IV가 추정하는 것은 ATE가 아니라 <strong>LATE(Local Average Treatment Effect)</strong>다. 앞서 2장에서 살짝 언급했으니 여기서는 ATE와의 <strong>구체적인 차이</strong>를 좀 더 풀어보자.

핵심 차이는 한 줄로 요약된다.

- <strong>ATE = $E[Y_i(1) - Y_i(0)]$</strong>: 모집단 <strong>전체</strong>의 평균 처치 효과. 누구를 골라서 평균 내는지 따지지 않음.
- <strong>LATE = $E[Y_i(1) - Y_i(0) \mid \text{complier}]$</strong>: 모집단의 일부 — <strong>compliers라는 특정 부분집단</strong>에 한정한 평균 처치 효과.

여기서 compliers가 누구인지가 결정적이다. 도구변수 $Z$를 도입하면 모집단은 $Z$와 $D$의 반응 관계에 따라 네 부류로 나뉜다 (이항 $Z, D$ 기준).

| 유형 | 정의 | 예 (베트남전 징병) |
|------|------|---------|
| <strong>Compliers</strong> | $Z=1$이면 $D=1$, $Z=0$이면 $D=0$. <strong>도구가 시키는 대로</strong> 처치 여부가 바뀌는 사람 | 추첨에 뽑혔으면 입대, 안 뽑혔으면 입대 안 함 |
| <strong>Always-takers</strong> | $Z$가 어떻든 항상 $D=1$ | 추첨과 무관하게 어차피 자원입대 |
| <strong>Never-takers</strong> | $Z$가 어떻든 항상 $D=0$ | 추첨에 뽑혀도 면제·기피로 입대 안 함 |
| <strong>Defiers</strong> | $Z=1$이면 $D=0$, $Z=0$이면 $D=1$. 도구가 시키는 것과 <strong>반대로</strong> 행동 | 보통은 없다고 가정 (monotonicity) |

ATE는 이 네 부류 <strong>전부</strong>의 가중 평균이다. 반면 IV/LATE는 always-takers는 $Z$와 무관하게 무조건 처치를 받고, never-takers는 무조건 안 받으므로 <strong>$Z$의 변이가 이들의 처치 여부를 흔들지 못한다</strong>. 그래서 $Z$를 도구로 쓰면, 이 두 그룹은 추정 대상에서 자동으로 빠진다. 남는 것은 "Z가 흔드는 대로 D가 바뀐 사람들" — 바로 compliers뿐이다.

이 차이가 실전에서 왜 문제가 되는지 구체적 예로 보자.

<strong>예 1 — 군 복무가 소득에 미치는 효과 (Angrist 1990)</strong>: 도구 = 베트남전 징병 추첨 번호. LATE는 "추첨 결과에 따라 입대 여부가 결정된 사람들"의 효과다. 즉 추첨이 없었다면 입대하지 않았을 사람이 추첨에 뽑혀 입대하게 된 케이스. 이들은 보통 자원입대자보다 동기·적성에서 덜 군과 맞는 사람들이다. 자원입대자(always-takers)의 효과는 이 추정치에 들어가지 않는다. 따라서 LATE는 <strong>"군에 대한 적성이 평균보다 낮은 한계적 입대자"</strong>의 효과지, 전체 입대자나 전 국민의 효과가 아니다. 만약 정책 질문이 "모병제로 모든 청년에게 군 복무를 의무화하면 평균 소득 효과는?"이라면, LATE는 이 질문에 직접 답하지 못한다.

<strong>예 2 — 교육이 소득에 미치는 효과 (Angrist & Krueger 1991)</strong>: 도구 = 출생 분기 (의무교육법상 졸업 가능 시점 차이를 만든다). LATE는 "출생 분기 때문에 교육을 더(혹은 덜) 받게 된 사람들" — 즉 의무교육 연한에 딱 걸린 한계적 학생들의 효과다. 대학원까지 가는 사람이나 초등학교만 마치는 사람의 효과는 잡히지 않는다. 따라서 LATE는 <strong>고졸 근처에서 1년 더 받느냐 마느냐의 한계 효과</strong>이지, 교육 수익률 전체의 평균이 아니다.

<strong>왜 이것이 IV의 결정적 약점인가</strong>: ATE라면 "모집단 평균이 X다"라고 단순하게 정책 결정에 쓸 수 있다. LATE는 그렇지 못하다. 효과의 크기를 안다 해도, <strong>그것이 누구의 효과인지</strong> — 정책 대상 집단과 compliers가 같은가, 다르다면 얼마나 다른가 — 를 추가로 논증해야 정책적 의미가 생긴다. 게다가 compliers의 정체는 데이터로 직접 볼 수 없으니, 그 논증은 본질적으로 이론적이다. <strong>"효과 크기는 알지만 누구의 효과인지는 정확히 모른다"</strong>는 상태가 LATE의 본질이고, 이 점이 ATE와의 결정적 차이다.

<strong>4. 현대 응용 연구의 추세</strong>

2000년대 이후 "credibility revolution" 이후, IV 논문은 점점 엄격한 심사를 받고 있다. 리뷰어들이 배제 제약에 대해 훨씬 더 까다로운 논증을 요구하면서, <strong>설득력 있는 도구변수를 찾기가 사실상 불가능에 가까운 경우가 많다</strong>. DID나 RDD처럼 연구 디자인 자체에서 식별이 드러나는 방법에 비해, IV는 "보이지 않는 가정"에 크게 의존한다는 점에서 학계의 신뢰가 상대적으로 떨어지고 있다.

<strong>이 수업의 입장</strong>: IV는 아이디어 자체는 이해할 가치가 있다. 특히 RDD가 Fuzzy일 때 IV 논리가 필요하기 때문이다. 그러나 독자적 인과추론 전략으로서 IV를 쓰는 것은 <strong>극도로 신중해야 한다</strong>. "도구변수를 찾았다"는 것은 연구의 시작이 아니라, 배제 제약을 설득력 있게 논증해야 하는 <strong>부담의 시작</strong>이다.

## 8. 회귀불연속설계(Regression Discontinuity Design) — 개념적으로 가장 깔끔한 준실험

### RDD의 핵심 아이디어

IV의 문제점을 지적한 직후에 RDD를 다루는 이유가 있다. <strong>RDD는 개념적으로 가장 깔끔한 준실험적 디자인이면서, 동시에 기술적으로는 IV와 깊은 관계에 있기 때문</strong>이다. 이 긴장 관계를 이해하는 것이 중요하다.

어떤 처치가 <strong>연속적인 점수(running variable)의 특정 커트라인(cutoff)</strong>을 기준으로 배정되는 상황을 생각하자.

- 선거에서 득표율 50%를 넘으면 당선, 넘지 못하면 낙선
- 장학금이 평점 3.5 이상이면 지급, 미만이면 미지급
- 특정 프로그램에 소득이 기준선 이하면 참여 가능

이런 상황에서 <strong>커트라인 바로 위와 바로 아래의 사람들</strong>을 비교하는 것이 RDD의 전략이다.

<strong>왜 이것이 인과추론에 유용한가?</strong> 커트라인 바로 위(50.1%)와 바로 아래(49.9%)의 후보는, 득표율이 0.2%p밖에 차이 나지 않는다. 이 미세한 차이는 사실상 <strong>운(luck)</strong>이다. 선거 당일 날씨, 약간의 투표율 변동 등에 의해 결정된 것이지, 후보의 본질적 차이를 반영하지 않는다.

따라서 커트라인 근처에서는 처치 배정이 <strong>"사실상 무작위(as-if random)"</strong>다. 커트라인 바로 위의 사람들(처치군)과 바로 아래의 사람들(대조군)은, 그 점수를 제외하면 평균적으로 동일하다.

![회귀불연속설계(RDD): 커트라인에서의 인과효과](images/rdd_plot.svg)

### Sharp RDD vs. Fuzzy RDD

| | Sharp RDD | Fuzzy RDD |
|--|--|--|
| <strong>처치 배정</strong> | 커트라인에서 처치 확률이 0에서 1로 <strong>완전히</strong> 점프 | 커트라인에서 처치 확률이 <strong>불연속적으로 변하지만</strong> 0→1은 아님 |
| <strong>예시</strong> | 평점 3.5 이상이면 100% 장학금 지급 | 평점 3.5 이상이면 장학금 <strong>신청 자격</strong>이 주어지지만, 실제 수령 여부는 다름 |
| <strong>추정 방법</strong> | 커트라인 양쪽의 $E[Y]$ 차이 = 인과효과 | IV와 유사한 방법으로 추정 (커트라인 = 도구변수) |

대부분의 현실 상황은 Fuzzy RDD에 가깝다. 커트라인을 넘었다고 모든 사람이 처치를 받는 것은 아니기 때문이다.

<strong>여기서 핵심적인 연결이 보인다</strong>: Fuzzy RDD는 본질적으로 <strong>커트라인을 도구변수로 쓰는 IV</strong>다. "커트라인 초과 여부"가 $Z$이고, "실제 처치 여부"가 $X$인 2SLS를 커트라인 근처에서 돌리는 것이다. 따라서 Fuzzy RDD는 IV의 한계(배제 제약 검증 불가, LATE 해석 등)를 그대로 물려받는다. 사실 좀 더 일반화하면 <strong>Sharp RDD도 IV의 특수한 경우</strong>로 볼 수 있다 — 이 점은 본 장 마지막 "다시 짚어보기: 왜 RDD가 본질적으로 IV인가" 절에서 상세히 풀어 본다.

### Sharp RDD의 수식

Sharp RDD의 식을 천천히 풀어보자. 기본 등장 인물은 세 가지다.

- <strong>$R_i$ — running variable (배정 변수)</strong>: 처치 여부를 결정하는 연속적인 점수. 시험 점수, 득표율, 나이, 소득 같은 변수다.
- <strong>$c$ — 커트라인 (cutoff)</strong>: 처치 여부를 가르는 임계값. 시험 합격선, 득표율 50%, 음주 허용 연령 21세 등.
- <strong>$D_i$ — 처치 여부</strong>: 단위 $i$가 처치를 받았는지(1) 아닌지(0).

Sharp RDD에서는 처치 여부가 오직 $R_i$와 $c$에 의해 <strong>기계적으로</strong> 결정된다. 식으로 쓰면 다음과 같다.

$$D_i = \mathbf{1}[R_i \geq c]$$

여기서 $\mathbf{1}[\cdot]$은 앞서 본 지시함수다. 즉 "$R_i$가 커트라인 $c$ 이상이면 $D_i = 1$, 아니면 $D_i = 0$"이라는 결정론적 규칙. 예: 시험 점수가 60점 이상이면 무조건 합격, 미만이면 무조건 탈락. 점수 ≥ 60인데 떨어진 사람이나 점수 < 60인데 붙은 사람은 없다 — 이것이 Sharp의 의미다 (Fuzzy는 이 결정론적 관계가 깨지는 경우).

<strong>인과효과의 식별 — 커트라인에서의 점프</strong>

핵심 아이디어는 다음과 같다. 커트라인 바로 위($R_i$가 $c$보다 아주 살짝 큰 사람들)와 바로 아래($c$보다 아주 살짝 작은 사람들)는 <strong>거의 동일한 사람들</strong>이다. 시험 점수 60점인 사람과 59.9점인 사람은 능력·동기 등에서 사실상 같다고 봐도 무리가 없다. 그런데 한쪽은 처치를 받고($D_i = 1$) 다른 쪽은 안 받는다($D_i = 0$). 그렇다면 두 집단의 $Y$ 차이는 <strong>오직 처치 때문</strong>이라고 볼 수 있다.

이를 식으로 옮기면:

$$\hat{\tau}_{\text{RDD}} = \lim_{r \downarrow c} E[Y_i | R_i = r] - \lim_{r \uparrow c} E[Y_i | R_i = r]$$

기호 하나씩 풀면:

- $E[Y_i | R_i = r]$: <strong>"$R_i$ 값이 정확히 $r$인 사람들의 $Y$ 평균"</strong>. 가로축이 $R$, 세로축이 $E[Y | R]$인 곡선을 머릿속에 그려보면 좋다.
- $\lim_{r \downarrow c}$: <strong>"$r$이 $c$보다 큰 쪽에서 $c$로 다가갈 때의 극한"</strong> (오른쪽 극한, right-hand limit). 즉 커트라인 <strong>바로 위</strong>에서의 $Y$ 기대값. 이 집단은 모두 $D_i = 1$.
- $\lim_{r \uparrow c}$: <strong>"$r$이 $c$보다 작은 쪽에서 $c$로 다가갈 때의 극한"</strong> (왼쪽 극한, left-hand limit). 즉 커트라인 <strong>바로 아래</strong>에서의 $Y$ 기대값. 이 집단은 모두 $D_i = 0$.
- 두 극한의 차이 = 커트라인에서 $E[Y | R]$ 곡선의 <strong>점프 크기</strong>.

$R$이 연속적이고, 처치가 없었다면 $E[Y | R]$ 곡선도 연속적이었을 것이다. 그런데 커트라인에서 곡선이 <strong>불연속적으로 점프</strong>한다면, 그 점프를 만들 수 있는 유일한 원인은 "커트라인을 넘는 순간 처치가 가해진다"는 사실뿐이다. 따라서 그 점프의 크기 = 처치의 인과효과다.

<strong>회귀로 추정하기</strong>

실전에서는 극한을 직접 계산할 수 없고, 표본은 유한하다. 대신 커트라인 근처의 데이터를 가지고 회귀를 돌린다.

$$Y_i = \alpha + \tau \cdot D_i + f(R_i - c) + \epsilon_i$$

이 식의 각 항이 하는 일을 풀면 다음과 같다.

- $\alpha$: 절편. 커트라인 바로 아래($D_i = 0$, $R_i = c$)에서 $Y$의 기대값에 해당.
- $\tau \cdot D_i$: 처치 더미. <strong>$\tau$가 우리가 알고 싶은 처치 효과 추정치</strong>다. $D_i$는 커트라인에서 0 → 1로 점프하므로, $\tau$가 곧 $Y$의 점프 크기를 잡아낸다.
- $f(R_i - c)$: <strong>$R$의 매끄러운 함수</strong>. 커트라인에서 $R$을 중심으로 재정렬한 값 $R_i - c$의 함수 형태로 들어간다. "처치를 제외하면 $Y$가 $R$에 따라 어떻게 변하는가"라는 <strong>배경 추세</strong>를 통제하는 항이다. 예를 들어 점수가 높을수록 원래 결과도 좋다면, 그 효과를 흡수한다. 보통 1차 다항식(로컬 선형), 2차 다항식, 또는 커트라인 양쪽에서 서로 다른 기울기를 허용하는 형태($\beta_L (R_i - c) + \beta_R (R_i - c) D_i$ 같은)로 쓴다.
- $\epsilon_i$: 오차항.

$f$가 커트라인에서 연속이라고 가정하면, $R_i = c$에서 $D_i$만 0 → 1로 점프하므로 $Y$의 점프 = $\tau$로 깔끔하게 식별된다. 즉 <strong>"커트라인을 넘는 순간 $Y$가 얼마나 갑자기 변하는가"를 회귀계수 하나로 잡아낸 것</strong>이 $\hat{\tau}$다.

<strong>실무적 선택지</strong>: $f$를 어떤 함수형으로 쓸지(다항식 차수), 커트라인에서 얼마나 떨어진 데이터까지 쓸지(bandwidth)가 핵심 결정이다. 멀리까지 쓰면 표본은 늘어나지만 "커트라인 근처 비교"라는 RDD의 정신이 흐려지고, 너무 좁게 쓰면 분산이 커진다. 이 선택에 따라 추정치가 흔들릴 수 있어, 보통 여러 bandwidth/차수에서의 결과를 함께 보고하는 것이 표준 관행이다.

### 유명 사례들

| 연구 | Running Variable | 커트라인 | 처치 | 결과 | 발견 |
|------|-----------------|---------|------|------|------|
| Lee (2008) | 선거 득표율 | 50% | 현직 효과 (당선) | 다음 선거 득표율 | 근소 당선 vs 근소 낙선 비교 → 현직 프리미엄 추정 |
| Carpenter & Dobkin (2009) | 나이 | 21세 (미국 음주 허용) | 합법적 음주 | 사망률 | 21세 직후 사망률 급증 → 음주의 건강 영향 |
| Pop-Eleches & Urquiola (2013) | 입학 시험 점수 | 학교별 커트라인 | 더 좋은 학교 입학 | 학업 성취 | 커트라인 바로 위/아래 비교 → 학교 질의 효과 |

### RDD의 한계

<strong>1. 로컬 추정치 (Local Estimate)</strong>

RDD가 추정하는 것은 <strong>커트라인 근처에서의 인과효과</strong>일 뿐이다. 득표율 50% 근처에서 추정된 현직 프리미엄이, 득표율 70%로 압승한 후보에게도 동일하게 적용되는지는 알 수 없다. IV의 LATE와 마찬가지로, 일반화에 주의가 필요하다.

<strong>2. 대역폭(bandwidth) 선택</strong>

"커트라인 근처"를 얼마나 좁게 잡을 것인가? 좁게 잡으면 무작위성은 높아지지만 표본이 줄어들어 추정이 부정확해진다. 넓게 잡으면 표본은 커지지만 커트라인에서 먼 사람들이 포함되어 무작위 가정이 약해진다. 이 trade-off를 관리하는 것이 RDD의 실질적 도전이다.

<strong>3. 조작(manipulation) 가능성</strong>

개인이 커트라인을 알고 running variable을 조작할 수 있으면 RDD가 무너진다. 예를 들어, 장학금 커트라인이 3.5인 것을 학생이 알고 교수에게 성적 조정을 요청한다면, 커트라인 근처에서 "사실상 무작위"라는 가정이 깨진다.

- 검증 방법: running variable의 분포가 커트라인에서 <strong>불연속적으로 밀집(bunching)</strong>되어 있지 않은지 확인한다 (McCrary density test)

```mermaid
flowchart TD
    A["<b>RDD</b>"] --> B["장점"]
    A --> C["한계"]
    B --> D["커트라인 근처에서<br/>사실상 무작위"]
    B --> E["시각적으로<br/>직관적"]
    C --> F["로컬 추정치<br/>(일반화 어려움)"]
    C --> G["대역폭 선택에<br/>민감"]
    C --> H["조작 가능성<br/>검증 필요"]
```

### 다시 짚어보기: 왜 RDD가 본질적으로 IV인가

앞에서 Fuzzy RDD가 "커트라인을 도구변수로 쓰는 IV"라고 짧게 언급했다. 이 연결이 RDD를 이해하는 데 결정적으로 중요하니, 마무리하면서 좀 더 정밀하게 풀어보자. <strong>사실은 Sharp RDD도 IV의 특수한 경우</strong>로 볼 수 있다.

<strong>두 방법을 같은 틀에 놓고 보자</strong>

RDD와 IV는 표면적으로 매우 달라 보인다. RDD는 "커트라인에서의 점프"를 보는 시각적·국소적 방법이고, IV는 "외생적 변수 $Z$로 $X$를 정제"하는 추상적·전역적 방법이다. 그런데 핵심 논리를 들여다보면 둘은 정확히 같은 일을 한다.

| 방법 | 외생적 변이의 출처 | $X$를 흔드는 도구 | 식별의 핵심 |
|------|-------------------|-----------------|------------|
| <strong>IV</strong> | 외부 변수 $Z$ (예: 추첨 번호, 의무교육 연한, 대학 근접성) | $Z$의 변이 | $Z$는 $X$를 흔들지만 $Y$에는 직접 영향 없음 |
| <strong>Sharp RDD</strong> | "커트라인 초과 여부" $\mathbf{1}[R_i \geq c]$ | running variable의 커트라인 통과 | 커트라인 근처에서 $R$ 자체는 $Y$에 연속적으로만 영향 |
| <strong>Fuzzy RDD</strong> | "커트라인 초과 여부" $\mathbf{1}[R_i \geq c]$ | 같음 (단, $D$가 100% 결정되진 않음) | 같음 |

RDD에서 우리가 활용하는 외생적 변이는 결국 <strong>"커트라인을 넘었는가 안 넘었는가"</strong>라는 이진 변수다. 이걸 $Z_i = \mathbf{1}[R_i \geq c]$로 정의해보면, RDD는 그저 <strong>"$Z$를 도구변수로 삼아 처치 $D$의 인과효과를 추정하는 IV"</strong>다. 차이는 단지 $Z$가 어디서 왔는가 — 외부에서 가져왔는가, 아니면 running variable의 임계값에서 만들었는가 — 뿐이다.

<strong>Sharp RDD = 1단계가 결정론적인 IV</strong>

Sharp RDD에서는 커트라인을 넘으면 무조건 처치($D = 1$), 넘지 않으면 무조건 비처치($D = 0$). 즉 $D_i = Z_i$가 완벽하게 성립한다. IV 언어로 옮기면 <strong>1단계 회귀</strong>가 다음과 같이 자명한 형태가 된다.

$$D_i = 0 + 1 \cdot Z_i + 0$$

1단계 계수 $\pi_1 = 1$, 잔차 0. 도구 $Z$가 처치 $D$를 100% 설명한다는 뜻이다. 그러면 2단계에서 $\hat{D}_i = Z_i$로 회귀하면, 결국 "$Y$를 $Z$에 회귀"한 것과 같아진다. 이게 바로 RDD의 점프 추정량과 일치한다 — "커트라인 위/아래의 $Y$ 평균 차이"가 곧 인과효과.

다르게 말하면, <strong>Sharp RDD에서 추정한 점프는 IV의 왈드 추정량 $\hat{\beta}^{\text{IV}} = \text{Cov}(Z,Y) / \text{Cov}(Z,X)$에서 분모가 1로 떨어진 특수 케이스</strong>다. 분모로 나눌 필요가 없는, 가장 깨끗한 IV.

<strong>Fuzzy RDD = 1단계가 불완전한 IV</strong>

Fuzzy RDD에서는 커트라인을 넘었다고 다 처치를 받는 게 아니다. 예: 평점 3.5 이상이면 장학금 신청 자격이 생기지만, 실제로 신청·수령하는 사람은 일부다. 그러면 $Z = \mathbf{1}[R \geq c]$가 $D$를 100%가 아니라 일부만 흔든다. 1단계 회귀를 돌리면 $\pi_1 < 1$이 된다.

이 경우 RDD 추정량은 다음과 같이 정의된다.

$$\hat{\tau}_{\text{Fuzzy RDD}} = \frac{\lim_{r \downarrow c} E[Y \mid R = r] - \lim_{r \uparrow c} E[Y \mid R = r]}{\lim_{r \downarrow c} E[D \mid R = r] - \lim_{r \uparrow c} E[D \mid R = r]}$$

분자는 커트라인에서 <strong>$Y$의 점프</strong>(reduced form), 분모는 커트라인에서 <strong>$D$의 점프</strong>(first stage). 이거 어디서 본 모양 아닌가? 정확히 <strong>왈드 추정량의 RDD 버전</strong>이다.

$$\hat{\tau}_{\text{Fuzzy RDD}} = \frac{Y\text{의 점프}}{D\text{의 점프}} = \frac{\text{reduced form}}{\text{first stage}}$$

여기서 도구변수의 역할을 하는 것이 바로 "커트라인 초과 여부"다. 본질적으로 Fuzzy RDD는 "커트라인 근처라는 좁은 동네에 한정해서 돌린 IV"인 셈이다.

<strong>그래서 RDD는 IV의 한계를 어디까지 물려받는가</strong>

이 동일성에서 따라오는 결과가 중요하다.

- <strong>LATE 해석</strong>: RDD가 추정하는 효과도 ATE가 아니다. Sharp RDD는 "커트라인 근처에서의 평균 효과", Fuzzy RDD는 "커트라인 근처의 compliers에 대한 평균 효과". IV가 compliers에 한정된 LATE를 잡듯, RDD도 커트라인 부근이라는 좁은 부분집단의 효과만 잡는다. 일반화는 추가 논증이 필요하다.
- <strong>배제 제약</strong>: RDD에서도 "$R$이 커트라인을 넘은 것 자체가 $Y$에 직접 영향을 미치지 않는다"는 가정이 필요하다. 이게 깨지는 경우는 예컨대 running variable의 조작(manipulation)이 있는 경우 — 학생이 커트라인을 알고 점수를 의도적으로 맞추면, 커트라인 통과 자체가 "노력·연줄·정보 접근" 같은 다른 요인의 신호가 되어 $Y$에 직접 영향을 줄 수 있다.

<strong>그렇다면 RDD가 IV보다 나은 점은 무엇인가</strong>

본질이 같은데도 RDD가 IV보다 학계의 신뢰를 더 받는 이유는 두 가지다.

1. <strong>외생성 가정의 투명성</strong>: IV에서 "$Z$가 $Y$에 직접 영향이 없는가"는 보통 길고 추상적인 이론적 논증이 필요하다. 반면 RDD의 외생성 가정은 <strong>"커트라인 근처에서 단위들이 사실상 무작위로 양쪽에 떨어졌는가"</strong>라는 매우 구체적인 질문으로 환원된다. 이는 (a) running variable 분포의 연속성 검정(McCrary test), (b) 커트라인 근처에서 다른 공변량들이 균형 잡혀 있는지의 검정 등 <strong>간접 검증 수단</strong>이 존재한다.
2. <strong>식별이 디자인에서 보임</strong>: RDD는 "왜 인과효과인가"가 그래프 하나에서 드러난다. 커트라인에서 $Y$가 갑자기 점프하면 그게 효과다. IV는 결국 회귀계수의 비율이라 직관적 시각화가 어렵다.

요약하면 <strong>RDD는 "검증 가능한 가정으로 무장한 IV"</strong>다. 같은 식별 논리를 쓰지만, 가정을 데이터로 부분적으로 검증할 수 있다는 점에서 IV의 한계를 일부 완화한다 — 그래서 4가지 전략 중에서 IV보다 위계가 높은 자리에 놓이게 된다.

## 9. 네 가지 전략의 비교 — 동등하지 않다

### 위계가 있다

이번 수업에서 네 가지 방법을 다뤘지만, 이것들이 동등한 선택지는 아니다. <strong>설득력의 위계</strong>가 존재한다.

```mermaid
flowchart TD
    A["<b>Tier 1: 실험 (RCT / A/B Test)</b><br/>무작위 배정 = 선택 편향 소거<br/>가정이 설계에 의해 보장됨"] --> B["<b>Tier 2: DID</b><br/>평행 추세 가정 필요하지만<br/>간접 검증 가능 + 직관적"]
    B --> C["<b>Tier 3: RDD (Sharp)</b><br/>개념적으로 깔끔하지만<br/>로컬 추정치 + 조작 우려"]
    C --> D["<b>Tier 4: RDD (Fuzzy) ≈ IV</b><br/>배제 제약 검증 불가<br/>LATE 해석 문제"]
    D --> E["<b>Tier 5: OLS + 통제변수</b><br/>인과 해석 매우 제한적"]
```

왜 이런 위계가 생기는가? 핵심은 <strong>"가정의 투명성과 검증 가능성"</strong>이다.

| | 핵심 가정 | 검증 가능한가? | 가정이 깨지면? |
|--|--|--|--|
| <strong>RCT</strong> | 무작위 배정 | 배정 과정 자체로 보장 | 배정 과정의 결함 → 재실험 가능 |
| <strong>DID</strong> | 평행 추세 | 사전 추세로 간접 검증 가능 | event study plot으로 시각적 확인 |
| <strong>RDD (Sharp)</strong> | 커트라인 근처 무작위 | McCrary test로 간접 검증 가능 | 조작 여부를 데이터에서 탐지 가능 |
| <strong>IV / RDD (Fuzzy)</strong> | 배제 제약 | <strong>검증 불가능</strong> | 편향 방향조차 알 수 없음 |
| <strong>OLS</strong> | 외생성 ($E[\epsilon|X]=0$) | <strong>검증 불가능</strong> | 누락 변수 편향 |

<strong>위계의 기준은 명확하다</strong>: 가정이 투명하고 검증 가능할수록 설득력이 높다. RCT는 가정이 설계에 내장되어 있다. DID와 Sharp RDD는 가정을 간접적으로 검증할 수 있다. IV는 핵심 가정인 배제 제약을 검증할 방법이 없다—"믿어달라"고 논증하는 수밖에 없다.

### 실용적 판단 흐름

```mermaid
flowchart TD
    A["인과적 질문이 있다"] --> B{"무작위 배정이<br/>가능한가?"}
    B -->|"예"| C["<b>RCT / A/B Test</b><br/>가장 깔끔한 답"]
    B -->|"아니오"| D{"패널 데이터가 있고<br/>처치 시점이<br/>명확한가?"}
    D -->|"예"| E["<b>DID</b><br/>사전 추세 반드시 검증"]
    D -->|"아니오"| F{"처치 배정이<br/>커트라인에<br/>의존하는가?"}
    F -->|"예 (Sharp)"| G["<b>Sharp RDD</b><br/>조작 검증 필수"]
    F -->|"예 (Fuzzy)"| H["<b>Fuzzy RDD ≈ IV</b><br/>배제 제약 논증 필요<br/>⚠️ IV의 위험 공유"]
    F -->|"아니오"| I["OLS + 통제변수<br/>인과 해석 극도로 신중"]
```

"어떤 방법이 가장 좋은가"가 아니라, <strong>"이 상황에서 가장 투명한 식별 전략은 무엇인가"</strong>를 묻는 것이다. 그리고 대부분의 사회과학 연구에서 실질적으로 가장 많이, 가장 설득력 있게 쓰이는 것은 <strong>DID</strong>다. 패널/반복 횡단면 데이터만 있으면 적용할 수 있고, 평행 추세 가정을 시각적으로 보여줄 수 있기 때문이다.

IV를 독자적 전략으로 쓰는 경우는 점점 줄어들고 있다. "좋은 도구변수를 찾았다"고 주장하는 논문은 이제 심사 과정에서 매우 높은 논증 부담을 지게 되며, 배제 제약에 대한 회의론을 극복하기가 갈수록 어렵다.

## 10. Identification > Estimation — 인과추론에서 정말 중요한 것

### "어떻게 추정하는가"보다 "왜 이것이 인과효과인가"

이 수업에서 가장 중요한 메시지는 이것이다:

> <strong>Identification(식별)이 Estimation(추정)보다 중요하다.</strong>

<strong>추정(Estimation)</strong>은 "OLS로 돌릴 것인가, 2SLS로 돌릴 것인가, 로버스트 표준오차를 쓸 것인가" 같은 기술적 문제다. 이것은 중요하지만, <strong>식별(Identification)</strong>이 확보되지 않으면 의미가 없다.

<strong>식별(Identification)</strong>은 "왜 이 추정치가 인과효과로 해석될 수 있는가?"에 대한 논증이다. 어떤 가정이 성립해야 하고, 그 가정이 이 맥락에서 합리적인지를 설명하는 것이다.

### 식별 전략의 핵심: "편향이 왜 없는가?"

모든 인과추론 방법의 핵심은 동일하다: <strong>"선택 편향이 왜 사라지는가?"를 설득력 있게 설명하는 것</strong>.

| 방법 | 식별 논증 | 논증의 설득력 |
|------|----------|-------------|
| <strong>RCT</strong> | "무작위 배정했으므로 처치군과 대조군이 사전에 동일하다" | 설계 자체가 보장 — 가장 강력 |
| <strong>DID</strong> | "처치가 없었다면 두 집단의 추세가 동일했을 것이다" | 사전 추세로 간접 입증 가능 — 강력 |
| <strong>RDD</strong> | "커트라인 근처에서 처치 배정이 사실상 무작위다" | 시각적으로 보여줄 수 있음 — 설득적 |
| <strong>IV</strong> | "도구변수가 $X$를 통해서만 $Y$에 영향을 미친다" | 검증 불가, 이론적 논증에 의존 — 취약 |

이 논증이 설득력 없으면, 아무리 정교한 추정 기법을 써도 결과를 믿을 수 없다. 반대로, 식별이 깔끔하면 단순한 OLS로도 인과효과를 추정할 수 있다 — DID가 바로 그런 예다 (교차항이 있는 OLS일 뿐이다). <strong>방법론의 복잡성과 설득력은 비례하지 않는다. DID는 기술적으로 가장 단순하면서도, 설득력 있는 식별을 제공하는 경우가 많다.</strong>

### 흔한 실수: 기법에 집착하고 식별을 무시하기

학부생과 대학원 초기 연구자들이 자주 하는 실수:

<strong>실수 1: "도구변수를 썼으니 인과효과다"</strong>

도구변수를 썼다는 것 자체가 인과효과를 보장하지 않는다. 배제 제약이 성립하는지, 도구가 충분히 강한지를 논증해야 한다. 나쁜 도구변수를 쓰면 OLS보다 더 나쁜 추정치가 나올 수 있다.

<strong>실수 2: "DID를 돌렸으니 인과효과다"</strong>

평행 추세 가정이 성립하는지 확인했는가? 사전 추세 검증을 하지 않고 DID를 돌리면, 사실은 편향된 추정치를 "인과효과"라고 주장하는 것이다.

<strong>실수 3: "통제변수를 많이 넣었으니 인과효과다"</strong>

지난주에 다뤘듯, 통제변수를 많이 넣는다고 내생성이 해결되지 않는다. 오히려 bad control 문제가 생길 수 있다. 누락 변수 편향은 "빠뜨린 변수"가 문제인데, 관측 불가능한 변수(능력, 동기, 선호 등)는 데이터에 없으니 통제할 수 없다.

### 좋은 실증 연구의 구조

첫 수업에서 "어떤 데이터 분석이 중요한가"를 논의했다. 좋은 실증 연구(empirical research)는 대략 이런 구조를 따른다:

```mermaid
flowchart TD
    A["<b>1. 질문</b><br/>X가 Y에 인과적 영향을<br/>미치는가?"] --> B["<b>2. 식별 전략</b><br/>왜 이 방법이 인과효과를<br/>식별하는가?"]
    B --> C["<b>3. 가정의 명시</b><br/>어떤 가정이 필요하고<br/>그것이 합리적인가?"]
    C --> D["<b>4. 추정</b><br/>데이터 + 통계 기법으로<br/>계수 추정"]
    D --> E["<b>5. 강건성 검증</b><br/>가정이 약간 바뀌어도<br/>결론이 유지되는가?"]
    E --> F["<b>6. 해석</b><br/>효과의 크기가<br/>실질적으로 의미 있는가?"]
```

<strong>2단계(식별 전략)가 가장 중요하다.</strong> 여기가 약하면 나머지가 아무리 정교해도 연구 전체가 흔들린다.

### 이 수업의 남은 여정

| 날짜 | 주제 | 사용 방법론 | 실습 데이터 |
|------|------|-----------|-----------|
| 4월 3일 | 회귀분석 실습 | OLS + 통제변수 | 10대 청소년 정치성향 설문 |
| 5월 1일 | 패널 데이터 인과추론 실습 | DID + 고정효과 | 용산 이전 × 교통량 |
| 5월 29일 | 텍스트 분석 | embedding + 클러스터링 | 네이버·유튜브·디시 댓글 |

오늘 배운 인과추론의 프레임워크(잠재적 결과, 선택 편향, 식별 전략)는 이후 모든 실습의 기반이 된다. 특히 5월 1일의 DID 실습에서 오늘 이론으로 다룬 내용을 실제 데이터로 구현할 것이다.
</script>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

<script>
(function() {
  'use strict';

  mermaid.initialize({
    startOnLoad: false,
    theme: 'base',
    themeVariables: {
      primaryColor: '#e8f0fe',
      primaryBorderColor: '#0055aa',
      primaryTextColor: '#1a1a2e',
      lineColor: '#0055aa',
      secondaryColor: '#f7f8fa',
      tertiaryColor: '#fff'
    },
    flowchart: { htmlLabels: true, curve: 'basis' },
    fontFamily: "'Noto Sans KR', sans-serif"
  });

  // ===== 0. CONFIGURE MARKED — disable strikethrough (~ is used in Korean text) =====
  marked.use({
    gfm: true,
    extensions: [{
      name: 'del',
      level: 'inline',
      start(src) { return undefined; },
      tokenizer(src) { return undefined; }
    }]
  });

  // ===== 1. EXTRACT MARKDOWN =====
  const rawMd = document.getElementById('markdown-source').textContent;

  // ===== 2. SPLIT INTO SLIDES =====
  function splitSlides(md) {
    const lines = md.split('\n');
    const slides = [];
    let buf = [];
    let currentSection = '';
    let currentSectionNum = '';
    let inTitle = true;
    let titleBuf = [];

    function flush() {
      if (buf.length > 0) {
        const text = buf.join('\n').trim();
        if (text) {
          slides.push({ type: 'content', section: currentSection, sectionNum: currentSectionNum, content: text });
        }
        buf = [];
      }
    }

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];

      // Title slide: collect until first ---
      if (inTitle) {
        if (/^---$/.test(line.trim())) {
          inTitle = false;
          slides.push({ type: 'title', content: titleBuf.join('\n').trim() });
          continue;
        }
        titleBuf.push(line);
        continue;
      }

      // Section divider: ## N. ...
      const sectionMatch = line.match(/^## (\d+)\.\s+(.*)/);
      if (sectionMatch) {
        flush();
        currentSectionNum = sectionMatch[1];
        currentSection = sectionMatch[2];
        slides.push({ type: 'divider', section: currentSection, sectionNum: currentSectionNum });
        continue;
      }

      // --- separator between sections
      if (/^---$/.test(line.trim())) {
        flush();
        continue;
      }

      // Subsection ### starts new slide
      if (/^### /.test(line)) {
        flush();
        buf.push(line);
        continue;
      }

      buf.push(line);
    }
    flush();
    return slides;
  }

  const slides = splitSlides(rawMd);

  // ===== 3. RENDERING HELPERS =====
  function protectMath(md) {
    const store = [];
    let idx = 0;

    // Display math $$...$$
    md = md.replace(/\$\$([\s\S]*?)\$\$/g, (m) => {
      const key = '\x00DISP' + (idx++) + '\x00';
      store.push({ key, val: m });
      return key;
    });

    // Inline math $...$  (not $$)
    md = md.replace(/(?<!\$)\$(?!\$)([^\$\n]+?)\$(?!\$)/g, (m) => {
      const key = '\x00INLN' + (idx++) + '\x00';
      store.push({ key, val: m });
      return key;
    });

    return { md, store };
  }

  function protectMermaid(md) {
    const store = [];
    let idx = 0;
    md = md.replace(/```mermaid\n([\s\S]*?)```/g, (m, code) => {
      const key = '\x00MERM' + (idx++) + '\x00';
      store.push({ key, val: code });
      return key;
    });
    return { md, store };
  }

  function restoreAll(html, mathStore, mermaidStore) {
    for (const { key, val } of mathStore) {
      html = html.split(key).join(val);
    }
    for (const { key, val } of mermaidStore) {
      html = html.split(key).join('<pre class="mermaid">' + val + '</pre>');
    }
    return html;
  }

  function renderMarkdown(content) {
    const m1 = protectMath(content);
    const m2 = protectMermaid(m1.md);
    let html = marked.parse(m2.md);
    html = restoreAll(html, m1.store, m2.store);
    return html;
  }

  // ===== 4. BUILD SLIDE ELEMENTS =====
  const container = document.getElementById('presentation');
  const slideEls = [];

  slides.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'slide';
    el.dataset.section = s.section || '';
    el.dataset.sectionNum = s.sectionNum || '';

    if (s.type === 'title') {
      el.classList.add('slide-title');
      // Parse title content
      const tlines = s.content.split('\n');
      let h1 = '', h2 = '', meta = '';
      for (const tl of tlines) {
        if (tl.startsWith('# ') && !tl.startsWith('## ')) h1 = tl.replace(/^# /, '');
        else if (tl.startsWith('## ')) h2 = tl.replace(/^## /, '');
        else if (tl.startsWith('> ')) meta = tl.replace(/^>\s*/, '').replace(/\*\*/g, '');
      }
      el.innerHTML = '<div class="slide-inner">' +
        '<h1>' + h1 + '</h1>' +
        '<h2>' + h2 + '</h2>' +
        '<div class="meta">' + meta + '</div></div>';
    } else if (s.type === 'divider') {
      el.classList.add('slide-divider');
      el.innerHTML = '<div class="slide-inner">' +
        '<div class="section-number">' + s.sectionNum + '</div>' +
        '<div class="section-title">' + s.section + '</div></div>';
    } else {
      el.classList.add('slide-content');
      const inner = document.createElement('div');
      inner.className = 'slide-inner';
      inner.innerHTML = renderMarkdown(s.content);
      el.appendChild(inner);
    }

    if (i !== 0) el.style.display = 'none';
    else el.classList.add('active');

    container.appendChild(el);
    slideEls.push(el);
  });

  // ===== 5. RENDER KATEX & MERMAID =====
  async function renderSpecial() {
    // KaTeX
    slideEls.forEach(el => {
      if (el.classList.contains('slide-content')) {
        renderMathInElement(el, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false }
          ],
          throwOnError: false,
          trust: true
        });
      }
    });

    // Mermaid
    const mermaidEls = document.querySelectorAll('.mermaid');
    if (mermaidEls.length > 0) {
      // Temporarily show all slides so mermaid can measure
      slideEls.forEach(el => { el.style.display = 'flex'; el.style.visibility = 'hidden'; });
      try { await mermaid.run({ nodes: mermaidEls }); } catch(e) { console.warn('Mermaid error:', e); }
      slideEls.forEach((el, i) => {
        el.style.visibility = '';
        if (i !== currentSlide) { el.style.display = 'none'; el.classList.remove('active'); }
        else { el.style.display = 'flex'; el.classList.add('active'); }
      });
    }
  }

  // ===== 6. NAVIGATION =====
  let currentSlide = 0;
  const total = slideEls.length;

  const counterEl = document.getElementById('slide-counter');
  const progressEl = document.getElementById('progress-fill');
  const sectionEl = document.getElementById('section-indicator');

  function updateUI() {
    counterEl.textContent = (currentSlide + 1) + ' / ' + total;
    progressEl.style.width = ((currentSlide + 1) / total * 100) + '%';
    const sec = slideEls[currentSlide].dataset.sectionNum;
    const secName = slideEls[currentSlide].dataset.section;
    if (sec) sectionEl.textContent = sec + '. ' + secName;

    // White counter on dark divider slides
    const isDivider = slideEls[currentSlide].classList.contains('slide-divider');
    counterEl.style.color = isDivider ? 'rgba(255,255,255,0.5)' : '';
    sectionEl.style.color = isDivider ? 'rgba(255,255,255,0.4)' : '';
  }

  function goTo(n) {
    if (n < 0 || n >= total || n === currentSlide) return;
    slideEls[currentSlide].style.display = 'none';
    slideEls[currentSlide].classList.remove('active');
    currentSlide = n;
    slideEls[currentSlide].style.display = 'flex';
    slideEls[currentSlide].classList.add('active');
    slideEls[currentSlide].scrollTop = 0;
    updateUI();
  }

  window.nextSlide = function() { goTo(currentSlide + 1); };
  window.prevSlide = function() { goTo(currentSlide - 1); };

  // Keyboard
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ' || e.key === 'PageDown') {
      e.preventDefault(); nextSlide();
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'Backspace' || e.key === 'PageUp') {
      e.preventDefault(); prevSlide();
    } else if (e.key === 'Home') {
      e.preventDefault(); goTo(0);
    } else if (e.key === 'End') {
      e.preventDefault(); goTo(total - 1);
    }
  });

  // Click navigation removed — use keyboard arrows or nav buttons only

  // Touch swipe
  let touchStartX = 0;
  container.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
  container.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].screenX - touchStartX;
    if (Math.abs(dx) > 50) {
      if (dx < 0) nextSlide();
      else prevSlide();
    }
  }, { passive: true });

  // ===== 7. PAGE JUMP =====
  const pageJumpEl = document.getElementById('page-jump');
  const pageJumpInput = document.getElementById('page-jump-input');
  const pageJumpTotal = document.getElementById('page-jump-total');
  const pageJumpBtn = document.getElementById('page-jump-btn');

  pageJumpTotal.textContent = '/ ' + total;

  counterEl.addEventListener('click', (e) => {
    e.stopPropagation();
    counterEl.style.display = 'none';
    pageJumpEl.style.display = 'flex';
    pageJumpInput.value = '';
    pageJumpInput.focus();
  });

  function doJump() {
    const n = parseInt(pageJumpInput.value, 10);
    if (!isNaN(n) && n >= 1 && n <= total) {
      goTo(n - 1);
    }
    pageJumpEl.style.display = 'none';
    counterEl.style.display = '';
  }

  pageJumpBtn.addEventListener('click', doJump);
  pageJumpInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); doJump(); }
    if (e.key === 'Escape') { pageJumpEl.style.display = 'none'; counterEl.style.display = ''; }
    e.stopPropagation(); // prevent slide navigation while typing
  });
  pageJumpInput.addEventListener('keyup', (e) => e.stopPropagation());

  // Close jump box when clicking outside
  document.addEventListener('click', (e) => {
    if (pageJumpEl.style.display === 'flex' && !pageJumpEl.contains(e.target)) {
      pageJumpEl.style.display = 'none';
      counterEl.style.display = '';
    }
  });

  // ===== 8. INIT =====
  updateUI();
  renderSpecial();

})();
</script>
</body>
</html>
